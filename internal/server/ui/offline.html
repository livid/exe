<style>

   blocks are the desktop's own (index.html), copied verbatim. */

}

  user-select: none; cursor: default;
  display: flex; align-items: center; justify-content: center;
  padding: var(--sat) calc(16px + var(--sar)) var(--sab) calc(16px + var(--sal));
}
.window {
  position: relative; z-index: 10; min-width: 220px; width: 100%; max-width: 380px;
  background: var(--g400); border: 1px solid var(--black);
  box-shadow: 2px 2px 0 var(--black);
}
.window::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4; box-sizing: border-box;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), inset -1px -1px 0 var(--g600), inset 1px 1px 0 #fff; }
.titlebar { display: flex; align-items: center; gap: 4px; padding: 2px 4px;
  background: var(--g400); user-select: none; }
.titlebar .stripe { flex: 1; height: 12px; min-width: 8px; position: relative;
  background-color: var(--g300);
  background-image: linear-gradient(#fff, #fff 50%, #777 50%, #777);
  background-size: 100% 2px; background-repeat: repeat; }
.titlebar .stripe::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 1px; box-sizing: border-box;
  background-image: linear-gradient(#fff, #fff 50%, #ccc 50%, #ccc);
  background-size: 100% 2px; background-repeat: repeat; border-bottom: 1px solid #ccc; }
.titlebar .stripe::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 1px; box-sizing: border-box;
  background-image: linear-gradient(#ccc, #ccc 50%, #777 50%, #777);
  background-size: 100% 2px; background-repeat: repeat; }
/* Movable alert box title bar (HIG OS 8 fig. 3-4): nothing but red
   stripes — no title, no boxes. */
.titlebar.alert-bar { background: #fcc; }
.titlebar.alert-bar .stripe { background-color: #fcc;
  background-image: linear-gradient(#fff, #fff 50%, #f66 50%, #f66); }
.titlebar.alert-bar .stripe::before {
  background-image: linear-gradient(#fff, #fff 50%, #f99 50%, #f99);
  border-bottom-color: #f99; }
.titlebar.alert-bar .stripe::after {
  background-image: linear-gradient(#f99, #f99 50%, #f66 50%, #f66); }
.win-body { padding: 14px 14px 12px; }
.row { display: flex; align-items: center; }
button.ghost {
  background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold;
  font-family: var(--font); height: 20px; min-width: 58px; cursor: default;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa;
}
button.ghost:active {
  background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
/* the Return default wears the ring */
button.ghost.default { outline: 2px solid var(--black); outline-offset: 1px; border-radius: 4px; }

</head>
<body>
<div class="window">
  <div class="titlebar alert-bar"><div class="stripe"></div></div>
  <div class="win-body">
    <div class="row" style="gap:20px; align-items:flex-start; margin-bottom:24px">
      <!-- the exe Mac with its screen dark -->
      <svg width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges" style="flex:none" aria-hidden="true">
        <rect x="6.5" y="1.5" width="19" height="24" fill="#DAD5CA" stroke="#000"/>
        <rect x="10.5" y="5.5" width="11" height="8" fill="#55524B" stroke="#000"/>
        <rect x="12" y="18" width="8" height="2" fill="#55524B"/>
        <rect x="9.5" y="25.5" width="13" height="3" fill="#C8C3B8" stroke="#000"/>
      </svg>
      <div style="flex:1; min-width:0">
        <div style="font-weight:bold; font-size:12px; line-height:1.35">exe is not answering.</div>
        <div style="font-size:11px; line-height:1.45; margin-top:7px">The desktop could not reach its daemon at <span id="host"></span>. It may be restarting, or this device may be offline. This page keeps trying and the desktop returns on its own.</div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end; margin:0 0 2px">
      <button class="ghost default" id="retry" type="button">Try Again</button>
    </div>
  </div>
</div>
<script>
document.getElementById("host").textContent = location.host;
document.getElementById("retry").addEventListener("click", () => location.reload());
addEventListener("keydown", e => { if (e.key === "Enter") location.reload(); });
// a HEAD of the desktop is not a navigation, so the worker lets it reach
// the network; the moment the daemon answers, the desktop comes back
const probe = async () => {
  try { const r = await fetch("/", { method: "HEAD", cache: "no-store" }); if (r.ok) location.reload(); } catch (e) {}
};
addEventListener("online", probe);
setInterval(probe, 3000);
</script>
</body>
</html>
