<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blue Pencil</title>
<style>
/* Platinum values match the exe desktop (same block as the Notes and Hub apps) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --red: #cc3333; --green: #1f9e33;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
  --mono: "Berkeley Mono", "Monaco", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
/* iOS Safari inflates text after a rotate to landscape (its text-size
   "auto" heuristic) and keeps the inflated size on the way back; 100% pins
   the type to its authored size */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost:disabled { color: #777; border-color: #888; background: var(--g300); box-shadow: none; }

textarea { font: inherit; color: var(--black); }
textarea { background: #fff; border: 1px solid var(--black); padding: 5px 7px; border-radius: 0;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff;
  user-select: text; cursor: text; resize: none; }
textarea:focus { outline: none; }
/* pop-up menu button, from the HIG's Figure 2-7 (Mac OS 8 HIG, "Pop-Up
   Menu Buttons"): a rounded black outline; on the body a white top and
   left highlight and a #aaa bottom shadow; on the right the raised arrow
   well — #aaa separator, a 1px gap, its own white bevel, #aaa then #777
   shadows, two 7px triangles. Every line is a CSS border on a nested
   element rather than background art: borders paint as exactly one device
   pixel at any display scale (Windows 150% included), where a sprite's
   rows come out 1 or 2 pixels tall by turns and the arrows grow tails.
   Only the triangles are art — crisp on the integer-scale grid, and
   anti-aliased at fractional scales so the apex stays a clean point. The
   list that opens is the browser's own. */
.popup { position: relative; display: block; height: 19px; overflow: hidden;
  border: 1px solid #000; border-radius: 3px; background: var(--g300); }
.popup::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(100% - 21px);
  border-top: 1px solid #fff; border-left: 1px solid #fff; border-bottom: 1px solid #aaa; }
.popup .well { position: absolute; right: 0; top: 1px; bottom: 0; width: 21px;
  border-left: 1px solid #aaa; pointer-events: none; }
.popup .well i { position: absolute; left: 1px; top: 0; right: 0; bottom: 0;
  border-right: 1px solid #777; border-bottom: 1px solid #777; }
.popup .well b { position: absolute; inset: 0;
  border-top: 1px solid #fff; border-left: 1px solid #fff;
  border-right: 1px solid #aaa; border-bottom: 1px solid #aaa;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="7" height="10" shape-rendering="crispEdges"><path fill="black" d="M3 0h1v1H3zM2 1h3v1H2zM1 2h5v1H1zM0 3h7v1H0zM0 6h7v1H0zM1 7h5v1H1zM2 8h3v1H2zM3 9h1v1H3z"/></svg>') 4px 1px no-repeat; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) {
  .popup .well b { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="7" height="10" shape-rendering="geometricPrecision"><path fill="black" d="M3.5 0L7 4H0zM0 6h7l-3.5 4z"/></svg>'); }
}
.popup select { position: absolute; inset: 0; width: 100%; height: 100%; appearance: none;
  background: transparent; border: 0; border-radius: 0; padding: 0 27px 0 6px; margin: 0;
  color: #000; font: 12px/17px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup select:focus { outline: none; }

/* the drafts column beside the fields — the agent windows' session
   column (the desktop's .sess-col), copied: 160px of the window's grey
   down the left, a white list of 18px rows, the open row inverted, its
   one seam with the fields the 1px line on its right, New in a row of
   its own under the list. The column is as tall as the window and the
   list scrolls inside it, so a long list never grows anything: min-height
   0 down the chain does here what contain: size does beside a terminal
   whose height is its own. */
#main { flex: 1; min-height: 0; display: flex; align-items: stretch; }
.sess-col { width: 160px; flex: none; display: flex; flex-direction: column; min-height: 0; position: relative;
  border-right: 1px solid var(--black); background: var(--g300); }
/* the seam drags the column's width: a 6px grip astride the 1px line */
.sess-grip { position: absolute; top: 0; bottom: 0; right: -3px; width: 6px; cursor: col-resize; z-index: 2; }
.sess-list { flex: 1; min-height: 0; overflow-y: auto; background: #fff; }
.sess-row { display: flex; align-items: center; gap: 5px; height: 18px; padding: 0 6px 0 8px;
  white-space: nowrap; border-bottom: 1px solid #efefef; }
.sess-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sess-row.untitled .t { color: #777; }
.sess-row.sel { background: var(--hl); color: #fff; }
.sess-row.sel.untitled .t { color: #ddd; }
/* the black dot: the pencil finished a draft while the window showed
   another — checked, waiting for you */
.sess-bell { flex: none; width: 7px; height: 7px; display: block; }
.sess-bell svg { display: block; }
/* the green dot: the pencil is still on that draft while the window
   shows another — the Chat list's streaming dot, so green means the same
   thing everywhere */
.sess-live { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: cs-pulse 1.2s ease-in-out infinite; }
@keyframes cs-pulse { 50% { opacity: 0.25; } }
.sess-btns { flex: none; border-top: 1px solid var(--black); padding: 12px; display: flex; justify-content: center; }
.sess-btns button { min-width: 58px; }

/* two document fields of equal height: what you wrote, and what the
   pencil made of it. Both keep the bar on so the layout never shifts.
   12px margins all round: the HIG's distance between a push button and
   any edge of its window, kept consistent for the fields. */
#wrap { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
/* the button row, laid out per the HIG (Dialog Box Guidelines, push
   button layout): in the lower right, a set of one width (58px, the
   OK/Cancel standard), 12px between buttons, 12px below the field and
   above the status line. Never on the status line itself. Clear, which
   throws the text away, sits alone in the lower left — away from the
   pair you reach for by reflex. */
#actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px; }
#actions button.ghost { width: 58px; padding-left: 0; padding-right: 0; }
#clear { margin-right: auto; }
#src { flex: 1; min-height: 0; width: 100%; font: 12px/1.5 var(--font);
  overflow-y: scroll; overflow-x: hidden; }
#out { flex: 1; min-height: 0; background: #fff; border: 1px solid var(--black); padding: 5px 7px;
  font: 12px/1.5 var(--font); overflow-y: scroll; overflow-x: hidden;
  white-space: pre-wrap; overflow-wrap: break-word; user-select: text; cursor: text;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
#out .ph { color: #888; }
/* a paragraph the pencil has not reached yet: the original, dimmed — same
   size as the corrected text will be, so nothing moves when it lands */
#out .pending { color: #888; }
/* the pencil's marks: what it wrote on a pale-blue field, a blue rule
   underneath; what it struck out, struck out */
#out ins { text-decoration: none; background: #ccccff; box-shadow: inset 0 -1px 0 var(--hl); }
#out del { color: #b3413c; text-decoration: line-through; }
#out .caret { display: inline-block; width: 6px; height: 12px; background: var(--hl);
  vertical-align: -1px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* options dialog: a Platinum panel over everything (Hub's) */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.12); display: none;
  align-items: center; justify-content: center; }
#veil.on { display: flex; }
#dlg { width: 330px; background: var(--g300); border: 1px solid var(--black); padding: 14px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #999, 2px 2px 0 rgba(0,0,0,.25); }
#dlg h2 { font-size: 12px; margin: 0 0 10px; }
#dlg .row { margin: 0 0 8px; display: grid; grid-template-columns: 58px 1fr; column-gap: 5px;
  align-items: center; }
#dlg .row label { text-align: right; }
#dlg .row .hint { grid-column: 2; margin-top: 3px; }
#dlg label { font-size: 12px; }
#dlg label.check { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-top: 4px; }
/* a Platinum check box: sunken white square, a black check when on */
#dlg input[type=checkbox] { appearance: none; margin: 0; width: 12px; height: 12px; flex: none;
  background: #fff; border: 1px solid var(--black);
  box-shadow: inset 1px 1px 0 #999, 1px 1px 0 #fff; }
#dlg input[type=checkbox]:checked { background: #fff url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" shape-rendering="crispEdges"><path fill="black" d="M1 4h1v1H1zM2 5h1v1H2zM3 6h1v1H3zM4 7h1v1H4zM5 6h1v1H5zM6 5h1v1H6zM7 4h1v1H7zM8 3h1v1H8zM8 2h1v1H8zM2 4h1v1H2zM3 5h1v1H3zM4 6h1v1H4zM5 5h1v1H5zM6 4h1v1H6zM7 3h1v1H7z"/></svg>') center no-repeat; }
#dlg input[type=checkbox]:focus { outline: none; }
#dlg .hint { font-size: 10px; color: #666; }
#dlg .btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 12px; }
/* a confirm on the same panel: the desktop's alert layout — the caution
   sign, a bold question, the detail under it, Cancel and the action
   button at the lower right, the default ringed, Return presses it */
#dlg.confirm { width: 380px; max-width: calc(100vw - 24px); }
#dlg .caution { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
#dlg .caution .sign { flex: none; display: block; width: 32px; height: 32px; }
#dlg .caution .sign svg { display: block; }
#dlg .caution .body { flex: 1; min-width: 0; user-select: text; }
#dlg .caution .msg { font-weight: bold; line-height: 1.35; }
#dlg .caution .detail { font-size: 11px; line-height: 1.45; margin-top: 7px; }
#dlg button:focus:not(.default) { outline: none; }
button.ghost.danger { color: #7a1010; }
button.ghost.default { outline: 2px solid var(--black); outline-offset: 1px; border-radius: 4px; }

/* a contextual menu, the desktop's Finder one (index.html .dropdown and
   #ctx-menu) in the app: #ddd face, 1px black outline, white and #bbb
   inset bevel, the hard 2px shadow; rows 3px 22px 3px 18px on 18px
   lines, inverted under the pointer, grey when disabled; a groove for a
   separator. Whole-pixel rows keep each separator on the same
   device-pixel phase. */
.dropdown { position: fixed; z-index: 30; min-width: 170px; background: var(--g300);
  border: 1px solid var(--black); padding: 2px 1px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--g500), 2px 2px 0 rgba(38,38,38,.85); }
.dd-item { padding: 3px 22px 3px 18px; line-height: 18px; white-space: nowrap; }
.dd-item:hover { background: var(--hl); color: #fff; }
.dd-item.dis { color: #888; }
.dd-item.dis:hover { background: none; color: #888; }
.dd-sep { height: 2px; margin: 3px 2px; border-top: 1px solid var(--g600); border-bottom: 1px solid #fff; }

/* toast — the desktop's #status-bar pattern */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #ffffc9; color: #000; border: 1px solid var(--black); padding: 5px 14px;
  font-size: 12px; box-shadow: inset 1px 1px 0 #fff, 2px 2px 0 var(--black);
  opacity: 0; transition: opacity .15s; pointer-events: none; max-width: 90vw; z-index: 20; }
#toast.show { opacity: 1; }

#status { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px 0 8px; height: 15px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; }
#st-state { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#st-state.err { color: var(--red); }
#st-model { max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--hl); text-decoration: underline; }
#st-model:active { color: #000; }
#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px;
  touch-action: none; z-index: 6; }
/* a phone's window fills the screen: no grow tile, so the status line
   keeps its plain 8px edge instead of the room left for the tile */
body.mobile #grow { display: none; }
body.mobile #status { padding-right: 8px; }
/* a phone's column becomes a strip of tabs above the fields, New at its
   right end, the same as the agent windows' */
body.mobile #main { flex-direction: column; }
body.mobile .sess-col { width: auto; flex: none; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--black); }
body.mobile .sess-list { display: flex; overflow-x: auto; overflow-y: hidden; }
body.mobile .sess-row { flex: none; max-width: 150px; height: auto; padding: 0 8px; border-bottom: 0; border-right: 1px solid #efefef; }
body.mobile .sess-btns { border-top: 0; border-left: 1px solid var(--black); padding: 6px 8px; }
body.mobile .sess-grip { display: none; }

/* Mac OS 9 scrollbars — the desktop's pixel-sampled spec (same as Notes) */
::-webkit-scrollbar { width: 15px; height: 15px; }
::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black);
  background: linear-gradient(to right, #777 0, #777 1px, #888 1px, #888 2px, #aaa 2px, #aaa 12px, #bbb 12px, #bbb 13px, #ccc 13px, #ccc 14px); }
::-webkit-scrollbar-thumb:vertical { border: 1px solid var(--black); border-right: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="0" width="6" height="1" fill="%23ccccff"/><rect x="4" y="1" width="7" height="1" fill="%23333399"/><rect x="3" y="2" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="2" width="6" height="1" fill="%23ccccff"/><rect x="4" y="3" width="7" height="1" fill="%23333399"/><rect x="3" y="4" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="4" width="6" height="1" fill="%23ccccff"/><rect x="4" y="5" width="7" height="1" fill="%23333399"/><rect x="3" y="6" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="6" width="6" height="1" fill="%23ccccff"/><rect x="4" y="7" width="7" height="1" fill="%23333399"/></svg>') center no-repeat,
    linear-gradient(to right, #ccccff 0 1px, #9999ff 1px 13px, #6666cc 13px 14px);
  box-shadow: inset 0 1px 0 #ccccff, inset 0 -1px 0 #6666cc; }
::-webkit-scrollbar-thumb:vertical:active {
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23ccccff"/><rect x="4" y="0" width="6" height="1" fill="%239999ff"/><rect x="4" y="1" width="7" height="1" fill="%23000066"/><rect x="3" y="2" width="1" height="1" fill="%23ccccff"/><rect x="4" y="2" width="6" height="1" fill="%239999ff"/><rect x="4" y="3" width="7" height="1" fill="%23000066"/><rect x="3" y="4" width="1" height="1" fill="%23ccccff"/><rect x="4" y="4" width="6" height="1" fill="%239999ff"/><rect x="4" y="5" width="7" height="1" fill="%23000066"/><rect x="3" y="6" width="1" height="1" fill="%23ccccff"/><rect x="4" y="6" width="6" height="1" fill="%239999ff"/><rect x="4" y="7" width="7" height="1" fill="%23000066"/></svg>') center no-repeat,
    linear-gradient(to right, #9999ff 0 1px, #6666cc 1px 13px, #333399 13px 14px);
  box-shadow: inset 0 1px 0 #9999ff, inset 0 -1px 0 #333399; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical {
  border-top-color: #ccccff; box-shadow: inset 0 -1px 0 #6666cc; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical:active {
  border-top-color: #9999ff; box-shadow: inset 0 -1px 0 #333399; }
.at-y-end::-webkit-scrollbar-thumb:vertical {
  border-bottom-color: #6666cc; box-shadow: inset 0 1px 0 #ccccff; }
.at-y-end::-webkit-scrollbar-thumb:vertical:active {
  border-bottom-color: #333399; box-shadow: inset 0 1px 0 #9999ff; }
::-webkit-scrollbar-button { display: block; width: 16px; height: 16px;
  background: #ddd; border: 1px solid var(--black);
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #bbb;
  background-position: center; background-repeat: no-repeat; }
::-webkit-scrollbar-button:vertical { border-right: 0; }
::-webkit-scrollbar-button:vertical:end:increment:enabled { height: 14px; border-top: 0; border-bottom: 0; }
::-webkit-scrollbar-button:vertical:decrement {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M3 0h2v1h-2z M2 1h4v1h-4z M1 2h6v1h-6z M0 3h8v1h-8z"/></svg>'); }
::-webkit-scrollbar-button:vertical:increment {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M0 0h8v1h-8z M1 1h6v1h-6z M2 2h4v1h-4z M3 3h2v1h-2z"/></svg>'); }
::-webkit-scrollbar-button:active { background-color: #777;
  box-shadow: inset 1px 1px 0 #555, inset -1px -1px 0 #999; }
::-webkit-scrollbar-button:vertical:start:decrement,
::-webkit-scrollbar-button:vertical:start:increment,
::-webkit-scrollbar-button:horizontal:start:decrement,
::-webkit-scrollbar-button:horizontal:start:increment { display: none; }
::-webkit-scrollbar-track:disabled { background: #eee; }
::-webkit-scrollbar-button:disabled { background-color: #eee; box-shadow: none; border: 0;
  border-left: 1px solid var(--black); }
::-webkit-scrollbar-button:vertical:end:increment:disabled { border-top: 1px solid #888; }
::-webkit-scrollbar-button:vertical:end:decrement:disabled { border-top: 1px solid #555; }
::-webkit-scrollbar-button:vertical:decrement:disabled {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="%23888888" d="M3 0h2v1h-2z M2 1h4v1h-4z M1 2h6v1h-6z M0 3h8v1h-8z"/></svg>'); }
::-webkit-scrollbar-button:vertical:increment:disabled {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="%23888888" d="M0 0h8v1h-8z M1 1h6v1h-6z M2 2h4v1h-4z M3 3h2v1h-2z"/></svg>'); }
::-webkit-scrollbar-corner { background: var(--g300); }
</style>
</head>
<body>

<div id="main">
  <div class="sess-col">
    <div class="sess-list" id="list"></div>
    <div class="sess-btns"><button class="ghost" id="new">New</button></div>
    <div class="sess-grip" id="grip"></div>
  </div>
  <div id="wrap">
    <textarea id="src" placeholder="Type or paste your text here." spellcheck="false"></textarea>
    <div id="out"></div>
    <div id="actions">
      <button class="ghost" id="clear" disabled>Clear</button>
      <button class="ghost" id="copy" disabled>Copy</button>
      <button class="ghost" id="accept" disabled>Accept</button>
    </div>
  </div>
</div>

<div id="status">
  <span id="st-state">Ready</span>
  <span id="st-model" title="Options&#8230;">&#8230;</span>
</div>

<div id="toast"></div>
<div id="ctx" class="dropdown" hidden></div>
<div id="veil">
  <div id="dlg"></div>
</div>

<!-- grow box sampled pixel-for-pixel from Mac OS 9 (Infinite Mac) -->
<svg id="grow" width="15" height="15" viewBox="0 0 15 15" shape-rendering="crispEdges">
  <rect width="15" height="15" fill="#ccc"/>
  <path fill="#000" d="M0 0h15v1H0zM0 1h1v14H0z"/>
  <path fill="#fff" d="M1 1h14v1H1zM1 2h1v13H1z"/>
  <path fill="#fff" d="M9 4h2v1H9zM8 5h1v1H8zM7 6h1v1H7zM6 7h1v1H6zM5 8h1v1H5zM4 9h1v1H4zM11 6h2v1h-2zM10 7h1v1h-1zM9 8h1v1H9zM8 9h1v1H8zM7 10h1v1H7zM6 11h1v1H6zM13 8h2v1h-2zM12 9h1v1h-1zM11 10h1v1h-1zM10 11h1v1h-1zM9 12h1v1H9zM8 13h1v1H8z"/>

// wrong, keep everything else, and treat the passage as a document, never
// as a message. The worked example matters more than any rule: without

  "You are a careful copy editor. The user gives you a passage; read it closely, find every error of spelling, grammar, punctuation and capitalization, and return the passage with all of them corrected.",

  "Output only the corrected passage, with no preface, explanation, quotation marks or code fences around it. If nothing needs correcting, output the passage unchanged.",
  "",
  "Example.",
  "Passage: me and him goes to the libary everyday, but we dont like it their.",
  "Corrected: He and I go to the library every day, but we don't like it there.",

// daemon API (same origin, token-guarded)

const src = $("#src"), out = $("#out"), stState = $("#st-state"), stModel = $("#st-model");
let cfg = { provider: "", model: "", effort: "max", marks: true }; // this app's settings (synced app data)
let loaded = false;      // settings fetched — saving stays off until they are

// the ChatGPT subscription signed in under Configuration → OpenAI. What
// the daemon has configured for each — its model and effort, and why it
// cannot run right now, or "" — comes from loadDaemon.
const PROVIDERS = [["ollama", "Ollama"], ["openai", "ChatGPT"]];

// the Responses API's reasoning efforts; "default" defers to the daemon's
// configured effort for that backend. Ollama's Off is offered but warned
// about: a reasoning model told not to think reasons out loud in its
// answer instead. A level a ChatGPT model rejects falls back to its
// default in the daemon.
const EFFORTS = {
  ollama: [["max", "Max"], ["high", "High"], ["medium", "Medium"], ["low", "Low"], ["off", "Off"], ["default", ""]],
  openai: [["max", "Max"], ["xhigh", "Extra high"], ["high", "High"], ["medium", "Medium"], ["low", "Low"], ["minimal", "Minimal"], ["none", "None"], ["default", ""]],
};
const effortOf = c => EFFORTS[providerOf(c)].some(([v]) => v === c.effort) ? c.effort : "max";
const backendKey = c => providerOf(c) + "|" + (c.model || "") + "|" + effortOf(c); // what a change of opinion is
let blocked = "";        // why no check can run right now (unconfigured), or ""
const cache = new Map(); // paragraph text → {fixed, ops}
let current = null;      // the paragraph in flight: {id (its draft), text, ctrl, partial, el}
let running = false, wanted = false;
let lastInput = 0, timer = 0, lastErr = "";
const doc = { version: 2, drafts: [] }; // every draft on this node (synced app data), newest first
let sel = null;           // the open draft's id — per-viewer state, never in the doc
const unseen = new Set(); // drafts the pencil finished while the window showed another
const live = () => doc.drafts.filter(d => !d.deleted);
const cur = () => doc.drafts.find(d => d.id === sel && !d.deleted) || null;

// ---- paragraphs ----
// A document is checked a paragraph at a time: blank lines split it, and
// the separators ride along untouched so the corrected text reassembles
// exactly. Only paragraphs the cache has never seen go to the model — so
// editing one paragraph of a long text re-checks that paragraph alone.
function splitParas(text) {

// whitespace restored. An empty reply is null — a failure, not a pass.
function tidy(orig, fixed) {

// The open draft, paragraph by paragraph: what the cache holds corrected

// then the other drafts', newest first — a draft pasted and left keeps
// being checked while you write in another, the way an agent session

// for you.
function landed(id, text) {

// proofreading wants the likeliest correction, and the same one every
// time — at the default temperature a model will sometimes wander down

async function complete(text, signal, onDelta) {

src.addEventListener("input", () => {
  const d = cur();
  if (!d) return;
  d.text = src.value;
  d.updated = lastInput = Date.now();
  lastErr = "";
  if (current && current.id === d.id && !d.text.includes(current.text)) current.ctrl.abort();

    e.preventDefault();
    lastInput = 0;
    clearTimeout(timer);
    kick();
  }

    src.value = v;
    src.dispatchEvent(new Event("input"));

}

  putText("");
  lastErr = "";
  clearTimeout(timer);
  render();
});
$("#accept").addEventListener("click", () => {

  // nothing goes back to the model

    const c = checkable(p) && cache.get(p.text);
    if (c && !cache.has(c.fixed)) remember(c.fixed, c.fixed);

// drafts.json holds every draft on this node — text, the checked
// paragraphs still in it, created and updated stamps — as synced app

// back without a single model call; the daemon merges it draft by draft
// (internal/peer/merge.go). Same contract as Notes: debounced whole-doc

    "X-Exe-Seq": String(Date.now()), "X-Exe-Client": CLIENT };
  if (flush) {
    // unload: a keepalive PUT of the latest doc, bypassing the in-flight
    // gate — the desktop may tear the iframe down before a normal one lands
    try { api(DRAFTS_URL, { method: "PUT", keepalive: true, headers, body }); } catch (e) {}
    return;
  }
  if (docSaving) { docAgain = true; return; }
  docSaving = true;
  try {
    const r = await api(DRAFTS_URL, { method: "PUT", headers, body });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (e) { toast("Drafts not saved: " + e.message); }
  docSaving = false;
  if (docAgain) { docAgain = false; saveDoc(); }
}
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && (docT || docSaving)) saveDoc(true);
});
addEventListener("pagehide", () => { if (docT || docSaving) saveDoc(true); });

// Before the column there was one draft, draft.json. It becomes the first
// row, under an id derived from its text so two nodes migrating it apart
// agree on the record; the old file is left as it was.
const hash = s => {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return (h >>> 0).toString(16);
};
async function loadDoc() {
  try {
    const r = await api(DRAFTS_URL);
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.drafts)) doc.drafts = d.drafts.filter(x => x && x.id).map(normDraft);
    } else if (r.status === 404) {
      const l = await api(LEGACY_URL);
      if (l.ok) {
        const d = await l.json().catch(() => null);
        if (d && typeof d.text === "string" && d.text.trim()) {
          const checked = d.checked && typeof d.checked === "object" ? d.checked : {};
          doc.drafts.push(mkDraft(d.text, checked, +d.updated || Date.now(), "v1-" + hash(d.text)));
          migrated = true;
        }
      } else if (l.status !== 404) throw new Error("HTTP " + l.status);
    } else throw new Error("HTTP " + r.status);
    docLoaded = true;
  } catch (e) { toast("Drafts unavailable: " + e.message + " — reopen this window"); }
}
// Another window, or a joined desk, wrote drafts.json (the desktop
// forwards the daemon's change events). Disk is the daemon's already-
// merged result: adopt it as the base and keep a local draft only when it
// is strictly newer — a genuine unsaved edit; on an updated tie disk
// wins, matching the daemon's tiebreak, so app and daemon never disagree
// into an endless save→merge→push loop.
async function reloadFromDisk() {
  try {
    const r = await api(DRAFTS_URL);
    if (!r.ok) return;
    const d = await r.json();
    if (!d || !Array.isArray(d.drafts)) return;
    const disk = new Map(d.drafts.filter(x => x && x.id).map(x => [String(x.id), normDraft(x)]));
    const byId = new Map(disk);
    let ahead = false; // we hold something disk lacks: push it back
    for (const l of doc.drafts) {
      const dv = byId.get(l.id);
      if (!dv || l.updated > dv.updated) { byId.set(l.id, l); ahead = true; }
    }
    const before = cur() ? cur().text : null;
    doc.drafts = [...byId.values()];
    sortDrafts();
    for (const x of doc.drafts) adoptChecked(x);
    for (const id of [...unseen]) { // a draft edited elsewhere is no longer finished
      const x = doc.drafts.find(y => y.id === id);
      if (!x || x.deleted || pendingCount(x)) unseen.delete(id);
    }
    if (current && !doc.drafts.some(x => x.id === current.id && !x.deleted)) current.ctrl.abort();
    const c = cur();
    if (!c) { // the open draft went away: the window moves to the newest, or a fresh one
      sel = null;
      selectDraft(live().length ? live()[0].id : newDraft(), false);
    } else {
      if (c.text !== before) { src.value = c.text; src.setSelectionRange(c.text.length, c.text.length); }
      lastInput = 0;
      render();
      kick();
    }
    if (ahead) scheduleSave();
  } catch (e) {}
}
window.addEventListener("message", async e => {
  if (e.origin !== location.origin || !e.data || e.data.exe !== "data-changed") return;
  if (e.data.client && e.data.client === CLIENT) return; // our own write
  if (e.data.path === "config.json") {
    if (!loaded) return;
    const was = backendKey(cfg);
    await loadCfg();
    syncBackend();
    if (backendKey(cfg) !== was) { forget(); lastInput = 0; render(); kick(); }
    modelLabel();
    render();
    return;
  }
  if (e.data.path === "drafts.json" && docLoaded) reloadFromDisk();
});
// another model, or another thinking budget, is another opinion: every
// draft goes back to the pencil, the open one first
function forget() {
  cache.clear();
  unseen.clear();
  scheduleSave();
}

// ---- the drafts column ----
// The agent windows' session column, for drafts: one row per draft,
// newest first, titled by its first line; a click opens it, New starts
// another. While the window shows one draft, a pulsing green dot marks
// another the pencil is still on, a black dot one it finished — waiting
// for you. A row's contextual menu opens with when the draft was
// started, in grey, then starts a new draft, copies the row's text or its
// checked text, or deletes it after a dialog. An empty draft is dropped
// the moment you leave it, so the list never fills with blank rows — and
// on a phone Clear, then any other row, is how a draft goes.
function draftTitle(d) {
  const line = (d.text || "").split("\n").find(l => l.trim());
  return line ? line.trim().slice(0, 60) : "";
}
const titleOf = d => draftTitle(d) || "Untitled";
// when a draft started, short enough for a menu line: the time alone
// today, weekday and date before that, the year once it differs
function when(ms) {
  const d = new Date(ms), now = new Date();
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return "today, " + t;
  const date = d.getFullYear() === now.getFullYear()
    ? d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })
    : d.toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
  return date + ", " + t;
}
// the black dot: a 7px crispEdges disc in the row's own colour
function sessBell() {
  const b = el("span", { class: "sess-bell" });
  b.innerHTML = '<svg width="7" height="7" viewBox="0 0 7 7" shape-rendering="crispEdges"><path d="M2 0h3v1h1v1h1v3h-1v1h-1v1h-3v-1h-1v-1h-1v-3h1v-1h1z" fill="currentColor"/></svg>';
  return b;
}
function renderList() {
  list.replaceChildren(...live().map(d => {
    // the open row carries no mark: the checked pane itself shows its state
    const off = d.id !== sel;
    const working = off && current && current.id === d.id, wants = off && !working && unseen.has(d.id);
    const title = draftTitle(d);
    const row = el("div", { class: "sess-row" + (off ? "" : " sel") + (title ? "" : " untitled"),
      title: (title || "Untitled") + (working ? "\nstill checking" : wants ? "\nchecked — waiting for you" : "")
        + "\nstarted " + new Date(d.created).toLocaleString() });
    if (wants) row.append(sessBell());
    else if (working) row.append(el("span", { class: "sess-live" }));
    row.append(el("span", { class: "t" }, title || "Untitled"));
    row.onclick = () => selectDraft(d.id, true);
    row.addEventListener("contextmenu", e => rowMenu(e, d));
    return row;
  }));
  // the open row comes into view when the open draft changes — the
  // phone's strip slides sideways to it, a tall list down — and the list
  // stays put otherwise, so a render never drags it from where it was
  // scrolled to
  if (sel && sel !== shown) {
    const s = list.querySelector(".sess-row.sel");
    if (s) { revealRow(list, s); shown = sel; }
  }
}
// revealRow scrolls a list the least distance that brings a row of it
// into view, and nothing else: scrollIntoView would move the ancestors too
function revealRow(l, row) {
  const a = l.getBoundingClientRect(), r = row.getBoundingClientRect();
  if (r.left < a.left) l.scrollLeft += r.left - a.left;
  else if (r.right > a.right) l.scrollLeft += r.right - a.right;
  if (r.top < a.top) l.scrollTop += r.top - a.top;
  else if (r.bottom > a.bottom) l.scrollTop += r.bottom - a.bottom;
}
function selectDraft(id, focus) {
  const d = doc.drafts.find(x => x.id === id && !x.deleted);
  if (!d) return;
  if (id !== sel) {
    const prev = cur();
    if (prev && !prev.text.trim()) dropDraft(prev); // an empty draft is dropped on the way out
    sel = id;
    try { localStorage.setItem(SEL_KEY, id); } catch (e) {}
    src.value = d.text;
    src.setSelectionRange(d.text.length, d.text.length);
  }
  unseen.delete(id);
  lastErr = "";
  lastInput = 0;
  render();
  if (focus) src.focus();
  kick();
}
function dropDraft(d) {
  if (current && current.id === d.id) current.ctrl.abort();
  d.deleted = d.updated = Date.now();
  d.text = "";
  d.checked = {};
  unseen.delete(d.id);
  scheduleSave();
}
// New starts a draft of its own and opens it — unless the open one is
// still blank, which is the same thing
function newDraft() {
  const c = cur();
  if (c && !c.text.trim()) { src.focus(); return c.id; }
  const d = mkDraft();
  doc.drafts.unshift(d);
  sortDrafts();
  selectDraft(d.id, true);
  scheduleSave();
  return d.id;
}
$("#new").addEventListener("click", newDraft);
async function deleteDraft(d) {
  const ok = await confirmDialog({
    message: "Delete “" + titleOf(d) + "”?",
    detail: "The draft and its checked text go from every desk sharing this node."
      + (current && current.id === d.id ? " It is still being checked — the check in flight is lost." : "")
      + (d.id === sel ? " The window moves to another draft, or starts a fresh one." : ""),
    action: "Delete",
  });
  if (!ok || d.deleted) return;
  const rows = live(), i = rows.indexOf(d);
  dropDraft(d);
  if (d.id === sel) {
    // the row that took its place, else the one above, else a fresh draft
    const rest = live();
    sel = null;
    if (rest.length) selectDraft(rest[Math.min(i, rest.length - 1)].id, true);
    else newDraft();
  } else render();
}
function rowMenu(e, d) {
  e.preventDefault();
  e.stopPropagation();
  showMenu(e.clientX, e.clientY, [
    { label: "Started " + when(d.created), dis: true }, "-",
    { label: "New Draft", act: newDraft }, "-",
    { label: "Copy Text", act: () => copyText(d.text, "the text"), dis: !d.text.trim() },
    { label: "Copy Checked Text", act: () => copyText(correctedTextOf(d), "the checked text"), dis: !checkedCount(d) }, "-",
    { label: "Delete…", act: () => deleteDraft(d) },
  ]);
}
list.addEventListener("contextmenu", e => {
  if (e.target !== list) return;
  e.preventDefault();
  showMenu(e.clientX, e.clientY, [{ label: "New Draft", act: newDraft }]);
});
// the contextual menu: the desktop's, in the app — items { label, act,
// dis } and "-" separators, closed by a click anywhere, Escape, or a pick
const ctx = $("#ctx");
function showMenu(x, y, items) {
  hideMenu();
  ctx.replaceChildren(...items.map(it => {
    if (it === "-") return el("div", { class: "dd-sep" });
    const d = el("div", { class: "dd-item" + (it.dis ? " dis" : "") }, it.label);
    if (!it.dis) d.onclick = () => { hideMenu(); it.act(); };
    return d;
  }));
  ctx.hidden = false;
  const r = ctx.getBoundingClientRect();
  ctx.style.left = Math.max(0, Math.min(x, innerWidth - r.width - 4)) + "px";
  ctx.style.top = Math.max(0, Math.min(y, innerHeight - r.height - 4)) + "px";
}
function hideMenu() { ctx.hidden = true; }
document.addEventListener("mousedown", e => { if (!e.target.closest("#ctx")) hideMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideMenu(); });
// the seam between the column and the fields drags the column's width,
// kept per viewer like the open draft; the fields keep 280px whatever
// the window's width. A phone's strip has no seam.
const colWidth = w => Math.max(100, Math.min(innerWidth - 280, w));
if (!IS_MOBILE) {
  try { const w = +localStorage.getItem(COL_KEY); if (w) col.style.width = colWidth(w) + "px"; } catch (e) {}
}
$("#grip").addEventListener("pointerdown", e => {
  if (IS_MOBILE) return;
  const grip = e.currentTarget;
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  const sx = e.clientX, sw = col.offsetWidth;
  const move = ev => { col.style.width = colWidth(sw + ev.clientX - sx) + "px"; };
  const up = () => {
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", up);
    try { localStorage.setItem(COL_KEY, String(col.offsetWidth)); } catch (e) {}
    src.focus();
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", up);
});
// a confirm on the options panel: the desktop's alert layout — the
// caution sign, a bold question, the detail under it, Cancel and the
// ringed action button, which Return presses and Escape declines
function confirmDialog({ message = "", detail = "", action = "OK" } = {}) {
  return new Promise(res => {
    const dlg = $("#dlg");
    dlg.classList.add("confirm");
    const cancel = el("button", { class: "ghost" }, "Cancel");
    const go = el("button", { class: "ghost danger default" }, action);
    const sign = el("span", { class: "sign" });
    sign.innerHTML = '<svg width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges"><path d="M16 2 L30.5 29.5 L1.5 29.5 Z" fill="#FFDD30" stroke="#000"/><path d="M16 6 L27 27 L5 27 Z" fill="#FFF3A0"/><rect x="14" y="11" width="4" height="10" fill="#000"/><rect x="14" y="23" width="4" height="3" fill="#000"/></svg>';
    dlg.replaceChildren(
      el("div", { class: "caution" }, sign,
        el("div", { class: "body" }, el("div", { class: "msg" }, message), el("div", { class: "detail" }, detail))),
      el("div", { class: "btns" }, cancel, go));
    $("#veil").classList.add("on");
    go.focus();
    let done = false;
    const close = ok => {
      if (done) return;
      done = true;
      $("#veil").classList.remove("on");
      document.removeEventListener("keydown", keys);
      src.focus();
      res(ok);
    };
    const keys = e => {
      if (e.key === "Escape") close(false);
      else if (e.key === "Enter") close(true);
    };
    document.addEventListener("keydown", keys);
    cancel.addEventListener("click", () => close(false));
    go.addEventListener("click", () => close(true));
  });
}

// ---- settings ----
async function loadCfg() {
  try {
    const r = await api(CONFIG_URL);
    if (r.ok) Object.assign(cfg, await r.json());
    else if (r.status !== 404) throw new Error("HTTP " + r.status);
    loaded = true;
  } catch (e) { toast("Settings unavailable: " + e.message); }
}
let saving = false, again = false;
async function saveCfg() {
  if (!loaded) return;
  if (saving) { again = true; return; }
  saving = true;
  try {
    const r = await api(CONFIG_URL, { method: "PUT", keepalive: true,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg) });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (e) { toast("Could not save settings: " + e.message); }
  finally { saving = false; if (again) { again = false; saveCfg(); } }
}
async function loadDaemon() {
  try {
    const r = await api("/v1/config");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const c = await r.json(), o = c.ollama || {}, g = c.openai || {};
    daemon.ollama = { model: o.model || "", effort: o.effort || "",
      ready: o.base_url ? "" : "Ollama is not configured (Windows → Configuration)" };
    daemon.openai = { model: g.model || "", effort: g.effort || "", ready: "" };
    // the sign-in is a file on the daemon, not a setting: ask its status
    const st = await api("/v1/openai/status");
    const signed = st.ok && !!(await st.json()).authenticated;
    if (!signed) daemon.openai.ready = "Not signed in to ChatGPT (Windows → Configuration → OpenAI)";
  } catch (e) { daemon.ollama.ready = daemon.openai.ready = "Daemon unreachable: " + e.message; }
}
// syncBackend settles what the chosen backend can do: blocked is why the
// check cannot run on it — the backend is not set up, or no model is
// named for it here or in the daemon's configuration
function syncBackend() {
  const p = providerOf(cfg), d = daemon[p];
  blocked = d.ready;
  if (!blocked && !(cfg.model || d.model)) blocked = "No " + (p === "openai" ? "ChatGPT" : "Ollama") + " model chosen (click the model name for options)";
}
function modelLabel() {
  const d = daemon[providerOf(cfg)];
  const eff = effortOf(cfg) === "default" ? d.effort : effortOf(cfg);
  stModel.textContent = (cfg.model || d.model || "no model") + (eff ? " (" + eff + ")" : "");
}

function options() {
  const dlg = $("#dlg");
  dlg.classList.remove("confirm");
  const popup = s => el("span", { class: "popup" }, s, el("span", { class: "well" }, el("i", {}, el("b"))));
  // the backend, then that backend's model and thinking level; picking
  // another backend refills the two popups below it
  const prov = el("select", { id: "o-provider" });
  for (const [v, l] of PROVIDERS) {
    const why = daemon[v].ready ? (v === "openai" ? " — not signed in" : " — not configured") : "";
    prov.append(el("option", { value: v }, l + why));
  }
  prov.value = providerOf(cfg);
  const sel = el("select", { id: "o-model" });
  const eff = el("select", { id: "o-effort" });
  const modelHint = el("span", { class: "hint" }), effHint = el("span", { class: "hint" });
  const fill = () => {
    const p = prov.value, d = daemon[p], own = p === providerOf(cfg) ? (cfg.model || "") : "";
    sel.replaceChildren(el("option", { value: "" }, "Configured" + (d.model ? " — " + d.model : "")));
    if (own) sel.append(el("option", { value: own }, own));
    sel.value = own;
    eff.replaceChildren(...EFFORTS[p].map(([v, l]) => el("option", { value: v }, l || "Configured — " + (d.effort || "model default"))));
    eff.value = p === providerOf(cfg) ? effortOf(cfg) : "max";
    modelHint.textContent = p === "openai"
      ? "Runs on the ChatGPT subscription signed in under Configuration; the passage goes to OpenAI."
      : "A small local model is plenty for proofreading and answers faster.";
    effHint.textContent = p === "openai"
      ? "Max reads hardest and slowest; None is fastest. A level the model rejects runs at its default."
      : "Max reads hardest and slowest. Off is fastest, but some models then think out loud.";
    // the list fills in behind the current choice, so the menu never jumps
    api("/v1/chat/models?provider=" + p).then(r => r.ok ? r.json() : null).then(dd => {
      if (prov.value !== p || !dd || !Array.isArray(dd.models)) return;
      for (const m of dd.models) {
        if (m === own) continue;
        sel.append(el("option", { value: m }, m));
      }
    }).catch(() => {});
  };
  prov.addEventListener("change", fill);
  fill();
  const chk = el("input", { type: "checkbox", id: "o-marks" });
  chk.checked = cfg.marks !== false;
  const cancel = el("button", { class: "ghost" }, "Cancel");
  const ok = el("button", { class: "ghost default" }, "OK"); // Return's button wears the ring
  dlg.replaceChildren(
    el("h2", {}, "Blue Pencil Options"),
    el("div", { class: "row" }, el("label", { for: "o-provider" }, "Check on:"), popup(prov)),
    el("div", { class: "row" }, el("label", { for: "o-model" }, "Model:"), popup(sel), modelHint),
    el("div", { class: "row" }, el("label", { for: "o-effort" }, "Thinking:"), popup(eff), effHint),
    el("label", { class: "check" }, chk, "Mark changes in the checked text"),
    el("div", { class: "btns" }, cancel, ok));
  $("#veil").classList.add("on");
  prov.focus();
  const close = () => { $("#veil").classList.remove("on"); document.removeEventListener("keydown", keys); src.focus(); };
  const submit = () => {
    const was = backendKey(cfg);
    cfg.provider = prov.value === "openai" ? "openai" : "";
    cfg.model = sel.value;
    cfg.effort = eff.value;
    cfg.marks = chk.checked;
    syncBackend();
    if (backendKey(cfg) !== was) forget(); // another backend, model or budget: another opinion
    saveCfg();
    modelLabel();
    close();
    lastInput = 0;
    render();
    kick();
  };
  const keys = e => {
    if (e.key === "Escape") close();
    else if (e.key === "Enter") submit();
  };
  document.addEventListener("keydown", keys);
  cancel.addEventListener("click", close);
  ok.addEventListener("click", submit);
}
stModel.addEventListener("click", options);

(async () => {
  render();
  await Promise.all([loadCfg(), loadDaemon(), loadDoc()]);
  syncBackend();
  modelLabel();
  sortDrafts();
  for (const d of doc.drafts) adoptChecked(d);
  try { sel = localStorage.getItem(SEL_KEY); } catch (e) {}
  if (!cur()) sel = live().length ? live()[0].id : null;
  if (!sel) { const d = mkDraft(); doc.drafts.unshift(d); sel = d.id; } // a blank draft, ready to type into
  const c = cur();
  src.value = c.text;
  src.focus();
  src.setSelectionRange(c.text.length, c.text.length);
  if (migrated) scheduleSave();
  lastInput = 0;
  render();
  kick(); // a draft cut off mid-check picks up where it left off
})();

// ---- desktop window plumbing (same bridge as Notes and Hub) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  t.classList.toggle("scrolled-y", t.scrollTop >= 1);
  t.classList.toggle("at-y-end", t.scrollTop >= 1 && t.scrollTop >= t.scrollHeight - t.clientHeight - 1);
}, { capture: true, passive: true });
</script>
