<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blue Pencil</title>
<link rel="stylesheet" href="/platinum/popup.css">
<style>
/* Platinum values match the exe desktop (same block as the Notes and Hub apps) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --red: #cc3333; --green: #1f9e33;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
  --mono: "Berkeley Mono", "Monaco", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
/* iOS Safari inflates text after a rotate to landscape (its text-size
   "auto" heuristic) and keeps the inflated size on the way back; 100% pins
   the type to its authored size */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost:disabled { color: #777; border-color: #888; background: var(--g300); box-shadow: none; }

textarea { font: inherit; color: var(--black); }
textarea { background: #fff; border: 1px solid var(--black); padding: 5px 7px; border-radius: 0;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff;
  user-select: text; cursor: text; resize: none; }
textarea:focus { outline: none; }
/* The pop-up menu button is the shared block the daemon serves
   (/platinum/popup.css, exe-stats popup.css): linked above, never copied. */

/* the drafts column beside the fields — the agent windows' session
   column (the desktop's .sess-col), copied: 160px of the window's grey
   down the left, a white list of 18px rows, the open row inverted, its
   one seam with the fields the 1px line on its right, New in a row of
   its own under the list. The column is as tall as the window and the
   list scrolls inside it, so a long list never grows anything: min-height
   0 down the chain does here what contain: size does beside a terminal
   whose height is its own. */
#main { flex: 1; min-height: 0; display: flex; align-items: stretch; }
.sess-col { width: 160px; flex: none; display: flex; flex-direction: column; min-height: 0; position: relative;
  border-right: 1px solid var(--black); background: var(--g300); }
/* the seam drags the column's width: a 6px grip astride the 1px line */
.sess-grip { position: absolute; top: 0; bottom: 0; right: -3px; width: 6px; cursor: col-resize; z-index: 2; }
.sess-list { flex: 1; min-height: 0; overflow-y: auto; background: #fff; }
.sess-row { display: flex; align-items: center; gap: 5px; height: 18px; padding: 0 6px 0 8px;
  white-space: nowrap; border-bottom: 1px solid #efefef; }
.sess-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sess-row.untitled .t { color: #777; }
.sess-row.sel { background: var(--hl); color: #fff; }
.sess-row.sel.untitled .t { color: #ddd; }
/* the black dot: the pencil finished a draft while the window showed
   another — checked, waiting for you */
.sess-bell { flex: none; width: 7px; height: 7px; display: block; }
.sess-bell svg { display: block; }
/* the green dot: the pencil is still on that draft while the window
   shows another — the Chat list's streaming dot, so green means the same
   thing everywhere */
.sess-live { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: cs-pulse 1.2s ease-in-out infinite; }
@keyframes cs-pulse { 50% { opacity: 0.25; } }
.sess-btns { flex: none; border-top: 1px solid var(--black); padding: 12px; display: flex; justify-content: center; }
.sess-btns button { min-width: 58px; }

/* two document fields of equal height: what you wrote, and what the
   pencil made of it. Both keep the bar on so the layout never shifts.
   12px margins all round: the HIG's distance between a push button and
   any edge of its window, kept consistent for the fields. */
#wrap { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
/* the button row, laid out per the HIG (Dialog Box Guidelines, push
   button layout): in the lower right, a set of one width (58px, the
   OK/Cancel standard), 12px between buttons, 12px below the field and
   above the status line. Never on the status line itself. Clear, which
   throws the text away, sits alone in the lower left — away from the
   pair you reach for by reflex. */
#actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px; }
#actions button.ghost { width: 58px; padding-left: 0; padding-right: 0; }
#clear { margin-right: auto; }
#src { flex: 1; min-height: 0; width: 100%; font: 12px/1.5 var(--font);
  overflow-y: scroll; overflow-x: hidden; }
#out { flex: 1; min-height: 0; background: #fff; border: 1px solid var(--black); padding: 5px 7px;
  font: 12px/1.5 var(--font); overflow-y: scroll; overflow-x: hidden;
  white-space: pre-wrap; overflow-wrap: break-word; user-select: text; cursor: text;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
#out .ph { color: #888; }
/* a paragraph the pencil has not reached yet: the original, dimmed — same
   size as the corrected text will be, so nothing moves when it lands */
#out .pending { color: #888; }
/* the pencil's marks: what it wrote on a pale-blue field, a blue rule
   underneath; what it struck out, struck out */
#out ins { text-decoration: none; background: #ccccff; box-shadow: inset 0 -1px 0 var(--hl); }
#out del { color: #b3413c; text-decoration: line-through; }
#out .caret { display: inline-block; width: 6px; height: 12px; background: var(--hl);
  vertical-align: -1px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* options dialog: a Platinum panel over everything (Hub's). It sits in
   the middle by its own auto margins, not by the veil's alignment: in a
   window too small for it the margins give way and the veil scrolls, so
   the buttons can always be reached — centred by alignment, a panel
   taller than its window loses its top and its bottom alike */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.12); display: none; overflow: auto; }
#veil.on { display: flex; }
#dlg { flex: none; margin: auto; width: 330px; background: var(--g300); border: 1px solid var(--black); padding: 14px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #999, 2px 2px 0 rgba(0,0,0,.25); }
#dlg h2 { font-size: 12px; margin: 0 0 10px; }
#dlg .row { margin: 0 0 8px; display: grid; grid-template-columns: 58px 1fr; column-gap: 5px;
  align-items: center; }
#dlg .row label { text-align: right; }
#dlg .row .hint { grid-column: 2; margin-top: 3px; }
#dlg label { font-size: 12px; }
#dlg label.check { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-top: 4px; }
/* a Platinum check box: sunken white square, a black check when on */
#dlg input[type=checkbox] { appearance: none; margin: 0; width: 12px; height: 12px; flex: none;
  background: #fff; border: 1px solid var(--black);
  box-shadow: inset 1px 1px 0 #999, 1px 1px 0 #fff; }
#dlg input[type=checkbox]:checked { background: #fff url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" shape-rendering="crispEdges"><path fill="black" d="M1 4h1v1H1zM2 5h1v1H2zM3 6h1v1H3zM4 7h1v1H4zM5 6h1v1H5zM6 5h1v1H6zM7 4h1v1H7zM8 3h1v1H8zM8 2h1v1H8zM2 4h1v1H2zM3 5h1v1H3zM4 6h1v1H4zM5 5h1v1H5zM6 4h1v1H6zM7 3h1v1H7z"/></svg>') center no-repeat; }
#dlg input[type=checkbox]:focus { outline: none; }
#dlg .hint { font-size: 10px; color: #666; }
/* the custom prompt: a field too wide for the label column, so its label
   sits above it the way Comments does in a Get Info window, and its hint
   below. Four lines high, the bar always on, like the two fields behind */
#dlg .own { margin: 0 0 8px; }
#dlg .own label, #dlg .own .hint { display: block; }
#dlg .own textarea { display: block; width: 100%; height: 84px; margin: 3px 0 4px; font: 12px/1.5 var(--font);
  overflow-y: scroll; overflow-x: hidden; }
#dlg .btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 12px; }
#dlg .btns button { min-width: 58px; }
/* a confirm on the same panel: the desktop's alert layout — the caution
   sign, a bold question, the detail under it, Cancel and the action
   button at the lower right, the default ringed, Return presses it */
#dlg.confirm { width: 380px; max-width: calc(100vw - 24px); }
#dlg .caution { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
#dlg .caution .sign { flex: none; display: block; width: 32px; height: 32px; }
#dlg .caution .sign svg { display: block; }
#dlg .caution .body { flex: 1; min-width: 0; user-select: text; }
#dlg .caution .msg { font-weight: bold; line-height: 1.35; }
#dlg .caution .detail { font-size: 11px; line-height: 1.45; margin-top: 7px; }
#dlg button:focus:not(.default) { outline: none; }
button.ghost.danger { color: #7a1010; }
button.ghost.default { outline: 2px solid var(--black); outline-offset: 1px; border-radius: 4px; }

/* a contextual menu, the desktop's Finder one (index.html .dropdown and
   #ctx-menu) in the app: #ddd face, 1px black outline, white and #bbb
   inset bevel, the hard 2px shadow; rows 3px 22px 3px 18px on 18px
   lines, inverted under the pointer, grey when disabled; a groove for a
   separator. Whole-pixel rows keep each separator on the same
   device-pixel phase. */
.dropdown { position: fixed; z-index: 30; min-width: 170px; background: var(--g300);
  border: 1px solid var(--black); padding: 2px 1px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--g500), 2px 2px 0 rgba(38,38,38,.85); }
.dd-item { padding: 3px 22px 3px 18px; line-height: 18px; white-space: nowrap; }
.dd-item:hover { background: var(--hl); color: #fff; }
.dd-item.dis { color: #888; }
.dd-item.dis:hover { background: none; color: #888; }
.dd-sep { height: 2px; margin: 3px 2px; border-top: 1px solid var(--g600); border-bottom: 1px solid #fff; }

/* toast — the desktop's #status-bar pattern */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #ffffc9; color: #000; border: 1px solid var(--black); padding: 5px 14px;
  font-size: 12px; box-shadow: inset 1px 1px 0 #fff, 2px 2px 0 var(--black);
  opacity: 0; transition: opacity .15s; pointer-events: none; max-width: 90vw; z-index: 20; }
#toast.show { opacity: 1; }

/* overflow: clip — the 11px text's line box is taller than the 14px face and
   hangs a pixel past the bar; clipped, that pixel is no scrollable overflow of
   the page (docs/platinum.md, status bar) */
#status { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px 0 8px; height: 15px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; overflow: clip; }
#st-state { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#st-state.err { color: var(--red); }
#st-model { max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--hl); text-decoration: underline; }
#st-model:active { color: #000; }
#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px;
  touch-action: none; z-index: 6; }
/* a phone's window fills the screen: no grow tile, so the status line
   keeps its plain 8px edge instead of the room left for the tile */
body.mobile #grow { display: none; }
body.mobile #status { padding-right: 8px; }
/* a phone's column becomes a strip of tabs above the fields, New at its
   right end, the same as the agent windows' */
body.mobile #main { flex-direction: column; }
body.mobile .sess-col { width: auto; flex: none; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--black); }
body.mobile .sess-list { display: flex; overflow-x: auto; overflow-y: hidden; }
body.mobile .sess-row { flex: none; max-width: 150px; height: auto; padding: 0 8px; border-bottom: 0; border-right: 1px solid #efefef; }
body.mobile .sess-btns { border-top: 0; border-left: 1px solid var(--black); padding: 6px 8px; }
body.mobile .sess-grip { display: none; }

/* Mac OS 9 scrollbars — the desktop's pixel-sampled spec (same as Notes) */
::-webkit-scrollbar { width: 15px; height: 15px; }
::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black);
  background: linear-gradient(to right, #777 0, #777 1px, #888 1px, #888 2px, #aaa 2px, #aaa 12px, #bbb 12px, #bbb 13px, #ccc 13px, #ccc 14px); }
::-webkit-scrollbar-thumb:vertical { border: 1px solid var(--black); border-right: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="0" width="6" height="1" fill="%23ccccff"/><rect x="4" y="1" width="7" height="1" fill="%23333399"/><rect x="3" y="2" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="2" width="6" height="1" fill="%23ccccff"/><rect x="4" y="3" width="7" height="1" fill="%23333399"/><rect x="3" y="4" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="4" width="6" height="1" fill="%23ccccff"/><rect x="4" y="5" width="7" height="1" fill="%23333399"/><rect x="3" y="6" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="6" width="6" height="1" fill="%23ccccff"/><rect x="4" y="7" width="7" height="1" fill="%23333399"/></svg>') center no-repeat,
    linear-gradient(to right, #ccccff 0 1px, #9999ff 1px 13px, #6666cc 13px 14px);
  box-shadow: inset 0 1px 0 #ccccff, inset 0 -1px 0 #6666cc; }
::-webkit-scrollbar-thumb:vertical:active {
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23ccccff"/><rect x="4" y="0" width="6" height="1" fill="%239999ff"/><rect x="4" y="1" width="7" height="1" fill="%23000066"/><rect x="3" y="2" width="1" height="1" fill="%23ccccff"/><rect x="4" y="2" width="6" height="1" fill="%239999ff"/><rect x="4" y="3" width="7" height="1" fill="%23000066"/><rect x="3" y="4" width="1" height="1" fill="%23ccccff"/><rect x="4" y="4" width="6" height="1" fill="%239999ff"/><rect x="4" y="5" width="7" height="1" fill="%23000066"/><rect x="3" y="6" width="1" height="1" fill="%23ccccff"/><rect x="4" y="6" width="6" height="1" fill="%239999ff"/><rect x="4" y="7" width="7" height="1" fill="%23000066"/></svg>') center no-repeat,
    linear-gradient(to right, #9999ff 0 1px, #6666cc 1px 13px, #333399 13px 14px);
  box-shadow: inset 0 1px 0 #9999ff, inset 0 -1px 0 #333399; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical {
  border-top-color: #ccccff; box-shadow: inset 0 -1px 0 #6666cc; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical:active {
  border-top-color: #9999ff; box-shadow: inset 0 -1px 0 #333399; }
.at-y-end::-webkit-scrollbar-thumb:vertical {
  border-bottom-color: #6666cc; box-shadow: inset 0 1px 0 #ccccff; }
.at-y-end::-webkit-scrollbar-thumb:vertical:active {
  border-bottom-color: #333399; box-shadow: inset 0 1px 0 #9999ff; }
/* Safari redraws a custom scroll bar only when its element's own style
   changes, and the classes above change nothing of the element's own: the
   thumb's end merges stayed stale there and doubled the line against the
   arrows. Each class sets a property of its own, so WebKit sees a change. */
.scrolled-y { --sb-scrolled-y: 1; } .at-y-end { --sb-at-y-end: 1; }
.scrolled-x { --sb-scrolled-x: 1; } .at-x-end { --sb-at-x-end: 1; }
::-webkit-scrollbar-button { display: block; width: 16px; height: 16px;
  background: #ddd; border: 1px solid var(--black);
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #bbb;
  background-position: center; background-repeat: no-repeat; }
::-webkit-scrollbar-button:vertical { border-right: 0; }
::-webkit-scrollbar-button:vertical:end:increment:enabled { height: 14px; border-top: 0; border-bottom: 0; }
::-webkit-scrollbar-button:vertical:decrement {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M3 0h2v1h-2z M2 1h4v1h-4z M1 2h6v1h-6z M0 3h8v1h-8z"/></svg>'); }
::-webkit-scrollbar-button:vertical:increment {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M0 0h8v1h-8z M1 1h6v1h-6z M2 2h4v1h-4z M3 3h2v1h-2z"/></svg>'); }
::-webkit-scrollbar-button:active { background-color: #777;
  box-shadow: inset 1px 1px 0 #555, inset -1px -1px 0 #999; }
::-webkit-scrollbar-button:vertical:start:decrement,
::-webkit-scrollbar-button:vertical:start:increment,
::-webkit-scrollbar-button:horizontal:start:decrement,
::-webkit-scrollbar-button:horizontal:start:increment { display: none; }
::-webkit-scrollbar-track:disabled { background: #eee; }
::-webkit-scrollbar-button:disabled { background-color: #eee; box-shadow: none; border: 0;
  border-left: 1px solid var(--black); }
::-webkit-scrollbar-button:vertical:end:increment:disabled { border-top: 1px solid #888; }
::-webkit-scrollbar-button:vertical:end:decrement:disabled { border-top: 1px solid #555; }
::-webkit-scrollbar-button:vertical:decrement:disabled {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="%23888888" d="M3 0h2v1h-2z M2 1h4v1h-4z M1 2h6v1h-6z M0 3h8v1h-8z"/></svg>'); }
::-webkit-scrollbar-button:vertical:increment:disabled {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="%23888888" d="M0 0h8v1h-8z M1 1h6v1h-6z M2 2h4v1h-4z M3 3h2v1h-2z"/></svg>'); }
::-webkit-scrollbar-corner { background: var(--g300); }
</style>
</head>
<body>

<div id="main">
  <div class="sess-col">
    <div class="sess-list" id="list"></div>
    <div class="sess-btns"><button class="ghost" id="new">New</button></div>
    <div class="sess-grip" id="grip"></div>
  </div>
  <div id="wrap">
    <!-- data-autosave: the drafts save as you type, so the desktop does not
         hold its update reload for this field's text -->
    <textarea id="src" placeholder="Type or paste your text here." spellcheck="false" data-autosave></textarea>
    <div id="out"></div>
    <div id="actions">
      <button class="ghost" id="clear" disabled>Clear</button>
      <button class="ghost" id="copy" disabled>Copy</button>
      <button class="ghost" id="accept" disabled>Accept</button>
    </div>
  </div>
</div>

<div id="status">
  <span id="st-state">Ready</span>
  <span id="st-model" title="Options&#8230;">&#8230;</span>
</div>

<div id="toast"></div>
<div id="ctx" class="dropdown" hidden></div>
<div id="veil">
  <div id="dlg"></div>
</div>

<!-- grow box sampled pixel-for-pixel from Mac OS 9 (Infinite Mac) -->
<svg id="grow" width="15" height="15" viewBox="0 0 15 15" shape-rendering="crispEdges">
  <rect width="15" height="15" fill="#ccc"/>
  <path fill="#000" d="M0 0h15v1H0zM0 1h1v14H0z"/>
  <path fill="#fff" d="M1 1h14v1H1zM1 2h1v13H1z"/>
  <path fill="#fff" d="M9 4h2v1H9zM8 5h1v1H8zM7 6h1v1H7zM6 7h1v1H6zM5 8h1v1H5zM4 9h1v1H4zM11 6h2v1h-2zM10 7h1v1h-1zM9 8h1v1H9zM8 9h1v1H8zM7 10h1v1H7zM6 11h1v1H6zM13 8h2v1h-2zM12 9h1v1h-1zM11 10h1v1h-1zM10 11h1v1h-1zM9 12h1v1H9zM8 13h1v1H8z"/>
  <path fill="#777" d="M10 5h1v1h-1zM9 6h1v1H9zM8 7h1v1H8zM7 8h1v1H7zM6 9h1v1H6zM5 10h1v1H5zM12 7h1v1h-1zM11 8h1v1h-1zM10 9h1v1h-1zM9 10h1v1H9zM8 11h1v1H8zM7 12h1v1H7zM14 9h1v1h-1zM13 10h1v1h-1zM12 11h1v1h-1zM11 12h1v1h-1zM10 13h1v1h-1zM9 14h1v1H9z"/>
  <path fill="#aaa" d="M4 10h1v1H4zM6 12h1v1H6zM8 14h1v1H8z"/>
</svg>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const APP = decodeURIComponent(location.pathname.split("/")[2] || "bluepencil");
const CONFIG_URL = "/v1/apps/" + encodeURIComponent(APP) + "/data/config.json";
const DRAFTS_URL = "/v1/apps/" + encodeURIComponent(APP) + "/data/drafts.json";
const LEGACY_URL = "/v1/apps/" + encodeURIComponent(APP) + "/data/draft.json"; // the one draft before the column
const SEL_KEY = "exe-bluepencil-sel:" + APP; // which draft is open: this browser's own

  const modelHint = el("span", { class: "hint" }), effHint = el("span", { class: "hint" });
  const fill = () => {
    const p = prov.value, d = daemon[p], own = p === providerOf(cfg) ? (cfg.model || "") : "";
    sel.replaceChildren(el("option", { value: "" }, "Configured" + (d.model ? " — " + d.model : "")));
    if (own) sel.append(el("option", { value: own }, own));
    sel.value = own;
    eff.replaceChildren(...EFFORTS[p].map(([v, l]) => el("option", { value: v }, l || "Configured — " + (d.effort || "model default"))));
    eff.value = p === providerOf(cfg) ? effortOf(cfg) : "max";
    modelHint.textContent = p === "openai"
      ? "Runs on the ChatGPT subscription signed in under Configuration; the passage goes to OpenAI."
      : "A small local model is plenty for proofreading and answers faster.";
    effHint.textContent = p === "openai"
      ? "Max reads hardest and slowest; None is fastest. A level the model rejects runs at its default."
      : "Max reads hardest and slowest. Off is fastest, but some models then think out loud.";
    // the list fills in behind the current choice, so the menu never jumps
    api("/v1/chat/models?provider=" + p).then(r => r.ok ? r.json() : null).then(dd => {
      if (prov.value !== p || !dd || !Array.isArray(dd.models)) return;
      for (const m of dd.models) {
        if (m === own) continue;
        sel.append(el("option", { value: m }, m));
      }
    }).catch(() => {});
  };
  prov.addEventListener("change", fill);
  fill();
  // the custom prompt, as it was saved. Return starts a new line in it, as
  // in any text of several lines, so there the default button answers to
  // Command- or Control-Return
  const own = el("textarea", { id: "o-prompt", maxlength: String(PROMPT_MAX), spellcheck: "false",
    placeholder: "I prefer writing in lowercase." });
  own.value = promptOf(cfg);
  const chk = el("input", { type: "checkbox", id: "o-marks" });
  chk.checked = cfg.marks !== false;
  const cancel = el("button", { class: "ghost" }, "Cancel");
  const ok = el("button", { class: "ghost default" }, "OK"); // Return's button wears the ring
  dlg.replaceChildren(
    el("h2", {}, "Blue Pencil Options"),
    el("div", { class: "row" }, el("label", { for: "o-provider" }, "Check on:"), popup(prov)),
    el("div", { class: "row" }, el("label", { for: "o-model" }, "Model:"), popup(sel), modelHint),
    el("div", { class: "row" }, el("label", { for: "o-effort" }, "Thinking:"), popup(eff), effHint),
    el("div", { class: "own" }, el("label", { for: "o-prompt" }, "Custom prompt:"), own,
      el("span", { class: "hint" }, "Your own instructions, sent with every check.")),
    el("label", { class: "check" }, chk, "Mark changes in the checked text"),
    el("div", { class: "btns" }, cancel, ok));
  $("#veil").classList.add("on");
  prov.focus();
  // the panel is emptied as it closes: the desktop holds its update reload
  // for a field with typed text in it, and the prompt's field, left behind
  // the veil, would hold it for good
  const close = () => { $("#veil").classList.remove("on"); document.removeEventListener("keydown", keys); dlg.replaceChildren(); src.focus(); };
  const submit = () => {
    const was = backendKey(cfg), wasPrompt = promptOf(cfg);
    cfg.provider = prov.value === "openai" ? "openai" : "";
    cfg.model = sel.value;
    cfg.effort = eff.value;
    cfg.prompt = promptOf({ prompt: own.value });
    cfg.marks = chk.checked;
    syncBackend();
    rechose(was, wasPrompt);
    saveCfg();
    modelLabel();
    close();
    lastInput = 0;
    render();
    kick();
  };
  const keys = e => {
    if (e.isComposing) return; // the key belongs to a word still being composed
    if (e.key === "Escape") close();
    else if (e.key === "Enter" && (e.target !== own || e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
  };
  document.addEventListener("keydown", keys);
  cancel.addEventListener("click", close);
  ok.addEventListener("click", submit);
}
stModel.addEventListener("click", options);

(async () => {
  render();
  await Promise.all([loadCfg(), loadDaemon(), loadDoc()]);
  syncBackend();
  modelLabel();
  sortDrafts();
  for (const d of doc.drafts) adoptChecked(d);
  try { sel = localStorage.getItem(SEL_KEY); } catch (e) {}
  if (!cur()) sel = live().length ? live()[0].id : null;
  if (!sel) { const d = mkDraft(); doc.drafts.unshift(d); sel = d.id; } // a blank draft, ready to type into
  let c = cur();
  const early = src.value;
  if (early) {
    // words typed or pasted before the drafts came (a slow link, a key
    // pressed as the window opened) went into what looked like an empty
    // field: they become a draft of their own, never written over
    if (c.text.trim()) { c = mkDraft(); doc.drafts.unshift(c); sel = c.id; }
    c.text = early;
    c.updated = stamp(c);
    try { localStorage.setItem(SEL_KEY, sel); } catch (e) {}
    scheduleSave();
  } else {
    src.value = c.text;
    src.focus();
    src.setSelectionRange(c.text.length, c.text.length);
  }
  if (migrated) scheduleSave();
  lastInput = early ? Date.now() : 0;
  render();
  kick(); // a draft cut off mid-check picks up where it left off
})();

// ---- desktop window plumbing (same bridge as Notes and Hub) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  t.classList.toggle("scrolled-y", t.scrollTop >= 1);
  t.classList.toggle("at-y-end", t.scrollTop >= 1 && t.scrollTop >= t.scrollHeight - t.clientHeight - 1);
}, { capture: true, passive: true });
</script>
</body>
