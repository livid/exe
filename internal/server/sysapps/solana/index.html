<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solana</title>
<style>
/* Platinum values match the exe desktop (same block as the Analytics app) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --lav: #ccf;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
  --up: #1f7a3a; --down: #b01c1c;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* iOS Safari inflates text after a rotate to landscape (its text-size
   "auto" heuristic) and keeps the inflated size on the way back; 100% pins
   the type to its authored size */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }

#bar { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 10px 10px 8px; align-items: center; }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
/* the chosen token, timeframe and kind stay depressed, like a Platinum segmented control */
button.ghost.on { background: #888; color: #fff;
  box-shadow: inset 1px 1px 0 #666, inset -1px -1px 0 #aaa,
    inset 2px 2px 0 #777, inset -2px -2px 0 #999; }
button.ghost:disabled { color: #999; border-color: #999;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #bbb, inset 2px 2px 0 #fff, inset -2px -2px 0 #ccc; }
.seg { display: flex; gap: 0; flex: none; }
.seg button { border-radius: 0; border-right-width: 0; padding: 2px 9px; }
.seg button:first-child { border-radius: 3px 0 0 3px; }
.seg button:last-child { border-radius: 0 3px 3px 0; border-right-width: 1px; }
/* a token's button wears its coin, the Control Strip's own */
#tokens button svg { width: 16px; height: 16px; vertical-align: -4px; margin-right: 4px; }
/* the chart's own row, at its top left: the timeframe, the kind, the
   panes under the price (volume, RSI), and Now when the chart was dragged
   back */
#tools { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 0 12px 6px; align-items: center; }
#tools .seg button { padding: 2px 7px; font-variant-numeric: tabular-nums; }
#now { margin-left: auto; }
/* a narrow window (a phone's) keeps the coins and drops the words */
@media (max-width: 400px) {
  #tokens button .w { display: none; }
  #tokens button svg { margin-right: 0; }
  #tools .seg button { padding: 2px 5px; }
}

/* the head: the coin, the price now, its change over the day, and the
   day's high and low */
#head { display: flex; align-items: center; gap: 12px; padding: 0 12px 8px; }
#coin svg { width: 32px; height: 32px; display: block; }
#figs { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#top { display: flex; align-items: baseline; gap: 8px; }
#price { font-size: 24px; font-weight: bold; line-height: 28px; font-variant-numeric: tabular-nums; min-width: 72px; }
#price sub { font-size: 12px; vertical-align: -3px; font-weight: normal; }
#change { font-size: 11px; font-weight: bold; line-height: 14px; font-variant-numeric: tabular-nums;
  padding: 1px 6px; border: 1px solid var(--black); border-radius: 3px; background: #fff; min-width: 44px; text-align: center; }
#change.up { color: var(--up); } #change.down { color: var(--down); }
#change.none { color: #999; border-color: #999; }
#sub { font-size: 11px; color: #555; line-height: 14px; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; }

/* the chart: a sunken white field, the desktop's field block; it takes
   the pointer's drag, so the browser gets none of its touches */
#field { flex: 1; min-height: 120px; margin: 0 12px; position: relative; background: #fff;
  border: 1px solid var(--black); touch-action: none; overflow: hidden;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
#field canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #777; font-size: 11px; text-align: center; padding: 0 20px; }

/* the token's moves of the last two days: a short table under the chart,
   the selected one in the desktop's highlight */
#moves { margin: 8px 12px 10px; font-size: 11px; line-height: 14px; }
#moves .row { display: flex; gap: 8px; padding: 2px 4px; align-items: baseline; }
#moves .row.sel { background: var(--hl); color: #fff; }
#moves .t { flex: none; min-width: 84px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#moves .ti { flex: none; font-weight: bold; font-variant-numeric: tabular-nums; }
#moves .ti.up { color: var(--up); } #moves .ti.down { color: var(--down); }
#moves .row.sel .ti { color: #fff; }
#moves .b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555; }
#moves .row.sel .b { color: #ddd; }
#moves .none { color: #777; padding: 2px 4px; }
#moves .more { color: #777; padding: 2px 4px; }

/* overflow: clip — the 11px text's line box is taller than the 14px face and
   hangs a pixel past the bar; clipped, that pixel is no scrollable overflow of
   the page (docs/platinum.md, status bar) */
#status { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px 0 8px; height: 15px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; overflow: clip; }
#st-left { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#st-right { flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }

#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px;
  touch-action: none; z-index: 6; }
body.mobile #grow { display: none; }
body.mobile #status { padding-right: 8px; }
</style>
</head>
<body>
<div id="bar">
  <span class="seg" id="tokens"></span>
</div>
<div id="head">
  <div id="coin"></div>
  <div id="figs">
    <div id="top"><span id="price">—</span><span id="change" class="none">—</span></div>
    <div id="sub"></div>
  </div>
</div>
<div id="tools">
  <span class="seg" id="tfs"></span>
  <span class="seg" id="kinds">
    <button class="ghost" data-k="line">Line</button>
    <button class="ghost" data-k="candles">Candles</button>
  </span>
  <span class="seg" id="panes">
    <button class="ghost" data-p="vol">Vol</button>
    <button class="ghost" data-p="rsi">RSI</button>
    <button class="ghost" data-p="bb">BB</button>
  </span>
  <button class="ghost" id="now" disabled>Now</button>
</div>
<div id="field">
  <canvas id="cv"></canvas>
  <div id="empty" hidden></div>
</div>
<div id="moves"></div>
<div id="status">
  <span id="st-left">Checking…</span>
  <span id="st-right"></span>
</div>
<!-- grow box sampled pixel-for-pixel from Mac OS 9 (Infinite Mac) -->
<svg id="grow" width="15" height="15" viewBox="0 0 15 15" shape-rendering="crispEdges">
  <rect width="15" height="15" fill="#ccc"/>
  <path fill="#000" d="M0 0h15v1H0zM0 1h1v14H0z"/>
  <path fill="#fff" d="M1 1h14v1H1zM1 2h1v13H1z"/>
  <path fill="#fff" d="M9 4h2v1H9zM8 5h1v1H8zM7 6h1v1H7zM6 7h1v1H6zM5 8h1v1H5zM4 9h1v1H4zM11 6h2v1h-2zM10 7h1v1h-1zM9 8h1v1H9zM8 9h1v1H8zM7 10h1v1H7zM6 11h1v1H6zM13 8h2v1h-2zM12 9h1v1h-1zM11 10h1v1h-1zM10 11h1v1h-1zM9 12h1v1H9zM8 13h1v1H8z"/>
  <path fill="#777" d="M10 5h1v1h-1zM9 6h1v1H9zM8 7h1v1H8zM7 8h1v1H7zM6 9h1v1H6zM5 10h1v1H5zM12 7h1v1h-1zM11 8h1v1h-1zM10 9h1v1h-1zM9 10h1v1H9zM8 11h1v1H8zM7 12h1v1H7zM14 9h1v1h-1zM13 10h1v1h-1zM12 11h1v1h-1zM11 12h1v1h-1zM10 13h1v1h-1zM9 14h1v1H9z"/>
  <path fill="#aaa" d="M4 10h1v1H4zM6 12h1v1H6zM8 14h1v1H8z"/>
</svg>

<script>
"use strict";
const $ = s => document.querySelector(s);

// The desktop passes its API token in the iframe URL only when its cookie
// did not take; the app's own arguments are coin and at.
const Q = new URLSearchParams(location.search);
const TOKEN = Q.get("token") || "";
const MOBILE = Q.has("mobile");
if (MOBILE) document.body.classList.add("mobile");
const FONT = getComputedStyle(document.body).fontFamily;

async function api(url) {
  const headers = {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const r = await fetch(url, { headers });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// the four tokens of the Control Strip's ticker, in its order, each with
// its coin — the strip's own struck coin in the token's colour — and the
// colour its line is drawn in
const TOKENS = ["SOL", "PUMP", "MET", "SKR"];
const NAMES = { SOL: "Solana", PUMP: "pump.fun", MET: "Meteora", SKR: "Seeker" };
const LINE = { SOL: "#9945ff", PUMP: "#19c37d", MET: "#f54b00", SKR: "#14b8a6" };
const UNDER = { SOL: "#efe8ff", PUMP: "#e2f7ec", MET: "#ffe9df", SKR: "#dff4f1" };
const coinIcon = (face, hi, lo, mark) => `<svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <path fill="${face}" d="M5 1h6v1H5zM3 2h10v1H3zM2 3h12v2H2zM1 5h14v6H1zM2 11h12v2H2zM3 13h10v1H3zM5 14h6v1H5z"/>
  <path fill="${hi}" d="M5 1h5v1H5zM3 2h2v1H3zM2 3h1v2H2zM1 5h1v4H1z"/>
  <path fill="#fff" d="M5 2h2v1H5zM4 3h1v1H4z"/>
  <path fill="${lo}" d="M6 14h5v1H6zM11 13h2v1H11zM13 11h1v2H13zM14 7h1v4H14z"/>
  ${mark}
  <path fill="#000" d="M5 0h6v1H5zM3 1h2v1H3zM11 1h2v1H11zM2 2h1v1H2zM13 2h1v1H13zM1 3h1v2H1zM14 3h1v2H14zM0 5h1v6H0zM15 5h1v6H15zM1 11h1v2H1zM14 11h1v2H14zM2 13h1v1H2zM13 13h1v1H13zM3 14h2v1H3zM11 14h2v1H11zM5 15h6v1H5z"/>
</svg>`;
const COINS = {
  SOL: coinIcon("#9945ff", "#c9a3ff", "#6b2fc4",
    `<path fill="#14f195" d="M5 4h6v1H5zM4 5h6v1H4zM4 7h6v1H4zM5 8h6v1H5zM5 10h6v1H5zM4 11h6v1H4z"/>`),
  PUMP: coinIcon("#19c37d", "#8ff0c0", "#0e7a4d",
    `<path fill="#000" d="M5 5h6v1H5zM4 6h1v1H4zM11 6h1v1H11zM3 7h1v2H3zM12 7h1v2H12zM4 9h1v1H4zM11 9h1v1H11zM5 10h6v1H5z"/>
  <path fill="#fff" d="M5 6h3v1H5zM4 7h4v2H4zM5 9h3v1H5z"/>
  <path fill="#8ff0c0" d="M8 6h3v1H8zM8 7h4v2H8zM8 9h3v1H8z"/>`),
  MET: coinIcon("#f54b00", "#ff9a6e", "#b03600",
    `<path fill="#f5bd00" d="M7 3h2v1H7zM10 3h2v1H10zM6 4h2v1H6zM9 4h2v1H9zM12 4h1v1H12zM5 5h2v1H5zM8 5h2v1H8zM11 5h2v1H11zM7 6h2v1H7zM10 6h2v1H10zM7 7h1v1H7zM9 7h2v1H9zM12 7h1v1H12zM8 8h2v1H8zM11 8h2v1H11zM10 9h2v1H10zM10 10h1v1H10z"/>
  <path fill="#6e45ff" d="M4 6h2v1H4zM4 7h1v1H4zM6 7h1v1H6zM5 8h2v1H5zM4 9h2v1H4zM7 9h2v1H7zM3 10h2v1H3zM6 10h2v1H6zM9 10h1v1H9zM3 11h1v1H3zM5 11h2v1H5zM8 11h2v1H8zM4 12h2v1H4zM8 12h1v1H8zM4 13h1v1H4z"/>
  <path fill="#000" d="M9 3h1v1H9zM8 4h1v1H8zM11 4h1v1H11zM7 5h1v1H7zM10 5h1v1H10zM6 6h1v1H6zM9 6h1v1H9zM12 6h1v1H12zM5 7h1v1H5zM8 7h1v1H8zM11 7h1v1H11zM7 8h1v1H7zM10 8h1v1H10zM6 9h1v1H6zM9 9h1v1H9zM5 10h1v1H5zM8 10h1v1H8zM4 11h1v1H4z"/>`),
  SKR: coinIcon("#14b8a6", "#8ee8dc", "#0b7a6e",
    `<path fill="#000" d="M5 3h6v10H5z"/>
  <path fill="#fff" d="M6 5h4v6H6z"/>`),
};

// the timeframes, as a trading chart names them, each the seconds a
// candle covers; the daemon serves them from Coinbase's candles
const TFS = [["1m", 60], ["5m", 300], ["15m", 900], ["1h", 3600], ["4h", 14400], ["1d", 86400]];
const STEP = Object.fromEntries(TFS);

// what the window shows: the token, the timeframe, the kind of chart, the
// move selected (a notice's or the menu's, by the move's time), the day's
// samples and moves, the candles loaded, and the view over them
let token = TOKENS.includes((Q.get("coin") || "").toUpperCase()) ? Q.get("coin").toUpperCase() : "SOL";
let tf = "1h", kind = "candles", showVol = true, showRSI = true, showBB = true;
let selAt = +Q.get("at") || 0;
let data = null, dataT = 0, paused = false;
try {
  const t = localStorage.getItem("exe_solana_token"); if (!Q.get("coin") && TOKENS.includes(t)) token = t;
  const f = localStorage.getItem("exe_solana_tf"); if (STEP[f]) tf = f;
  const k = localStorage.getItem("exe_solana_kind"); if (k === "line" || k === "candles") kind = k;
  if (localStorage.getItem("exe_solana_vol") === "0") showVol = false;
  if (localStorage.getItem("exe_solana_rsi") === "0") showRSI = false;
  if (localStorage.getItem("exe_solana_bb") === "0") showBB = false;
} catch (e) {}
// the candles of one token and timeframe, by their time; oldest and
// newest; whether Coinbase has run out of past (an empty page), whether a
// page is on its way
let series = { key: "", map: new Map(), times: [], rsi: new Map(), bb: new Map(), oldest: 0, newest: 0, exhausted: false, loading: false, fetched: 0, err: "" };
// the view: cw is a candle's slot in CSS px (the wheel changes it); rightT
// is the time at the plot's right edge, or null to follow the newest
// candle with two empty slots after it, as a trading chart does
let cw = 7, rightT = null;
let hover = null; // { x, y } in CSS px over the field, or null
let drag = null;

// ---- figures ----
// four significant figures; a run of zeros after the point folds into a
// small sunk count, as the ticker writes a price: 0.004269 is $0.0₂4269
function fig(v, from = 3) {
  const [m, e] = v.toExponential(3).split("e");
  if (-e - 1 < from) return [v.toPrecision(4)];
  return ["0.0", { sub: String(-e - 1) }, m.replace(".", "")];
}
const usdParts = v => v >= 1 ? ["$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })] : ["$", ...fig(v)];
const usd = v => usdParts(v).map(p => typeof p === "string" ? p : p.sub.replace(/\d/g, d => "₀₁₂₃₄₅₆₇₈₉"[d])).join("");
function usdDOM(node, v) {
  node.replaceChildren(...usdParts(v).map(p => {
    if (typeof p === "string") return p;
    const s = document.createElement("sub"); s.textContent = p.sub; return s;
  }));
}
// a price on the axis or in a legend: plain figures, cents from a dollar,
// four significant figures under it, and never fewer than the grid asks
const plain = (v, dec) => v.toFixed(dec);
const decFor = v => v >= 1 ? 2 : Math.max(2, 3 - Math.floor(Math.log10(v)));
const pct = c => (c < 0 ? "−" : "+") + Math.abs(c).toFixed(1) + "%";
const clock = t => new Date(t).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const day = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
// a date in the status line says its year when it is not this year's
const dayYear = t => new Date(t).toLocaleDateString(undefined, new Date(t).getFullYear() === new Date().getFullYear() ? { month: "short", day: "numeric" } : { year: "numeric", month: "short", day: "numeric" });
const dayClock = t => new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const month = t => new Date(t).toLocaleDateString(undefined, { month: "short" });

// ---- the candles ----
const step = () => STEP[tf];
function resetSeries() {
  series = { key: token + "|" + tf, map: new Map(), times: [], rsi: new Map(), bb: new Map(), oldest: 0, newest: 0, exhausted: false, loading: false, fetched: 0, err: "" };
  rightT = null; hover = null;
}
// one page: the newest (end 0) or the one ending at end; a page already
// loaded is merged candle by candle, so a refresh of the newest only
// changes what changed
async function loadPage(end) {
  const key = series.key;
  if (series.loading) return;
  series.loading = true;
  const q = "/v1/prices/candles?token=" + token + "&tf=" + tf + (end ? "&end=" + end : "");
  let r;
  try { r = await api(q); } catch (e) {
    if (series.key === key) { series.loading = false; series.err = e.message; status(); }
    return;
  }
  if (series.key !== key) return; // the window moved on
  series.loading = false; series.err = "";
  series.fetched = r.fetched_at ? new Date(r.fetched_at).getTime() : Date.now();
  for (const c of r.candles) series.map.set(c[0], c);
  if (end && !r.candles.length) series.exhausted = true;
  const ts = [...series.map.keys()].sort((a, b) => a - b);
  series.times = ts;
  series.oldest = ts.length ? ts[0] : 0;
  series.newest = ts.length ? ts[ts.length - 1] : 0;
  computeIndicators();
  if (!end && !r.candles.length) series.exhausted = true;
  draw(); status();
}
// The indicators, computed over the whole series loaded, a quiet slot
// counted as a flat candle, once per page that lands. RSI over 14
// candles, Wilder's way, as TradingView's RSI is: the first average gain
// and loss are plain means of the first 14 changes, then each smooths
// the last by a fourteenth; a value stands from the fifteenth candle on.
// Bollinger Bands as TradingView draws them: the basis a plain mean of
// the last 20 closes, the bands two standard deviations (of the
// population) out; they stand from the twentieth candle on.
const RSI_N = 14, BB_N = 20, BB_K = 2;
function computeIndicators() {
  const st = step(), ts = series.times, rsi = new Map(), bb = new Map();
  if (ts.length >= 1) {
    let prevClose = series.map.get(ts[0])[4], gains = 0, losses = 0, n = 0, avgG = 0, avgL = 0;
    const win = []; let sum = 0, sumSq = 0;
    const take = (t, close) => {
      win.push(close); sum += close; sumSq += close * close;
      if (win.length > BB_N) { const gone = win.shift(); sum -= gone; sumSq -= gone * gone; }
      if (win.length === BB_N) {
        const mean = sum / BB_N, sd = Math.sqrt(Math.max(0, sumSq / BB_N - mean * mean));
        bb.set(t, [mean, mean + BB_K * sd, mean - BB_K * sd]);
      }
    };
    take(ts[0], prevClose);
    for (let t = ts[0] + st; t <= series.newest; t += st) {
      const c = series.map.get(t), close = c ? c[4] : prevClose;
      const d = close - prevClose, gain = d > 0 ? d : 0, loss = d < 0 ? -d : 0;
      n++;
      if (n < RSI_N) { gains += gain; losses += loss; }
      else {
        if (n === RSI_N) { avgG = (gains + gain) / RSI_N; avgL = (losses + loss) / RSI_N; }
        else { avgG = (avgG * (RSI_N - 1) + gain) / RSI_N; avgL = (avgL * (RSI_N - 1) + loss) / RSI_N; }
        rsi.set(t, avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL));
      }
      take(t, close);
      prevClose = close;
    }
  }
  series.rsi = rsi; series.bb = bb;
}
// a volume, short: 1.23M, 45.6K
const vol = v => v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : v.toFixed(0);
// the newest candle before a time, or null: the one a quiet slot's flat
// candle takes its price from
function lastBefore(t) {
  const ts = series.times;
  let lo = 0, hi = ts.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (ts[mid] < t) lo = mid + 1; else hi = mid; }
  return lo > 0 ? series.map.get(ts[lo - 1]) : null;
}
// the view's right edge, in seconds: where it was dragged, or two slots
// past the newest candle

    change.textContent = pct(c) + " · 24 h";
    change.className = c < 0 ? "down" : "up";

function showMove(ms) {
  const st = step(), t = Math.floor(ms / 1000 / st) * st;
  const box = $("#field"), dpr = window.devicePixelRatio || 1;
  const slots = Math.floor((box.clientWidth - 64) / cw);
  const right = viewRight();
  if (t < right - slots * st + 2 * st || t > right) rightT = Math.min(t + Math.floor(slots * 0.6) * st, series.newest + 2 * st);
  if (rightT !== null && rightT >= series.newest + 2 * st) rightT = null;
}
function status() {
  const st = data && data.status;
  if (series.err) $("#st-left").textContent = "The daemon did not answer: " + series.err;
  else if (!series.fetched) $("#st-left").textContent = "Checking…";
  else if (st && st.last_err && (!st.last_ok || Date.now() - new Date(st.last_ok).getTime() > 5 * 60 * 1000)) $("#st-left").textContent = "Coinbase did not answer: " + st.last_err;
  else $("#st-left").textContent = "Coinbase candles · " + tf + " · updated " + clock(series.fetched) + (series.exhausted ? " · the beginning" : "");
  // the span in view
  const box = $("#field"), slots = Math.floor((box.clientWidth - 64) / cw), right = Math.min(viewRight(), series.newest || viewRight());
  const left = right - slots * step();
  $("#st-right").textContent = series.newest ? (step() >= 86400 || right - left > 2 * 86400 ? dayYear(left * 1000) + " – " + dayYear(right * 1000) : dayClock(left * 1000) + " – " + clock(right * 1000)) : "";
}

async function loadDay() {
  try {
    data = await api("/v1/prices/history?token=" + token);
    dataT = Date.now();
  } catch (e) {
    data = data && data.token === token ? data : null;
  }
  paint(); draw();
}
function setToken(t) {
  token = t;
  try { localStorage.setItem("exe_solana_token", t); } catch (e) {}
  for (const b of document.querySelectorAll("#tokens button")) b.classList.toggle("on", b.dataset.t === t);
  data = null; resetSeries();
  paint(); draw(); loadDay(); loadPage(0);
}
function setTF(f) {
  tf = f;
  try { localStorage.setItem("exe_solana_tf", f); } catch (e) {}
  for (const b of document.querySelectorAll("#tfs button")) b.classList.toggle("on", b.dataset.f === f);
  resetSeries(); draw(); status(); loadPage(0);
}
function setKind(k) {
  kind = k;
  try { localStorage.setItem("exe_solana_kind", k); } catch (e) {}
  for (const b of document.querySelectorAll("#kinds button")) b.classList.toggle("on", b.dataset.k === k);
  draw();
}

// ---- the controls ----
for (const t of TOKENS) {
  const b = document.createElement("button");
  b.className = "ghost" + (t === token ? " on" : ""); b.dataset.t = t;
  b.innerHTML = COINS[t] + `<span class="w">${t}</span>`;
  b.addEventListener("click", () => { if (t !== token) { selAt = 0; setToken(t); } });
  $("#tokens").append(b);
}
for (const [f] of TFS) {
  const b = document.createElement("button");
  b.className = "ghost" + (f === tf ? " on" : ""); b.dataset.f = f; b.textContent = f;
  b.addEventListener("click", () => { if (f !== tf) setTF(f); });
  $("#tfs").append(b);
}
for (const b of document.querySelectorAll("#kinds button")) {
  b.classList.toggle("on", b.dataset.k === kind);
  b.addEventListener("click", () => { if (b.dataset.k !== kind) setKind(b.dataset.k); });
}
for (const b of document.querySelectorAll("#panes button")) {
  const on = () => b.dataset.p === "vol" ? showVol : b.dataset.p === "rsi" ? showRSI : showBB;
  b.classList.toggle("on", on());
  b.addEventListener("click", () => {
    if (b.dataset.p === "vol") showVol = !showVol; else if (b.dataset.p === "rsi") showRSI = !showRSI; else showBB = !showBB;
    try { localStorage.setItem("exe_solana_" + b.dataset.p, on() ? "1" : "0"); } catch (e) {}
    b.classList.toggle("on", on());
    draw();
  });
}
$("#now").addEventListener("click", () => { rightT = null; draw(); status(); });

// the chart takes the pointer: a drag pans the view through time, a press
// on a dot selects its move, the wheel changes a candle's width about the
// pointer, and rest shows the cross
const field = $("#field");
field.addEventListener("pointerdown", ev => {
  if (ev.button !== undefined && ev.button !== 0) return;
  const r = field.getBoundingClientRect();
  drag = { x: ev.clientX, y: ev.clientY, right: viewRight(), moved: false, id: ev.pointerId };
  field.setPointerCapture(ev.pointerId);
  hover = { x: ev.clientX - r.left, y: ev.clientY - r.top };
  draw();
});
field.addEventListener("pointermove", ev => {
  const r = field.getBoundingClientRect();
  if (drag) {
    const dx = ev.clientX - drag.x;
    if (Math.abs(dx) > 3 || Math.abs(ev.clientY - drag.y) > 3) drag.moved = true;
    if (drag.moved) {
      const st = step(), slots = Math.floor((field.clientWidth - 64) / cw);
      let right = drag.right - dx / cw * st;
      // the newest candle never leaves the view, nor does the oldest
      // Coinbase has, once it is known
      right = Math.min(right, series.newest + (slots - 3) * st);
      if (series.exhausted && series.oldest) right = Math.max(right, series.oldest + Math.min(slots, 5) * st);
      rightT = right;
      hover = null;
      draw(); status();
      return;
    }
  }
  hover = { x: ev.clientX - r.left, y: ev.clientY - r.top };
  draw();
});
function dragEnd(ev) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) {
    const r = field.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    const hit = ($("#cv")._dots || []).find(p => Math.hypot(p.x - x, p.y - y) <= 9);
    if (hit) { selAt = isSel(hit.m) ? 0 : hit.m.ms; paint(); }
  } else if (rightT !== null && rightT >= series.newest + 1.5 * step()) rightT = null; // back at the newest: follow it
  if (ev.pointerType === "touch") hover = null;
  draw(); status();
}
field.addEventListener("pointerup", dragEnd);
field.addEventListener("pointercancel", dragEnd);
field.addEventListener("pointerleave", () => { if (!drag && hover) { hover = null; draw(); } });
field.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = field.getBoundingClientRect(), x = ev.clientX - r.left;
  const st = step(), plotRight = field.clientWidth - 58;
  const was = cw;
  cw = Math.max(2, Math.min(30, cw * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)));
  if (cw === was) return;
  // the time under the pointer stays under it
  const right = viewRight(), tAt = right - (plotRight - x) / was * st;
  rightT = tAt + (plotRight - x) / cw * st;
  const slots = Math.floor((field.clientWidth - 64) / cw);
  rightT = Math.min(rightT, series.newest + (slots - 3) * st);
  if (rightT >= series.newest + 1.5 * st) rightT = null;
  draw(); status();
}, { passive: false });
new ResizeObserver(() => { draw(); status(); }).observe(field);
matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`).addEventListener("change", draw);

// ---- desktop window plumbing (same bridge as the Analytics app) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
// the desktop opens the window again on a move: a notice's, the menu's
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || typeof e.data.exe !== "string") return;
  if (e.data.exe === "open") {
    const t = String(e.data.coin || "").toUpperCase();
    selAt = +e.data.at || 0;
    if (TOKENS.includes(t) && t !== token) setToken(t);
    else { if (selAt) showMove(selAt); paint(); draw(); if (Date.now() - dataT > 30 * 1000) loadDay(); }
  } else if (e.data.exe === "hide") paused = true;
  else if (e.data.exe === "show") { paused = false; if (Date.now() - dataT > 30 * 1000) { loadDay(); loadPage(0); } }
});
// the newest page again every half minute (a minute's candle changes as
// it fills), the day's samples just past each whole minute
function tick() {
  if (!paused && !document.hidden) { loadPage(0); if (Date.now() - dataT > 55 * 1000) loadDay(); }
  setTimeout(tick, 30 * 1000);
}
paint();
resetSeries();
loadDay();
loadPage(0).then(() => { if (selAt) { showMove(selAt); draw(); status(); } });
setTimeout(tick, 30 * 1000);
</script>
</body>
