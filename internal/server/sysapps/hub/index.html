// Join: the profile goes to the hub first, where there is one to send and
// the key may send it, so a refusal is read on the page it came from; then
// the address is kept and the app opens on the hub.
async function joinFinish() {
  const live = joinRun(), had = J.profile || {};
  const body = { name: J.name.trim(), bio: J.bio.trim() };
  if (J.avatar) body.avatar = J.avatar;
  const send = joinMay() !== false && !!who && !!body.name &&
    (body.name !== had.name || body.bio !== (had.bio || "") || J.avatar !== (had.avatar || ""));
  joinBusy(true);
  if (send) {
    joinNote("Publishing the profile…");
    let why = "";
    try { await publish("profile.set", body, J.hub); } catch (e) { why = e.message || "no answer"; }
    if (!live()) return;
    if (why) {
      // the gate may have changed its mind since the last step: ask, and
      // the page says where the key stands now
      const [gate] = await joinAskKey();
      if (!live()) return;
      if (gate) J.gate = gate;
      J.busy = false;
      J.note = { text: "The hub did not take the profile: " + why + "." +
        (joinMay() === false ? "" : " Join again, or empty the name to join without one."), err: true };
      joinDraw();
      return;
    }
  }
  joinNote("Joining…");
  let why = "";
  try {
    const r = await api(CONFIG_URL, { method: "PUT", body: JSON.stringify({ hub: J.hub }) });
    if (!r.ok) { await r.text().catch(() => {}); throw new Error("HTTP " + r.status); }
  } catch (e) { why = e.message; }
  if (!live()) return;
  if (why) { joinBusy(false); joinNote("exe could not keep the address: " + why, true); return; }
  hub = J.hub; hubInfo = J.info; relayed = J.relayed;
  joinClose();
  await connected();
  toast("Joined " + jhost(hub));
}

$("#j-cancel").onclick = joinCancel;
$("#j-back").onclick = () => { if (J.step > 0 && !J.busy) { J.run++; J.step--; J.note = null; joinDraw(); } };
$("#j-next").onclick = () => {
  if (J.busy) return;
  if (J.step === 0) { joinAsk(); return; }
  if (J.step === J_STEPS.length - 1) { joinFinish(); return; }
  J.run++;
  J.step++;
  J.note = null;
  joinDraw();
};
// Return presses the ringed button and Escape is Cancel, while no panel
// of the veil's is over the wizard
document.addEventListener("keydown", e => {
  if (!J || e.isComposing || $("#veil").classList.contains("on")) return;
  if (e.key === "Escape") { if (!$("#j-cancel").hidden) { e.preventDefault(); joinCancel(); } return; }
  if (e.key !== "Enter" || e.target.closest("button, a")) return;
  e.preventDefault();
  $("#j-next").click();
});
// The desktop asks for the wizard. While the app is still finding its
// hub the word is kept for the end of that; over a panel someone is
// working in it is not heard — only the panel that waits for a saved hub
// to answer steps aside.
let booted = false, wantJoin = new URLSearchParams(location.search).get("join") === "1", bootDlg = null;
function joinAsked() {
  if (!booted) { wantJoin = true; return; }
  if (J) return;
  if ($("#veil").classList.contains("on")) {
    if (!(bootDlg && bootDlg.input.isConnected)) return;
    bootDlg.close();
  }
  joinOpen();
}
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.exe !== "open" || e.data.join !== "1") return;
  joinAsked();
});

// ---- boot ----
async function connected() {
  $("#st-hub").textContent = hub.replace(/^https?:\/\//, "") +
    " — hub " + hubInfo.id + (relayed ? ", through exe" : "");
  $("#st-gate").textContent = hubInfo.gate && hubInfo.gate.mode === "token"
    ? "token-gated" : "open";
  myProfile = null;
  if (who) {
    try { myProfile = await hget("/v1/profile/" + who.id); } catch (e) {}
  }
  // a draft written in a thread opens on that thread (the feed's late
  // arrival would paint over a thread opened after it)
  const draft = readDraft();
  if (!(draft && draft.thread && await openThread(draft.thread))) showFeed();
  connectEvents();
  restoreDraft(draft);
  if (!myProfile) say("No profile yet — set a display name via Profile…");
}

(async () => {
  try {
    const r = await api("/v1/hub/whoami");
    if (r.ok) who = await r.json();
  } catch (e) {}
  let saved = null;
  try {
    const r = await api(CONFIG_URL);
    if (r.ok) saved = await r.json();
  } catch (e) {}
  // A saved hub that does not answer is usually on its way back: the hub
  // restarting under a deploy, a machine awake before its tailnet is. So
  // boot keeps asking for a few seconds before it says unreachable, the
  // dialog then opens on the saved address, and the asking goes on behind
  // it — the hub's return closes the dialog and connects. It stops once
  // another address is being typed or Connect has done the job.
  const reach = async ms => {
    try { const at = await askHub(hub, ms); hubInfo = at.info; relayed = at.relayed; } catch (e) {}
    return !!hubInfo;
  };
  const pause = ms => new Promise(done => setTimeout(done, ms));
  if (saved && saved.hub) {
    hub = saved.hub;
    const until = Date.now() + 7000;
    while (!await reach(Math.max(3000, until - Date.now())) && Date.now() + 1000 < until) {
      $("#st-hub").textContent = "Connecting to " + hub.replace(/^https?:\/\//, "") + "\u2026";
      await pause(1000);
    }
    if (hubInfo) {
      await connected();
      booted = true;
      if (wantJoin) joinOpen();
      return;
    }
    $("#st-hub").textContent = "Hub unreachable: " + hub;
  }
  feedEl.append(el("div", { class: "muted" }, "Not connected."));
  booted = true;
  // no hub yet, or the desktop asked for the wizard by name: Join a Hub
  if (!hub || wantJoin) {
    if (!hub) $("#st-hub").textContent = "Not connected";
    joinOpen();
    return;
  }
  const dlg = bootDlg = hubDialog(true, null, "This hub is not answering. Still trying…");
  const savedHub = hub;
  const waiting = () => !hubInfo && dlg.input.value.trim() === savedHub;
  while (waiting()) {
    await pause(5000);
    if (dlg.go.disabled) continue; // Connect is asking right now
    let at = null;
    try { at = await askHub(savedHub); } catch (e) {}
    if (!at || !waiting() || dlg.go.disabled) continue;
    hubInfo = at.info;
    relayed = at.relayed;
    if (dlg.input.isConnected) dlg.close(); // the wizard may have taken its place
    await connected();
  }
})();

// ---- desktop window plumbing (same bridge as Notes) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  t.classList.toggle("scrolled-y", t.scrollTop >= 1);
  t.classList.toggle("at-y-end", t.scrollTop >= 1 && t.scrollTop >= t.scrollHeight - t.clientHeight - 1);
  t.classList.toggle("scrolled-x", t.scrollLeft >= 1);
  t.classList.toggle("at-x-end", t.scrollLeft >= 1 && t.scrollLeft >= t.scrollWidth - t.clientWidth - 1);
}, { capture: true, passive: true });
</script>
