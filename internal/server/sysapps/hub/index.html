function sentenceMenu(m, x) {
  const v = textEl.value, y = Math.round(textEl.getBoundingClientRect().bottom) + 2;
  if (v.slice(m.start, m.end) !== m.was) return;
  showMenu(x, y, sentenceItems(v, [sentenceOf(v, m)], () => {}), true);
}

// ---- the count is a button ----
// Livid's shape for reviewing a post once it is written: "3 Suggestions"
// is a push button where the count stood, and pressing it hangs a layer
// under it with every sentence the pencil would change, complete and as
// it will read, each with its choices. The layer is the marks spliced
// into the field's own words — what Accept All would write, Ignores left
// out (Codex's point: never the model's stored rewrite, which still holds
// them) — so it cannot differ from what the choices then do. A choice
// leaves the layer up with what remains, the count on the button going
// down with it; it closes when nothing is left, on Escape, a click
// elsewhere, the button again, or typing. The button keeps its pressed
// look while the layer is up and never takes the caret from the field.
let suggWasOpen = null; // the layer's state at a pointer's mousedown; null when the click has none
const marksSig = () => pMarks.map(m => m.start + ":" + m.end + ":" + m.now).join("|");
function sentencesOf(v) { // every sentence that holds a mark, in reading order
  const out = [];
  for (const m of pMarks) if (!out.length || m.start >= out[out.length - 1].e) out.push(sentenceOf(v, m));
  return out;
}
function openReview() {
  const v = textEl.value, list = sentencesOf(v);
  if (!list.length) { hideMenu(); return; }
  const r = suggEl.getBoundingClientRect();
  showMenu(Math.round(r.left), Math.round(r.bottom) + 2, sentenceItems(v, list, openReview), true);
  reviewOpen = true;
  reviewSig = marksSig();
  suggEl.classList.add("open");
}
// The document's mousedown has closed the layer by the time a pointer's
// click comes, so whether that press opens or closes is noted first. A
// click from the keyboard (Return or Space on the button) has no
// mousedown before it and nothing has closed the layer: it goes by
// whether the layer is up (Codex's catch — it used to open it again).
suggEl.addEventListener("mousedown", e => { suggWasOpen = reviewOpen; e.preventDefault(); });
suggEl.addEventListener("click", () => {
  const close = suggWasOpen === null ? reviewOpen : suggWasOpen;
  suggWasOpen = null;
  if (close) hideMenu(); else openReview();
});
textEl.addEventListener("click", e => {
  if (textEl.selectionStart !== textEl.selectionEnd) return; // a drag chose text
  const hit = markAt(e.clientX, e.clientY);
  if (hit) markMenu(hit);
});
textEl.addEventListener("contextmenu", e => {
  const hit = markAt(e.clientX, e.clientY);
  if (!hit) return; // elsewhere the browser's own menu, for cut and paste
  e.preventDefault();
  markMenu(hit);
});
pencilLoad().then(pencilRender);

// ---- dialogs ----
function dialog(children) {
  const dlg = $("#dlg");
  dlg.replaceChildren(...children);
  $("#veil").classList.add("on");
  return () => $("#veil").classList.remove("on");
}

// the hub URL as the HTTP multiaddr another hub's admin would peer.add
function toMultiaddr(u) {
  const url = new URL(u);
  const host = url.hostname.replace(/^\[|\]$/g, "");
  const port = url.port || (url.protocol === "https:" ? "443" : "80");
  const proto = /^\d+\.\d+\.\d+\.\d+$/.test(host) ? "ip4" : host.includes(":") ? "ip6" : "dns4";
  return "/" + proto + "/" + host + "/tcp/" + port + "/" + (url.protocol === "https:" ? "https" : "http");
}

// info is fetched BEFORE the dialog shows so it opens at its final size
// (the desktop About window sets the pattern). A hub that is down still
// gets its dialog — from what we last knew — so Connect… stays reachable.
async function hubInfoDialog() {
  if (!hub) { hubDialog(true); return; }
  try { hubInfo = await hget("/v1/hub"); }
  catch (e) { say("Hub unreachable: " + e.message, true); }
  showHubInfo(hubInfo);
}
function showHubInfo(info) {
  info = info || {};
  const row = (label, val, mono, copyAs) => {
    const v = el("span", { class: "ival" + (mono ? " mono" : "") }, val);
    if (copyAs) {
      v.classList.add("copy");
      v.title = "Click to copy";
      // a drag-select ends in a click too; only copy when nothing is selected
      v.onclick = () => { if (getSelection().isCollapsed) copyText(val, copyAs); };
    }
    return el("div", { class: "irow" }, el("span", { class: "ilab" }, label), v);
  };
  const st = info.stats;
  const connect = el("button", { class: "ghost left" }, "Connect…");
  const ok = el("button", { class: "ghost default" }, "OK");
  const close = dialog([
    el("h2", {}, "Hub Info"),
    row("Address", hub, false, "address"),
    row("Multiaddr", toMultiaddr(hub), true, "multiaddr"),
    row("Hub id", info.id || "—", true, info.id && "hub id"),
    row("Public key", info.pubkey || "—", true, info.pubkey && "public key"),
    row("Gate", info.gate ? (info.gate.mode === "token" ? "token-gated" : "open") : "—"),
    row("Users", st ? st.profiles.toLocaleString() : "—"),
    row("Posts", st ? st.posts.toLocaleString() : "—"),
    el("div", { class: "btns" }, connect, ok)]);
  ok.onclick = close;
  // Connect to a Hub replaces this panel; its Cancel brings this one back
  connect.onclick = () => hubDialog(false, () => showHubInfo(info));
}
$("#st-hub").onclick = hubInfoDialog;

// firstRun: the onboarding form, no way out but connecting.
// onCancel: what Cancel returns to (the Hub Info dialog), else just close.
// The field opens on the hub we know — empty only before there is one —
// so a saved hub that did not answer takes one Return to ask again.
function hubDialog(firstRun, onCancel, note) {
  const input = el("input", { type: "text", placeholder: "http://hub.example:7788",
    value: hub });
  const err = el("div", { class: "err" }, note || "");
  const go = el("button", { class: "ghost default" }, "Connect");
  const cancel = el("button", { class: "ghost" }, "Cancel");
  const btns = firstRun ? [go] : [cancel, go];
  const close = dialog([
    el("h2", {}, "Connect to a Hub"),
    el("div", { class: "row" },
      el("label", {}, "Hub address"), input),
    el("div", { style: "font-size:11px;color:#555" },
      "A hub is an exe-hub daemon your posts publish to. Ask its operator for the address."),
    err,
    el("div", { class: "btns" }, ...btns)]);
  cancel.onclick = () => { close(); if (onCancel) onCancel(); };
  const submit = async () => {
    let v = input.value.trim();
    if (!v) return;
    if (!/^https?:\/\//.test(v)) v = "http://" + v;
    go.disabled = true;
    err.textContent = "";
    try {
      const at = await askHub(v.replace(/\/+$/, ""));
      hub = v.replace(/\/+$/, "");
      hubInfo = at.info;
      relayed = at.relayed;
      await api(CONFIG_URL, { method: "PUT", body: JSON.stringify({ hub }) });
      close();
      await connected();
    } catch (e) {
      err.textContent = "Could not reach a hub there: " + e.message;
    }
    go.disabled = false;
  };
  go.onclick = submit;
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  setTimeout(() => input.focus(), 50);
  return { close, input, go };
}

function profileDialog(needName) {
  let avatarCid = myProfile ? (myProfile.avatar || "") : "";
  const name = el("input", { type: "text", maxlength: 64,
    value: myProfile ? myProfile.name : (who ? who.name : "") });
  const bio = el("input", { type: "text", maxlength: 200,
    value: myProfile ? (myProfile.bio || "") : "" });
  // focusing (tab or the auto-focus below) lands the caret at the end of
  // the existing text; a mouse click still places it where clicked
  for (const inp of [name, bio])
    inp.addEventListener("focus", () =>
      inp.setSelectionRange(inp.value.length, inp.value.length));
  const err = el("div", { class: "err" },
    needName ? "Pick a display name before your first post." : "");
  const avaBox = el("div", { class: "ava-row" });
  const pick = el("button", { class: "ghost" }, "Choose Picture…");
  const file = el("input", { type: "file", accept: "image/*", hidden: "" });
  const renderAva = () =>
    avaBox.replaceChildren(avatarEl(who ? who.id : "0", avatarCid, "ava-big"), pick, file);
  renderAva();
  pick.onclick = () => file.click();
  file.onchange = async e => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 8 << 20) { err.textContent = "Image is over 8MB."; return; }
    pick.disabled = true;
    err.textContent = "";
    try {
      const r = await api("/v1/hub/avatar?hub=" + encodeURIComponent(hub),
        { method: "POST", body: f });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || "HTTP " + r.status);
      avatarCid = out.cid; // the hub minted a 128×128 PNG (alpha kept)
      renderAva();
    } catch (e2) { err.textContent = e2.message; }
    pick.disabled = false;
  };
  const save = el("button", { class: "ghost default" }, "Save");
  const cancel = el("button", { class: "ghost" }, "Cancel");
  const close = dialog([
    el("h2", {}, "Your Profile"),
    el("div", { class: "row" }, el("label", {}, "Picture"), avaBox),
    el("div", { class: "row" }, el("label", {}, "Display name"), name),
    el("div", { class: "row" }, el("label", {}, "Bio"), bio),
    el("div", { style: "font-size:11px;color:#555" },
      "Your id here is this node's key fingerprint" + (who ? ": " + who.id : ".")),
    err,
    el("div", { class: "btns" }, cancel, save)]);
  cancel.onclick = close;
  save.onclick = async () => {
    if (!name.value.trim()) { err.textContent = "A name is required."; return; }
    save.disabled = true;
    const body = { name: name.value.trim(), bio: bio.value.trim() };
    if (avatarCid) body.avatar = avatarCid;
    try {
      await publish("profile.set", body);
      myProfile = { name: body.name, bio: body.bio, avatar: avatarCid };
      close();
      say("");
      loadFeed(); // own posts pick up the new picture
    } catch (e) { err.textContent = e.message; save.disabled = false; }
  };
  setTimeout(() => name.focus(), 50);
}
$("#me").onclick = () => profileDialog(false);

// ---- boot ----
async function connected() {
  $("#st-hub").textContent = hub.replace(/^https?:\/\//, "") +
    " — hub " + hubInfo.id + (relayed ? ", through exe" : "");
  $("#st-gate").textContent = hubInfo.gate && hubInfo.gate.mode === "token"
    ? "token-gated" : "open";
  myProfile = null;
  if (who) {
    try { myProfile = await hget("/v1/profile/" + who.id); } catch (e) {}
  }
  showFeed();
  connectEvents();
  if (!myProfile) say("No profile yet — set a display name via Profile…");
}

(async () => {
  try {
    const r = await api("/v1/hub/whoami");
    if (r.ok) who = await r.json();
  } catch (e) {}
  let saved = null;
  try {
    const r = await api(CONFIG_URL);
    if (r.ok) saved = await r.json();
  } catch (e) {}
  // A saved hub that does not answer is usually on its way back: the hub
  // restarting under a deploy, a machine awake before its tailnet is. So
  // boot keeps asking for a few seconds before it says unreachable, the
  // dialog then opens on the saved address, and the asking goes on behind
  // it — the hub's return closes the dialog and connects. It stops once
  // another address is being typed or Connect has done the job.
  const reach = async ms => {
    try { const at = await askHub(hub, ms); hubInfo = at.info; relayed = at.relayed; } catch (e) {}
    return !!hubInfo;
  };
  const pause = ms => new Promise(done => setTimeout(done, ms));
  if (saved && saved.hub) {
    hub = saved.hub;
    const until = Date.now() + 7000;
    while (!await reach(Math.max(3000, until - Date.now())) && Date.now() + 1000 < until) {
      $("#st-hub").textContent = "Connecting to " + hub.replace(/^https?:\/\//, "") + "\u2026";
      await pause(1000);
    }
    if (hubInfo) { await connected(); return; }
    $("#st-hub").textContent = "Hub unreachable: " + hub;
  }
  feedEl.append(el("div", { class: "muted" }, "Not connected."));
  const dlg = hubDialog(true, null, hub ? "This hub is not answering. Still trying…" : "");
  if (!hub) return;
  const savedHub = hub;
  const waiting = () => !hubInfo && dlg.input.value.trim() === savedHub;
  while (waiting()) {
    await pause(5000);
    if (dlg.go.disabled) continue; // Connect is asking right now
    let at = null;
    try { at = await askHub(savedHub); } catch (e) {}
    if (!at || !waiting() || dlg.go.disabled) continue;
    hubInfo = at.info;
    relayed = at.relayed;
    dlg.close();
    await connected();
  }
})();

// ---- desktop window plumbing (same bridge as Notes) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  t.classList.toggle("scrolled-y", t.scrollTop >= 1);
  t.classList.toggle("at-y-end", t.scrollTop >= 1 && t.scrollTop >= t.scrollHeight - t.clientHeight - 1);
  t.classList.toggle("scrolled-x", t.scrollLeft >= 1);
  t.classList.toggle("at-x-end", t.scrollLeft >= 1 && t.scrollLeft >= t.scrollWidth - t.clientWidth - 1);
}, { capture: true, passive: true });
</script>
