<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub</title>
<style>
/* Platinum values match the exe desktop (same block as the Notes app) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --red: #cc3333; --green: #1f9e33;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
  --mono: "Berkeley Mono", "Monaco", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
/* iOS Safari inflates text after a rotate to landscape (its text-size
   "auto" heuristic) and keeps the inflated size on the way back; 100% pins
   the type to its authored size */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active, button.ghost.open { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost:disabled { color: #777; border-color: #888; background: var(--g300); box-shadow: none; }
button.ghost.danger { color: #7a1010; }
button.ghost.armed { background: var(--red); color: #fff;
  box-shadow: inset 1px 1px 0 #e88, inset -1px -1px 0 #911; }
button.ghost.sm { padding: 1px 8px; font-size: 10px; border-radius: 3px; height: auto; }
/* a dialog's default button — Return presses it — wears the ring: outset
   3px from the button (HIG Fig. 2-3), drawn as the desktop draws it */
button.ghost.default { outline: 2px solid var(--black); outline-offset: 1px; border-radius: 4px; }
/* Find… / Refresh / Profile… carry a 13px pixel glyph: a phone
   (body.mobile) shows only the glyph so the composer row keeps room for
   its status text, the desktop only the label — but for Find…, which
   wears both there (#find, below). The glyph is currentColor, so a pressed
   button inverts it with the label; the magnifier's white lens goes
   pressed-gray so it never reads as a hole. */
button.ghost.icon .gl { display: none; }
body.mobile button.ghost.icon { padding: 2px 8px; display: inline-flex; align-items: center; }
body.mobile button.ghost.icon span { display: none; }
body.mobile button.ghost.icon .gl { display: block; }
.gl { shape-rendering: crispEdges; }
.gl .k { fill: currentColor; }
.gl .w { fill: #fff; }
button.ghost:active .gl .w, button.ghost.open .gl .w { fill: #666; }
/* Find… wears its magnifier on the desktop too, left of the word with
   the 5px the thread head's Feed gives its arrow; a phone keeps the
   glyph alone (the id outranks the rule above, so its padding is said
   again) */
#find { display: inline-flex; align-items: center; gap: 5px; padding: 2px 12px 2px 9px; }
#find .gl { display: block; }
/* Draw… wears its glyph alone in a window too narrow for its word and
   the status text beside it (under 600px, the window's first size among
   them): the word would leave the text 23px there. A wider window gives
   the word back. */
@media (max-width: 587px) {
  #draw { padding: 2px 8px; display: inline-flex; align-items: center; }
  #draw span { display: none; }
  #draw .gl { display: block; }
}
body.mobile #find { padding: 2px 8px; }
/* the pencil's count is a button (#sugg): the pencil glyph and the
   figure, on every screen — "1 Suggestion" in words was the row's one
   long label, and it broke onto a second line once the window was
   narrow enough that the row had no slack. Laid out as Find… is (the
   glyph 9px in, 5px to the figure, the figure's 12px to the right); a
   phone closes it up as it does its other icon buttons. It stays pressed
   (.open, the pressed look) while its layer is up, as a pop-up's button
   does. The id outranks the icon rules above, so hidden is said again. */
#sugg { display: inline-flex; align-items: center; gap: 5px; padding: 2px 12px 2px 9px; }
#sugg .gl { display: block; }
body.mobile #sugg { gap: 4px; padding: 2px 8px; }
#sugg[hidden] { display: none; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) { .gl { shape-rendering: geometricPrecision; } }

input[type=text], textarea { font: inherit; color: var(--black); background: #fff;
  border: 1px solid var(--black); padding: 3px 5px; border-radius: 0;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff;
  user-select: text; cursor: text; }
input[type=text]:focus, textarea:focus { outline: none; }
textarea { resize: none; }

#wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; }

/* composer: a shallow document field + actions row */
#composer { display: flex; flex-direction: column; gap: 6px; }
#composer.hidden { display: none; }
/* the strip that names the reply the composer answers; hidden when the
   target is the thread head, the default */
#reply-to { display: none; align-items: center; gap: 8px; font-size: 11px; color: #777; }
#reply-to.on { display: flex; }
#reply-to .rt-q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#reply-to b { color: var(--black); }
#text { display: block; width: 100%; height: 56px; font: 12px/1.5 var(--font); }
/* the pencil's marks in the field: a mirror of the text laid over the
   textarea — same type, padding and wrapping, sized to the textarea's
   client box (so a scrollbar coming or going rewraps both alike) and
   scrolled with it — its words transparent, so all it shows is the rule
   under each stretch the pencil would change. It takes no pointer: the
   textarea under it stays the field, and a click is matched to a rule by
   where it fell. The rule is a border on the inline box, which sits in
   the line's own leading and moves nothing. */
#field { position: relative; }
#marks { position: absolute; left: 1px; top: 1px; width: 0; height: 0; overflow: hidden;
  padding: 3px 5px; font: 12px/1.5 var(--font); white-space: pre-wrap; overflow-wrap: break-word;
  color: transparent; pointer-events: none; }
#marks u { text-decoration: none; border-bottom: 2px solid var(--hl); }
#c-row { display: flex; gap: 6px; align-items: center; }
#c-status { flex: 1; font-size: 11px; color: #777;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#c-status.err { color: var(--red); }
/* Proofread: the pencil has read everything there is and nothing is left
   to decide. A green check — the Platinum check box's mark (Blue Pencil's
   options), in Blue Pencil's green — and the word in a green dark enough
   to read at 11px, where a grey "No suggestions" stood and read as a
   shrug. The check sits on the text's baseline and inside its line, so
   the row is no taller for it. */
#c-status.ok { color: #0f6b20; }
#c-status .tick { display: inline-block; vertical-align: -1px; margin-right: 4px; }
#c-status .tick path { fill: var(--green); }
#chips { display: flex; gap: 6px; flex-wrap: wrap; }
#chips:empty { display: none; }
.chip { display: flex; align-items: center; gap: 5px; background: #fff;
  border: 1px solid var(--black); padding: 1px 3px 1px 6px; font-size: 10px; max-width: 160px; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip img { width: 16px; height: 16px; object-fit: cover; border: 1px solid var(--g500); }
/* a file on its way through the hub's converter: the Platinum progress
   bar (the Mac OS 9 app's), small, beside its name */
.chip progress { appearance: none; flex: none; width: 48px; height: 10px; margin: 0; border: 1px solid var(--black); background: var(--g400); }
.chip progress::-webkit-progress-bar { background: var(--g400); box-shadow: inset 1px 1px 0 var(--g600); }
.chip progress::-webkit-progress-value { background: var(--hl); border-right: 1px solid var(--black); }
.chip progress::-moz-progress-bar { background: var(--hl); }
/* a picture's chip under the pointer: the picture at a size to see it by
   (peekShow), in a layer hung 2px under the chip in the contextual menu's
   dress, with its whole name under it, which the chip may cut. It takes
   no pointer, so leaving the chip is all it takes to close it. */
#peek { min-width: 0; padding: 5px; pointer-events: none; }
#peek img { display: block; border: 1px solid var(--black); background: #fff; box-sizing: content-box; }
#peek div { margin-top: 4px; font-size: 10px; line-height: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* the feed: a sunken white list, same chrome as a Finder list view */
#feed { flex: 1; background: #fff; border: 1px solid var(--black);
  overflow-y: scroll; overflow-x: hidden;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
.post { padding: 7px 10px 8px; border-bottom: 1px solid #efefef; }
.post.focus { background: #f4f4ff; }
.p-head { display: flex; align-items: baseline; gap: 6px; }
.p-ava { width: 14px; height: 14px; flex: none; align-self: center;
  border: 1px solid var(--black); image-rendering: pixelated; }
img.p-ava { image-rendering: auto; object-fit: cover; background: #fff; }
.ava-row { display: flex; align-items: center; gap: 8px; }
.ava-big { width: 32px; height: 32px; border: 1px solid var(--black); background: #fff;
  image-rendering: auto; object-fit: cover; }
canvas.ava-big { image-rendering: pixelated; }
.p-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-id { font: 10px var(--mono); color: #999; }
.p-time { font-size: 10px; color: #777; margin-left: auto; flex: none; }
/* the body hangs from the author name's left edge: the 14px avatar plus
   the head's 6px gap, so a post's text, card, pictures and foot all start
   on the same vertical line as the name (22px sat 2px right of it) */
.p-text { margin: 3px 0 0 20px; white-space: pre-wrap; overflow-wrap: break-word;
  user-select: text; cursor: text; }
.p-text a { color: var(--hl); }
/* a mention: the person's name as it is today, in the links' ink; a
   name, not an address, so no underline */
.p-mention { color: var(--hl); }
/* a found word in Find's results: highlighter yellow behind the type,
   which keeps its own colour (a link stays blue), weight and width — a
   background moves nothing, so a marked post sets as it does in the feed */
.p-text mark { background: #ffff66; color: inherit; }
/* `inline code` in a post: Monaco on a slightly darker Platinum field */
.p-text code { font: 11px/1 var(--mono); background: #e4e4e4; border: 1px solid #ccc;
  border-radius: 2px; padding: 0 3px; }
/* a heading line (#, ##, ###) in a post: bold Charcoal a step or two up,
   spaced by margins of its own — formatText absorbs a blank line beside
   it — with air above and a little below; .first opens the post, so no
   room above it. The hub's public pages carry the same numbers. */
.p-text h1, .p-text h2, .p-text h3 { font-weight: bold; line-height: 1.25; }
.p-text h1 { font-size: 16px; margin: 16px 0 6px; }
.p-text h2 { font-size: 14px; margin: 14px 0 3px; }
.p-text h3 { font-size: 12px; margin: 12px 0 2px; }
.p-text .first { margin-top: 0; }
/* a table (Markdown's pipe table, formatText): a white box with one
   black line round it, as wide as the table and never wider
   than the post — past that it scrolls sideways under a Platinum bar,
   since the feed itself never scrolls that way. Every inner line is one
   border on one cell — right and bottom, none on the last column or
   the last row, whose line is the box's (or the scroll bar's top line).
   Cells break at words only; a right-aligned column is figures, and
   under its head they stay on one line. .first opens the post and
   .last ends it: no room on that side. The hub's public pages carry
   the same numbers. */
.p-tbl { margin: 8px 0; width: fit-content; max-width: 100%; box-sizing: border-box;
  overflow-x: auto; overflow-y: hidden; border: 1px solid var(--black); background: #fff;
  white-space: normal; overscroll-behavior-x: contain; }
.p-tbl.last { margin-bottom: 2px; }
.p-tbl table { border-collapse: separate; border-spacing: 0; overflow-wrap: normal; word-break: normal; }
.p-tbl th, .p-tbl td { padding: 3px 8px; text-align: left; vertical-align: top; font-size: 12px; line-height: 1.4;
  border-right: 1px solid var(--g300); border-bottom: 1px solid var(--g200); }
.p-tbl th { font-weight: bold; vertical-align: bottom; background: var(--g200); border-bottom-color: var(--g600); }
.p-tbl tr > :last-child { border-right: 0; }
.p-tbl tbody tr:last-child td, .p-tbl thead:last-child th { border-bottom: 0; }
.p-tbl .l { text-align: left; }
.p-tbl .c { text-align: center; }
.p-tbl .r { text-align: right; }
.p-tbl td.r { white-space: nowrap; }
/* a fenced code block (```, formatText/fenceAt): a .p-code row — the
   code as typed, spaces and blank lines and all, in the code span's
   Monaco, inside a white box with one black line round it like a
   table's, as wide as its longest line and never wider than the room,
   past that scrolling sideways under the Platinum bar, since a code
   line is not for wrapping — and the Copy button 6px right of the box
   (the HIG's gap inside a group): a push button, 20px by 31px, wearing
   a 13px pixel glyph (COPY_GLYPHS) 8px either side — a box on another,
   the sheets of a copy — that is a check mark for the moment after a
   press (copyCode). A one-line block (.one) is built as the button is,
   1px line, 2px in, a 14px line, so box and button stand 20px tall
   together, top on top; a taller block keeps 4px in and 15px lines,
   the button 2px under its top. The words Copy and Copied are in the
   button for a screen reader alone, the one that holds hidden. 8px
   above and below the row, none on the side that opens (.first) or
   ends (.last) the post. The hub's public pages carry the same
   numbers. */
.p-text .p-code { display: flex; align-items: flex-start; gap: 6px; margin: 8px 0; white-space: normal; }
.p-text .p-code.last { margin-bottom: 2px; }
.p-text pre { margin: 0; padding: 4px 6px; min-width: 0; box-sizing: border-box;
  overflow-x: auto; overflow-y: hidden; border: 1px solid var(--black); background: #fff; tab-size: 4;
  font: 11px/15px var(--mono); white-space: pre; overflow-wrap: normal; word-break: normal; overscroll-behavior-x: contain; }
.p-text .p-code.one pre { padding-top: 2px; padding-bottom: 2px; line-height: 14px; }
.p-code .copy { flex: none; margin: 2px 0 0; padding: 2px 8px; display: inline-flex; align-items: center; position: relative;
  white-space: nowrap; user-select: none; cursor: default; }
.p-code.one .copy { margin-top: 0; }
.p-code .copy span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.p-code .copy:not(.done) span:last-of-type, .p-code .copy.done span:first-of-type { visibility: hidden; }
.p-code .copy .gl { display: none; }
.p-code .copy:not(.done) .gl.box, .p-code .copy.done .gl.ok { display: block; }
/* a list (formatText/listAt: "- " or "* " items, or numbered ones): a
   block like a table — 8px above and below, none on the side that opens
   (.first) or ends (.last) the post — its items hung: the marker stands
   in the room left of the words, right-aligned 5px from them, and a
   wrapped line comes back under the words, not under the marker. The
   markers are drawn here, a bullet or a counter begun at --n (one under
   the list's first number), so they sit to the pixel the same in every
   browser; w2 and w3 make room for two and three digits. The hub's
   public pages carry the same numbers. */
.p-text ul, .p-text ol { margin: 8px 0; padding: 0; list-style: none; }
.p-text ul.last, .p-text ol.last { margin-bottom: 0; }
.p-text ol { counter-reset: item var(--n, 0); }
.p-text li { position: relative; margin: 0; padding-left: 14px; }
.p-text li + li { margin-top: 2px; }
.p-text ol > li { padding-left: 18px; counter-increment: item; }
.p-text ol.w2 > li { padding-left: 25px; }
.p-text ol.w3 > li { padding-left: 32px; }
.p-text li::before { box-sizing: border-box; position: absolute; left: 0; top: 0; width: 9px; text-align: right; content: "\2022"; }
.p-text ol > li::before { width: 13px; content: counter(item) "."; }
.p-text ol.w2 > li::before { width: 20px; }
.p-text ol.w3 > li::before { width: 27px; }
/* a to-do item ("- [ ] words" or "- [x] words": li.box, .done when
   ticked): the box stands where the bullet would, and is the Chat plan's
   box from the desktop (.plan-box), copied — a 12px square, black
   border, white, a one-pixel shadow, the tick inside once done — 5px off
   the words as the bullet is; the done words are struck through in
   grey. The box is out of the line's flow, so the strike never crosses
   it. The hub's public pages carry the same block. */
.p-text li.box { padding-left: 19px; }
.p-text li.box::before { top: 1px; width: 12px; height: 12px; border: 1px solid #000; background: #fff; box-shadow: 1px 1px 0 #999;
  font-size: 11px; line-height: 10px; text-align: center; color: #000; content: ""; }
.p-text li.box.done { color: #777; text-decoration: line-through; }
.p-text li.box.done::before { content: "\2713"; }
/* one's own box, clicked: pressed — the face grey as a Platinum check box
   under the mouse — until the hub answers (markBox) */
.p-text li.box.pending::before { background: #999; }
/* flex-start, not the default stretch: a stretched flex line would pull every
   picture in it to the tallest sibling's height and distort its shape */
.p-embeds { margin: 6px 0 0 20px; display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
.p-embeds img { max-width: 180px; max-height: 140px; border: 1px solid var(--black);
  background: var(--g300); cursor: pointer; }
/* a drawing (Draw…): the pad's own pixels, never the thumbnail's 180 by
   140. Its embed declares the pad's size, so the box stands before the
   picture loads, and drawFit gives it a whole number of device pixels to
   a pad pixel (two at 150 percent). The box is content-box, so the
   border is not taken out of the picture. */
.p-embeds img.p-draw { box-sizing: content-box; max-width: none; max-height: none;
  image-rendering: pixelated; background: #fff; }
/* and under it, at its left edge, the small button that draws it again
   (drawReplay): there with the post, so nothing moves when the picture
   comes */
.p-embeds .p-drawing { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.p-file { font-size: 11px; border: 1px solid var(--black); background: var(--g200); padding: 2px 8px; }
/* a video: a box of its final size from the embed's facts, set before the
   file loads (mediaBox), black behind the frame, with the poster and
   native controls; a converted GIF plays muted on a loop without them */
.p-vid { max-width: 100%; border: 1px solid var(--black); background: #000; }
.p-vid video { display: block; width: 100%; height: 100%; object-fit: contain; }
/* a sound: its waveform over the player, and a foot with its name and
   length, a card like the link card */
.p-aud { width: 322px; max-width: 100%; border: 1px solid var(--black); background: #fff; box-shadow: 1px 1px 0 var(--black); }
.p-aud .wave { display: block; width: 100%; height: 33px; object-fit: fill; border: 0; border-bottom: 1px solid var(--black);
  background: var(--g200); cursor: default; max-width: none; max-height: none; }
.p-aud audio { display: block; width: 100%; height: 32px; }
.p-aud .a-f { display: block; padding: 2px 7px; line-height: 13px; background: var(--g200); font-size: 10px; color: #777;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* a page: an admin's HTML embed (the hub lists it in the post's `pages`),
   drawn as the public pages draw it, a white card with a page glyph, and
   opened in a desktop page window; its download link sits beside it */
.p-pagerow { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
.p-page { position: relative; display: block; min-width: 0; padding: 2px 8px 2px 24px;
  border: 1px solid var(--black); background: #fff; box-shadow: 1px 1px 0 var(--black);
  color: var(--black); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.p-page::before { content: ""; position: absolute; left: 7px; top: 3px; width: 10px; height: 12px; box-sizing: border-box;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="12" shape-rendering="crispEdges"><path fill="%23fff" d="M1 1h8v10h-8z"/><path fill="black" d="M0 0h10v1h-10z M0 11h10v1h-10z M0 1h1v10h-1z M9 1h1v10h-1z M1 3h8v1h-8z M1 6h8v1h-8z M1 9h8v1h-8z"/></svg>') no-repeat; }
.p-pagedl { flex: none; font-size: 10px; color: var(--hl); cursor: default; }
.p-foot { margin: 5px 0 0 20px; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.p-replies { font-size: 10px; color: var(--hl); white-space: nowrap; }
/* the thread's newest reply, one quiet ellipsized line on the foot */
.p-latest { font-size: 10px; color: #777; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-latest b { color: var(--black); }
.p-del { margin-left: auto; }
/* a nested reply in a thread: stepped in under the reply it answers,
   a thin rule marking the fold — the public pages' numbers, scaled down */
/* a reply steps in per level until the indent would eat two fifths of
   the window; past that the levels flatten, so a phone keeps its text */
.post.deep { padding-left: min(calc(10px + (var(--d, 2) - 1) * 18px), 40%); border-left: 1px solid #ddd; }
/* a link card: the post's first link, unfurled by the hub at ingest */
.p-card { margin: 6px 0 0 20px; max-width: 400px; border: 1px solid var(--black); background: #fff;
  box-shadow: 1px 1px 0 var(--black); }
.p-card .c-m { display: flex; text-decoration: none; color: var(--black); }
.p-card .c-i { flex: none; width: 48px; border-right: 1px solid var(--black); }
.p-card .c-i img { width: 100%; height: 100%; object-fit: cover; display: block; }
.p-card .c-b { min-width: 0; padding: 4px 8px; display: flex; flex-direction: column; justify-content: center; }
.p-card .c-t { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-card .c-d, .p-card .c-h { font-size: 10px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* a post card: the first link is a post this hub holds, quoted in the
   link card's box — the row head's face, name, id and time where the
   title stood, up to three lines of its words under it, its picture at
   the left when it shows one; the card opens that thread in the app */
.p-quote .c-b { padding: 4px 8px 5px; }
.p-quote .q-h { display: flex; align-items: center; gap: 6px; min-width: 0; height: 17px; line-height: 17px; }
.p-quote .q-h b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-quote .q-h .p-id { flex: none; }
.p-quote .q-t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  margin-top: 2px; line-height: 17px; overflow-wrap: anywhere; }
/* the card's page kept in the Internet Archive: the card's foot, a quieter
   grey with no rule above it */
.p-card .c-a { display: block; padding: 4px 8px 2px; background: var(--g200); font-size: 10px; color: var(--hl);
  text-decoration: none; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.muted { color: #777; padding: 10px; }
/* loading placeholders mirror the loaded rows so nothing shifts when data lands */
.ph { padding: 7px 10px 8px; border-bottom: 1px solid #efefef; }
.ph .bar { height: 10px; background: var(--g200); margin: 3px 0; }
.ph .bar.w40 { width: 40%; } .ph .bar.w80 { width: 80%; }

#thread-head { display: none; align-items: center; gap: 8px; }
/* the back button's arrow is a pixel glyph, not a text triangle: U+25C0
   comes out as a blue emoji on an iPhone. currentColor, so it inverts
   with the label when pressed. */
#back { display: inline-flex; align-items: center; gap: 5px; padding: 2px 12px 2px 9px; }
#back .gl { display: block; }
#thread-head.on { display: flex; }
/* the title gives way before the buttons do: a long name ellipsizes */
#thread-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Summary, at the head row's right end, only while the open thread has
   one (Livid, 2026-09-24: "use the right blank space in the return to
   Feed row"): the sparkles glyph on the desktop too, laid out as Find…
   is, a phone the glyph alone. The glyph is the one coloured one —
   yellow stars with black points — so a pressed button inverts the
   points alone. It stays pressed (.open) while the summary is up. */
#summary { display: inline-flex; align-items: center; gap: 5px; padding: 2px 12px 2px 9px; margin-left: auto; }
#summary .gl { display: block; }
#summary[hidden] { display: none; }
body.mobile #summary { padding: 2px 8px; }
.gl .y { fill: #ffcc00; }
/* the summary itself, above the thread's head while the button is
   pressed: laid out as a post is — the sparkles in the avatar's place,
   Summary where the name goes, what it read and who wrote it in the
   id's grey, the time at the right — so the column's lines all hold;
   the words hang at the text's 20px. A cite is the reply's number in
   the hub page's grey: a click lands on that reply. */
.summary { padding: 7px 10px 8px; border-bottom: 1px solid #efefef; }
.summary .s-gl { flex: none; align-self: center; margin-right: -1px; }
.summary .s-meta { font-size: 10px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary .cite { color: #666; text-decoration: none; font-size: 11px; }

/* onboarding / profile dialog: a Platinum panel over everything */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.12); display: none;
  align-items: center; justify-content: center; }
#veil.on { display: flex; }
#dlg { width: 330px; background: var(--g300); border: 1px solid var(--black); padding: 14px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #999, 2px 2px 0 rgba(0,0,0,.25); }
#dlg h2 { font-size: 12px; margin: 0 0 10px; }
#dlg .row { margin: 0 0 8px; display: flex; flex-direction: column; gap: 3px; }
#dlg label { font-size: 11px; }
#dlg .btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 12px; }
#dlg .btns .left { margin-right: auto; } /* secondary action, lower left (HIG) */
#dlg .err { color: var(--red); font-size: 11px; min-height: 14px; margin-top: 6px; }
/* Draw…: the panel on the veil. It opens on the two choices a drawing is
   made of, the pad and the palette (a white list, the chosen row
   inverted like a Finder row), then shows the pad: MacPaint's white
   strip of cells at the left (Paint's, two cells wide), the pad in a
   sunken frame, Cancel and Send under it. The pad is bitmap art: its
   canvas is sized to a whole number of device pixels a pad pixel
   (drawScale). Radios are the desktop's. */
#dlg.draw { width: auto; }
#dlg.draw.setup { width: 330px; }
#dlg input[type=radio] { background: none; border: 0; padding: 0; box-shadow: none; accent-color: #333; margin: 0 5px 0 0; vertical-align: -2px; }
#dlg input[type=radio]:focus { outline: none; }
#dlg input[type=radio]:focus-visible { outline: 2px solid #9999fe; }
#dlg .dp-sizes { display: flex; gap: 16px; align-items: center; height: 20px; }
#dlg .dp-sizes label { font-size: 12px; }
#dlg .dp-list { background: #fff; border: 1px solid var(--black);
  box-shadow: -1px -1px 0 var(--g600), 1px 1px 0 #fff; }
.dp-pal { display: flex; align-items: center; gap: 8px; height: 18px; padding: 0 6px; }
.dp-pal .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-pal .sw { display: flex; gap: 1px; flex: none; }
.dp-pal .sw i { display: block; width: 10px; height: 10px; border: 1px solid #000; }
.dp-pal.on { background: var(--hl); color: #fff; }
.dp-work { display: flex; gap: 12px; align-items: flex-start; }
.dp-side { width: 50px; flex: none; align-self: stretch; background: #fff; border: 1px solid var(--black);
  display: flex; flex-direction: column; }
.dp-tools { display: grid; grid-template-columns: 24px 24px; }
.dp-cell { width: 24px; height: 22px; padding: 0; border: 0; border-radius: 0;
  border-right: 1px solid var(--black); border-bottom: 1px solid var(--black);
  display: flex; align-items: center; justify-content: center; background: #fff; color: var(--black);
  font: bold 11px/14px var(--font); }
.dp-cell:nth-child(2n) { border-right: 0; }
.dp-cell.wide { grid-column: span 2; width: 48px; border-right: 0; }
.dp-cell svg { display: block; fill: currentColor; shape-rendering: crispEdges; }
.dp-cell .ln { display: block; width: 12px; background: currentColor; }
.dp-cell.on, .dp-cell.wide:active { background: var(--black); color: #fff; }
.dp-cell:disabled { color: #999; background: #fff; }
.dp-sw { display: grid; grid-template-columns: repeat(4, 12px); }
.dp-sw button { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 0;
  border-right: 1px solid var(--black); border-bottom: 1px solid var(--black); }
.dp-sw button:nth-child(4n) { border-right: 0; }
/* the ink in hand: a black ring inside the swatch, white inside that, so
   it reads on a dark colour and on a light one */
.dp-sw button.on { box-shadow: inset 0 0 0 2px #000, inset 0 0 0 3px #fff; }
.dp-side .fill { flex: 1; min-height: 6px; background: #fff; }
.dp-pad { flex: none; border: 1px solid var(--black); background: #fff;
  box-shadow: -1px -1px 0 var(--g600), 1px 1px 0 #fff; }
.dp-pad canvas { display: block; position: relative; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
#dlg.draw .btns { align-items: center; }
#dlg.draw .btns .left { font-size: 11px; color: #555; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* a phone gives the pad every pixel it can: narrower gutters */
body.mobile #dlg.draw:not(.setup) { padding: 8px; }
body.mobile #dlg.draw .dp-work { gap: 6px; }
body.mobile #dlg.draw.setup { width: min(330px, calc(100vw - 16px)); }
/* an alert on the veil: the desktop's movable alert box (HIG OS 8 fig.
   3-4) for an action that failed with words worth reading whole — a hub's
   refusal, its ffmpeg's complaint — which the 15px status line can only
   cut short. The window, title-bar stripe and alert-bar blocks are the
   desktop's own (index.html, ui/offline.html), copied verbatim: change
   them in all three. It holds only the caution icon, a bold label, the
   plain narrative and OK; the narrative is selectable, so the message can
   be copied entire. While it is up the dialog panel steps aside. */
#veil.alert #dlg { display: none; }
#veil:not(.alert) #alert { display: none; }
.window {
  position: relative; z-index: 10; min-width: 220px; width: 100%; max-width: 380px;
  background: var(--g400); border: 1px solid var(--black);
  box-shadow: 2px 2px 0 var(--black);
}
.window::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4; box-sizing: border-box;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), inset -1px -1px 0 var(--g600), inset 1px 1px 0 #fff; }
.titlebar { display: flex; align-items: center; gap: 4px; padding: 2px 4px;
  background: var(--g400); user-select: none; }
.titlebar .stripe { flex: 1; height: 12px; min-width: 8px; position: relative;
  background-color: var(--g300);
  background-image: linear-gradient(#fff, #fff 50%, #777 50%, #777);
  background-size: 100% 2px; background-repeat: repeat; }
.titlebar .stripe::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 1px; box-sizing: border-box;
  background-image: linear-gradient(#fff, #fff 50%, #ccc 50%, #ccc);
  background-size: 100% 2px; background-repeat: repeat; border-bottom: 1px solid #ccc; }
.titlebar .stripe::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 1px; box-sizing: border-box;
  background-image: linear-gradient(#ccc, #ccc 50%, #777 50%, #777);
  background-size: 100% 2px; background-repeat: repeat; }
/* Movable alert box title bar (HIG OS 8 fig. 3-4): nothing but red
   stripes — no title, no boxes. */
.titlebar.alert-bar { background: #fcc; }
.titlebar.alert-bar .stripe { background-color: #fcc;
  background-image: linear-gradient(#fff, #fff 50%, #f66 50%, #f66); }
.titlebar.alert-bar .stripe::before {
  background-image: linear-gradient(#fff, #fff 50%, #f99 50%, #f99);
  border-bottom-color: #f99; }
.titlebar.alert-bar .stripe::after {
  background-image: linear-gradient(#f99, #f99 50%, #f66 50%, #f66); }
.win-body { padding: 14px 14px 12px; }
/* the alert's own layout, the desktop's confirm box's numbers: icon and
   text 20px apart, 24px over the button row; a phone keeps 16px gutters */
#alert { width: min(380px, calc(100vw - 32px)); }
#alert .a-row { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
#alert .a-row svg { flex: none; }
#alert .a-text { flex: 1; min-width: 0; user-select: text; cursor: text; }
#a-msg { font-weight: bold; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
#a-detail { font-size: 11px; line-height: 1.45; margin-top: 7px; overflow-wrap: anywhere; white-space: pre-wrap; }
#a-detail[hidden] { display: none; }
#alert .btns { display: flex; gap: 12px; justify-content: flex-end; margin: 0 0 2px; }
/* OK and Cancel are 58px wide (HIG); a longer word keeps its own width */
#dlg .btns button, #alert .btns button { min-width: 58px; }
/* hub-info rows: right-aligned labels, selectable values */
.irow { display: flex; gap: 8px; margin: 0 0 6px; align-items: baseline; }
.ilab { width: 70px; flex: none; font-size: 11px; color: #555; text-align: right; }
.ival { flex: 1; min-width: 0; user-select: text; cursor: text; overflow-wrap: break-word; }
.ival.mono { font: 10px/1.5 var(--mono); }
.ival.copy { color: var(--hl); cursor: pointer; text-decoration: underline; }
.ival.copy:active { color: #000; }
/* the profile's own key, under its fields: the id and the Solana address,
   each a line of the mono under its label, as wide as its words so the
   click that copies it is a click on it */
#dlg .row .ival { flex: none; align-self: flex-start; max-width: 100%; }
#dlg .note { font-size: 11px; color: #555; }
/* the Solana address ends in a button that shows it as a QR code: the
   address and the button share one 20px line, the button at the row's
   right edge, where the fields' edges are. 25px wide leaves the 13px
   glyph 5px on either side. */
#dlg .row .kv { display: flex; align-items: center; gap: 8px; }
#dlg .row .kv .ival { flex: 0 1 auto; min-width: 0; align-self: center; line-height: 20px; }
button.ghost.qrb { flex: none; margin-left: auto; width: 25px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center; }
button.ghost.qrb .gl { display: block; }
/* the QR panel: the code on white in the sunken field's frame, 4px a
   module with the standard's four modules of quiet around it, and the
   address in words under it */
#dlg .qrbox { width: 166px; margin: 2px auto 10px; background: #fff; border: 1px solid var(--black);
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
#dlg .qrbox svg { display: block; shape-rendering: crispEdges; }
#dlg .qrtext { text-align: center; }
#dlg .qrtext .ival { display: inline-block; max-width: 100%; }

/* Join a Hub: the wizard a new user joins a hub by. It takes the app's
   whole face over the status bar (the feed under it keeps its place,
   hidden, for whoever cancels): a head with the app's icon, the four
   steps listed down the left beside the step's own page, and a button row
   of its own under a separator — Cancel at the left, Go Back and the
   ringed Continue at the right, as the Installer had them. Every part is
   there from the first paint and a page only fills it: Go Back goes grey
   on the first step, a line that will say something keeps its room. The
   veil's panels (the QR code, an alert) come after it in the page and
   draw over it. */
body { position: relative; }
body.joining #wrap { visibility: hidden; }
#join { position: absolute; left: 0; right: 0; top: 0; bottom: 15px; display: flex; flex-direction: column;
  background: var(--g200); line-height: 16px; }
#join[hidden] { display: none; }
/* separators are a 1px #999 line over a 1px white one */
.j-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--g600); }
.j-head svg { flex: none; display: block; }
.j-head h1 { margin: 0; font-size: 12px; line-height: 16px; }
.j-head p { margin: 0; color: #555; }
.j-head .narrow { display: none; }
.j-mid { flex: 1; min-height: 0; display: flex; box-shadow: inset 0 1px 0 #fff; }
/* the steps: a done one wears the pass mark's green check, the one in
   hand OS 9's dot and bold type, the ones to come grey. They are read,
   never pressed. */
#j-steps { flex: none; width: 132px; margin: 0; padding: 11px 8px 0 14px; list-style: none;
  border-right: 1px solid var(--g600); }
#j-steps li { display: flex; align-items: center; gap: 6px; height: 20px; color: #777; white-space: nowrap; }
#j-steps li.now { color: var(--black); font-weight: bold; }
#j-steps li.done { color: var(--black); }
#j-steps .m { flex: none; width: 10px; height: 10px; display: flex; align-items: center; justify-content: center; }
#j-steps .m svg { display: none; }
#j-steps li.done .m .tick { display: block; fill: var(--green); }
/* the dot is stepped pixels at whole scales and a circle between them,
   where a stepped one comes out a blunt square */
#j-steps .m .dot { fill: var(--black); }
#j-steps li.now .m .dot.crisp { display: block; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) {
  #j-steps li.now .m .dot.crisp { display: none; }
  #j-steps li.now .m .dot.fine { display: block; }
}
#j-page { flex: 1; min-width: 0; overflow-y: auto; padding: 12px 14px 4px; box-shadow: inset 1px 0 0 #fff; }
#j-page > * { max-width: 420px; }
#j-page h2 { margin: 0 0 6px; font-size: 12px; line-height: 16px; }
#j-page p { margin: 0 0 10px; }
#j-page a { color: var(--hl); }
#j-page .row { margin: 0 0 8px; display: flex; flex-direction: column; gap: 3px; }
#j-page label { font-size: 11px; }
#j-page .row .ival { flex: none; align-self: flex-start; max-width: 100%; }
#j-page .row .kv { display: flex; align-items: center; gap: 8px; }
#j-page .row .kv .ival { flex: 0 1 auto; min-width: 0; align-self: center; line-height: 20px; }
#j-page input:disabled { background: var(--g200); color: #777; }
/* the line under a page's fields says what the wizard is doing and what
   came of it; it keeps two lines, so the page is as tall with it empty */
.j-note { min-height: 32px; margin: 0 0 10px; font-size: 11px; color: #555; }
.j-note.err { color: #7a1010; }
/* a group under a page's own matter: a second thought, set off by 16px */
.j-group { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--g600); box-shadow: inset 0 1px 0 #fff; }
/* how this key stands with the hub: the words, selectable (a mint is to
   be copied), under the green check when it may post. Asked again, the
   box keeps the height it had (joinVerdict's keep), so Check Again stays
   under the pointer that pressed it. */
#j-verdict { margin: 0 0 10px; user-select: text; cursor: text; }
#j-verdict div { margin-top: 10px; }
#j-verdict.ok { color: #0f6b20; }
#j-verdict.warn { color: #7a1010; }
#j-verdict .tick { display: inline-block; vertical-align: -1px; margin-right: 4px; fill: var(--green); }
#j-verdict ul { margin: 2px 0; padding: 0 0 0 16px; }
#j-verdict .ival { cursor: pointer; }
/* a button of the page's own gets a row. Where the row also says what
   the button did (.said), it keeps the two lines those words may take
   from the first paint, so nothing under it moves when they come. */
.j-btn { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; }
.j-btn.said { min-height: 32px; }
.j-btn button { flex: none; white-space: nowrap; }
.j-btn span { font-size: 11px; color: #555; min-width: 0; }
.j-foot { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px;
  border-top: 1px solid var(--g600); box-shadow: inset 0 1px 0 #fff; }
.j-foot .gap { flex: 1; min-width: 0; }
.j-foot button { min-width: 58px; }
/* a narrow window, and a phone: the list gives its room to the page, and
   the head counts the steps instead */
@media (max-width: 459px) {
  #j-steps { display: none; }
  #j-page { box-shadow: none; }
  .j-head .wide { display: none; }
  .j-head .narrow { display: inline; }
  .j-foot { flex-wrap: wrap; row-gap: 10px; }
}

/* a contextual menu, the desktop's Finder one (index.html .dropdown and
   #ctx-menu) in the app — Blue Pencil's block: #ddd face, 1px black
   outline, white and #bbb inset bevel, the hard 2px shadow; rows 3px 22px
   3px 18px on 18px lines, inverted under the pointer, grey when disabled;
   a groove for a separator. Whole-pixel rows keep each separator on the
   same device-pixel phase. */
.dropdown { position: fixed; z-index: 30; min-width: 170px; background: var(--g300);
  border: 1px solid var(--black); padding: 2px 1px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--g500), 2px 2px 0 rgba(38,38,38,.85); }
.dd-item { padding: 3px 22px 3px 18px; line-height: 18px; white-space: nowrap; }
.dd-item:hover { background: var(--hl); color: #fff; }
.dd-item.dis { color: #888; }
.dd-item.dis:hover { background: none; color: #888; }
.dd-sep { height: 2px; margin: 3px 2px; border-top: 1px solid var(--g600); border-bottom: 1px solid #fff; }
/* the "@" list: the people a mention may name, in the contextual menu's
   dress, hung 2px under the "@" being typed. A layer of its own, so the
   pencil's menu and it never share a box. Each row is a post's head in
   small: the 14px picture, the name, the id in the mono grey. One row is
   inverted at a time, the arrows' or the pointer's (.on, not :hover, so
   there are never two). */
#at { z-index: 31; min-width: 0; max-width: calc(100vw - 8px); overflow: hidden; }
.at-item { display: flex; align-items: center; gap: 6px; padding: 3px 12px 3px 6px; line-height: 18px; white-space: nowrap; }
.at-item .nm { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.at-item .id { flex: none; font: 10px/18px var(--mono); color: var(--g800); }
.at-item.on { background: var(--hl); color: #fff; }
.at-item.on .id { color: #fff; }
/* the menu under a marked word opens with the correction itself, in the
   pencil's marks as Blue Pencil draws them: what it struck out, struck
   out; what it wrote on a pale-blue field with a blue rule underneath. A
   line of the menu, not a choice in it: it never inverts, and a long one
   wraps inside the menu's widest. */
.dd-head { padding: 3px 22px 3px 18px; line-height: 18px; max-width: 280px;
  white-space: pre-wrap; overflow-wrap: break-word; }
.dd-head ins { text-decoration: none; background: #ccccff; box-shadow: inset 0 -1px 0 var(--hl);
  padding: 0 1px; } /* a comma alone still shows its field */
.dd-head del { color: #b3413c; text-decoration: line-through; }
.dd-head del + ins { margin-left: 4px; }
/* the same line holding a whole rewritten sentence: wider, never wider
   than a phone, and set 10px left of the rows, so a sentence's choices
   hang under it and it never reads as one of them */
.dd-head.wide { max-width: min(360px, calc(100vw - 16px)); padding: 4px 12px 2px 8px; }
/* a layer of sentences is pinned where it opens (under the field, under
   its button) rather than slid up over the text it is compared with; past
   the window's foot it scrolls inside itself */
.dropdown.pin { overflow-y: auto; }

/* toast — the desktop's #status-bar pattern */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #ffffc9; color: #000; border: 1px solid var(--black); padding: 5px 14px;
  font-size: 12px; box-shadow: inset 1px 1px 0 #fff, 2px 2px 0 var(--black);
  opacity: 0; transition: opacity .15s; pointer-events: none; max-width: 90vw; z-index: 20; }
#toast.show { opacity: 1; }

/* overflow: clip — the 11px text's line box is taller than the 14px face and
   hangs a pixel past the bar; clipped, that pixel is no scrollable overflow of
   the page (docs/platinum.md, status bar) */
#status { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px 0 8px; height: 15px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; overflow: clip; }
#st-hub { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px;
  touch-action: none; z-index: 6; }
/* a phone's window fills the screen: no grow tile, so the status line
   keeps its plain 8px edge instead of the room left for the tile */
body.mobile #grow { display: none; }
body.mobile #status { padding-right: 8px; }

/* Mac OS 9 scrollbars — the desktop's pixel-sampled spec (same as Notes) */
::-webkit-scrollbar { width: 15px; height: 15px; }
::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black);

// Reads go straight to the hub while this browser has a road to it. When
// it has none — the desktop opened by its IP in a browser that cannot
// resolve the hub's ts.net name, a proxy in the way, a plain-HTTP hub
// under the HTTPS desktop — they ride the daemon's relay, as the writes
// always have. hurl() is the one place that knows; what leaves the app
// (the hub's public pages, its address in Hub Info) keeps the hub's own.
let relayed = false;
const hurl = (path, base = hub, via = relayed) => !via ? base + path

  if (!r.ok) throw new Error("hub HTTP " + r.status);
  return r.json();

// Who is at this address? Asked both ways at once. The straight answer
// wins when it comes — it gets a moment's grace — and the relay's stands
// in when the browser's own road fails or hangs.
async function askHub(base, ms = 8000) {
  const ask = async via => {
    const r = await fetch(hurl("/v1/hub", base, via), { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const info = await r.json();
    if (!info.id) throw new Error("not an exe-hub");
    return { info, relayed: via };
  };
  const direct = ask(false), relay = ask(true);
  direct.catch(() => {}); relay.catch(() => {});
  const grace = new Promise((_, no) => setTimeout(no, 2500));
  try { return await Promise.race([direct, grace]); } catch (e) {}
  try { return await Promise.any([direct, relay]); }
  catch (e) { throw e.errors ? e.errors[0] : e; }
}

// ---- writes go through the daemon, which holds the key ----
async function publish(type, body, base = hub) {
  const r = await api("/v1/hub/publish", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hub: base, type, body }) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || "HTTP " + r.status);
  return out;
}

// Where a post's words show plain (the feed's latest line, the reply

// words. A bare URL is http(s)

      } catch (err) { say(err.message, true); }
    };
    foot.append(x);
  }
  if (foot.childElementCount) node.append(foot);
  return node;
}

function placeholders(n) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    frag.append(el("div", { class: "ph" },
      el("div", { class: "bar w40" }), el("div", { class: "bar w80" })));
  }
  return frag;
}

// Older pages load themselves: a placeholder row sits under the last post
// and the next page is fetched the moment it scrolls into view, so the
// list reads as one continuous feed. observe() always reports once, so
// re-arming after a page that left the row in view fetches the next one.
const moreEl = el("div", { class: "ph", id: "more" },
  el("div", { class: "bar w40" }), el("div", { class: "bar w80" }));
const moreIO = new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) view.kind === "search" ? openSearch(view.q, true) : loadFeed(true);
}, { root: feedEl, rootMargin: "0px 0px 80px 0px" });
let loadingMore = false;
function watchMore() {
  feedEl.append(moreEl);
  moreIO.unobserve(moreEl);
  moreIO.observe(moreEl);
}

async function loadFeed(more) {
  if (more) {
    if (loadingMore || view.kind !== "feed" || !moreEl.isConnected) return;
    loadingMore = true;
  } else {
    feedEl.replaceChildren(placeholders(6));
    oldestId = "";
  }
  try {
    const q = oldestId ? "?limit=" + PAGE + "&before=" + oldestId : "?limit=" + PAGE;
    const out = await hget("/v1/feed" + q);
    if (more && (view.kind !== "feed" || !moreEl.isConnected)) return; // view moved on
    moreEl.remove();
    if (!more) feedEl.replaceChildren();
    if (!out.posts.length && !more)
      feedEl.append(el("div", { class: "muted" }, "Nothing here yet. Say something!"));
    for (const p of out.posts) feedEl.append(renderPost(p));
    if (out.posts.length) oldestId = out.posts[out.posts.length - 1].id;
    if (out.posts.length === PAGE) watchMore();
  } catch (e) {
    if (!more) feedEl.replaceChildren(el("div", { class: "muted" }, "Load failed: " + e.message));
    else setTimeout(() => { if (view.kind === "feed" && moreEl.isConnected) watchMore(); }, 3000);
  } finally {
    if (more) loadingMore = false;
  }
}

// threadNode renders one reply at its place in the tree: dataset.depth
// keys live inserts, and past the first level the row steps in under
// the reply it answers.
function threadNode(p, depth = p.depth || 1) {
  const n = renderPost(p, { inThread: true });
  n.dataset.depth = depth;
  if (depth > 1) {
    n.classList.add("deep");
    n.style.setProperty("--d", depth);
  }
  return n;
}

// setReplyTarget aims the composer at one post of the open thread; the
// strip above the text names it and quotes its first words, and × (or
// choosing the head) goes back to answering the head.
function setReplyTarget(p, quiet) { // quiet: a draft put back, no focus taken
  if (p.id === view.id) { clearReplyTarget(); if (!quiet) $("#text").focus(); return; }
  replyTarget = p;
  const cut = plainWords(p.text, p.mentions);
  $("#rt-label").replaceChildren("Replying to ", el("b", {}, p.author_name || p.author),
    cut ? " — " + (cut.length > 80 ? cut.slice(0, 80) + "…" : cut) : "");
  $("#reply-to").classList.add("on");
  if (!quiet) $("#text").focus();
  saveDraft();
}
function clearReplyTarget() {
  replyTarget = null;
  $("#reply-to").classList.remove("on");
  saveDraft();
}
$("#rt-clear").onclick = () => { clearReplyTarget(); $("#text").focus(); };

async function openThread(id, jumpTo) {
  // the same thread opened again (Refresh, a reply sent) keeps its
  // summary up; another thread starts with it down
  if (!(view.kind === "thread" && view.id === id)) summaryOpen = false;
  view = { kind: "thread", id };
  clearReplyTarget();
  setSummary(null);
  $("#thread-head").classList.add("on");
  $("#text").placeholder = "Write a reply…";
  feedEl.replaceChildren(placeholders(3));
  try {
    const out = await hget("/v1/post/" + id);
    if (view.kind !== "thread" || view.id !== id) return true; // the reader moved on meanwhile: theirs stands
    // jumping to one reply, that reply wears the tint, not the head
    const headNode = renderPost(out.post, { inThread: true, focus: !jumpTo });
    headNode.dataset.depth = 0;
    feedEl.replaceChildren(headNode);
    // the whole tree in reading order, a reply under the reply it
    // answers (out.replies is one level only, kept for an older hub)
    for (const p of out.thread || out.replies) feedEl.append(threadNode(p));
    $("#thread-title").textContent = "Thread — " +
      (out.post.author_name || out.post.author);
    setSummary(out.summary || null);
    if (jumpTo) {
      const n = feedEl.querySelector(`[data-id="${CSS.escape(jumpTo)}"]`);
      if (n) { n.classList.add("focus"); n.scrollIntoView({ block: "center" }); }
      else headNode.classList.add("focus"); // the reply is gone: land as usual
    }
    return true;
  } catch (e) {
    feedEl.replaceChildren(el("div", { class: "muted" }, "Load failed: " + e.message));
    return false;
  }
}

// ---- the thread's summary (exe-hub PLAN.md, Thread summaries) ----
// A thread of ten replies or more has a quick read of it by the hub's
// model, GET /v1/post/{id}'s summary: the newest step's, in the post's
// language. The head row's Summary button shows while the open thread
// has one, and pressing it lays the summary above the thread's head;
// pressing it again takes it down. A cite ([#n]) in the words is the
// reply it points at: a click lands on that reply, tinted, as a jump
// from the feed does. A newer step that lands while the thread is open
// (the catch-up, or the hub's post.summary) redraws it in place.
let summary = null;      // the open thread's, as the hub gave it
let summaryOpen = false; // the reader pressed the button
function setSummary(sum) {
  const same = JSON.stringify(sum) === JSON.stringify(summary);
  summary = sum;
  $("#summary").hidden = !sum;
  if (!sum || (summaryOpen && (!same || !feedEl.querySelector(".summary")))) drawSummary();
}
$("#summary").onclick = () => {
  summaryOpen = !summaryOpen && !!summary;
  if (summaryOpen) { drawSummary(); feedEl.scrollTop = 0; }
  else holdPlace(drawSummary);
};
function summaryNode(sum) {
  const gl = $("#summary .gl").cloneNode(true);
  gl.classList.add("s-gl");
  const head = el("div", { class: "p-head" }, gl, el("span", { class: "p-name" }, "Summary"),
    el("span", { class: "s-meta" }, "the first " + sum.replies + " replies · " + sum.model), timeEl(sum.ts));
  const node = el("div", { class: "summary", lang: sum.lang }, head);
  const text = el("div", { class: "p-text" }, ...formatText(sum.text, null, null));
  // [#3] and [#1, #2] as the model writes them: each number a link to
  // its reply, the brackets dropped, as the hub's page draws them
  const cites = sum.cites || {};
  const walker = document.createTreeWalker(text, NodeFilter.SHOW_TEXT);
  const found = [];
  for (let t; (t = walker.nextNode());) if (/\[#\d+(?:\s*,\s*#\d+)*\]/.test(t.data)) found.push(t);
  for (const t of found) {
    if (t.parentNode.closest("a, code, pre")) continue;
    const parts = t.data.split(/(\[#\d+(?:\s*,\s*#\d+)*\])/);
    if (parts.length < 2) continue;
    const frag = document.createDocumentFragment();
    for (const part of parts) {
      const m = part.match(/^\[(#\d+(?:\s*,\s*#\d+)*)\]$/);
      if (!m || !m[1].match(/\d+/g).every(n => cites[n])) { if (part) frag.append(part); continue; }
      m[1].match(/\d+/g).forEach((n, i) => {
        if (i) frag.append(", ");
        const a = el("a", { class: "cite", href: "#", "data-at": cites[n] }, "#" + n);
        a.onclick = e => { e.preventDefault(); e.stopPropagation(); landOn(cites[n]); };
        frag.append(a);
      });
    }
    t.replaceWith(frag);
  }
  node.append(text);
  return node;
}
// landOn brings one post of the open thread into view, tinted as the
// post jumped to from the feed is
function landOn(id) {
  const n = feedEl.querySelector(`.post[data-id="${CSS.escape(id)}"]`);
  if (!n) return;
  for (const f of feedEl.querySelectorAll(".focus")) f.classList.remove("focus");
  n.classList.add("focus");
  n.scrollIntoView({ block: "center" });
}
// drawSummary makes the list say what summaryOpen and summary say: the
// panel above the head, or none; the button pressed while it is up
function drawSummary() {
  const cur = feedEl.querySelector(".summary");
  const want = summaryOpen && summary && view.kind === "thread";
  if (cur) cur.remove();
  if (want) feedEl.prepend(summaryNode(summary));
  $("#summary").classList.toggle("open", !!want);
  $("#summary").setAttribute("aria-pressed", want ? "true" : "false");
}

// holdPlace keeps the reader where they are through a change to the
// list: the first post in view stays put (a browser with scroll
// anchoring has done it already and the difference is nothing).
function holdPlace(change) {
  const top = feedEl.getBoundingClientRect().top;
  const pin = [...feedEl.children].find(n => n.getBoundingClientRect().bottom > top);
  const was = pin && pin.getBoundingClientRect().top;
  change();
  if (pin && pin.isConnected) feedEl.scrollTop += pin.getBoundingClientRect().top - was;
}

// syncThread brings the open thread up to date where it stands. The
// stream does that reply by reply; this is the catch-up for what the
// stream could not say — it was down, the machine slept, an event was
// dropped — asked for when the stream comes back, when the window is
// looked at again, and once a minute while a thread is open. What the
// hub has now is laid over what is drawn: a new reply goes in at its
// place in reading order, a post that went is taken out, and nothing
// already there is redrawn, so the reader's place, a playing video and
// the reply being written all stay. The answer is as old as its asking:
// a post the stream brought in meanwhile is not taken out for being
// missing from it, and one the stream took out (gone) is not put back.
const gone = new Set();
let syncing = false, syncAgain = false, landing = 0;
async function syncThread() {
  if (view.kind !== "thread") return;
  if (syncing) { syncAgain = true; return; } // one more once this one is back
  const id = view.id, drawn = n => feedEl.querySelector(`.post[data-id="${CSS.escape(n)}"]`);
  if (!drawn(id)) return; // still loading, or it failed: Refresh's business
  syncing = true;
  try {
    const was = new Set([...feedEl.querySelectorAll(".post")].map(n => n.dataset.id));
    const out = await hget("/v1/post/" + id);
    if (view.kind !== "thread" || view.id !== id || !drawn(id)) return;
    const want = out.thread || out.replies, ids = new Set(want.map(p => p.id));
    holdPlace(() => {
      setSummary(out.summary || null);
      for (const n of [...feedEl.querySelectorAll(".post")])
        if (n.dataset.id !== id && was.has(n.dataset.id) && !ids.has(n.dataset.id)) n.remove();
      let at = drawn(id);
      for (const p of want) {
        let n = drawn(p.id);
        if (!n && gone.has(p.id)) continue;
        if (!n) at.after(n = threadNode(p));
        at = n;
      }
    });
  } catch (e) { /* the next asking tries again */ }
  finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; syncThread(); }
  }
}
setInterval(() => { if (!document.hidden) syncThread(); }, 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
window.addEventListener("online", () => wake());
// wake: back in view or back on the network — a stream waiting out its
// pause is opened now, and the open thread catches up
function wake() {
  if (es && es.readyState === EventSource.CLOSED) connectEvents();
  syncThread();
}

function showFeed() {
  view = { kind: "feed" };
  clearReplyTarget();
  summaryOpen = false; setSummary(null);
  $("#thread-head").classList.remove("on");
  $("#text").placeholder = "What's happening?";
  loadFeed();
}
$("#back").onclick = showFeed;
const refreshView = () => view.kind === "thread" ? openThread(view.id)
  : view.kind === "search" ? openSearch(view.q) : loadFeed();
$("#refresh").onclick = refreshView;

// ---- find ----
// Find… (Cmd-F) asks for words in a dialog, Find being its default
// button; the hits are a view like a thread — the feed list under the
// back bar, titled with the query and the hub's match count, older
// pages loading themselves the same way. Every word must appear
// (GET /v1/search: literal substrings, ASCII case folded, replies too),
// and where it does in a result it stands on yellow (markHits).
// A search is a snapshot: the live stream leaves it alone, Refresh
// re-runs it.
let lastQuery = "";
async function openSearch(q, more) {
  if (more) {
    if (loadingMore || view.kind !== "search" || !moreEl.isConnected) return;
    loadingMore = true;
  } else {
    view = { kind: "search", q, oldest: "" };
    clearReplyTarget();
    summaryOpen = false; setSummary(null);
    lastQuery = q;
    $("#thread-head").classList.add("on");
    $("#thread-title").textContent = "Find \u201c" + q + "\u201d";
    $("#text").placeholder = "What's happening?";
    feedEl.replaceChildren(placeholders(4));
  }
  try {
    const cur = view.oldest ? "&before=" + view.oldest : "";
    const out = await hget("/v1/search?q=" + encodeURIComponent(q) + "&limit=" + PAGE + cur);
    if (view.kind !== "search" || view.q !== q || (more && !moreEl.isConnected)) return; // view moved on
    moreEl.remove();
    if (!more) {
      feedEl.replaceChildren();
      $("#thread-title").textContent = "Find \u201c" + q + "\u201d \u2014 " +
        out.total + (out.total === 1 ? " post matches" : " posts match");
      if (!out.posts.length) feedEl.append(el("div", { class: "muted" }, "No post matches."));
    }
    for (const p of out.posts) {
      const node = renderPost(p);
      markHits(node.querySelector(".p-text"), q);
      feedEl.append(node);
    }
    if (out.posts.length) view.oldest = out.posts[out.posts.length - 1].id;
    if (out.posts.length === PAGE) watchMore();
  } catch (e) {
    if (!more) feedEl.replaceChildren(el("div", { class: "muted" }, "Find failed: " + e.message));
    else setTimeout(() => { if (view.kind === "search" && moreEl.isConnected) watchMore(); }, 3000);
  } finally {
    if (more) loadingMore = false;
  }
}
// markHits paints what Find found: every stretch of a result's words
// that holds one of the query's words goes on yellow. It matches as the
// hub does — literal substrings, only ASCII case folded, which also
// keeps every index true (a full toLowerCase can change a string's
// length) — over the text as drawn, a text node at a time, so a link or
// `code` keeps its element and only its words are wrapped. Stretches
// that touch or overlap join into one mark. A word found only where the
// post does not show it (the address under a [worded](link)) marks
// nothing.
const foldAscii = s => s.replace(/[A-Z]+/g, c => c.toLowerCase());
function markHits(root, q) {
  const words = [...new Set(foldAscii(q).split(/\s+/).filter(Boolean))];
  if (!root || !words.length) return;
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  for (const n of nodes) {
    const low = foldAscii(n.data), runs = [];
    for (const w of words)
      for (let i = low.indexOf(w); i >= 0; i = low.indexOf(w, i + 1)) runs.push([i, i + w.length]);
    if (!runs.length) continue;
    runs.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const frag = document.createDocumentFragment();
    let at = 0, [from, to] = runs[0];
    const flush = () => {
      if (from > at) frag.append(n.data.slice(at, from));
      frag.append(el("mark", {}, n.data.slice(from, to)));
      at = to;
    };
    for (const [a, b] of runs.slice(1)) {
      if (a <= to) to = Math.max(to, b);
      else { flush(); from = a; to = b; }
    }
    flush();
    if (at < n.data.length) frag.append(n.data.slice(at));
    n.replaceWith(frag);
  }
}
function findDialog() {
  if (!hub || J || $("#veil").classList.contains("on")) return;
  const input = el("input", { type: "text", maxlength: 200, value: lastQuery });
  const go = el("button", { class: "ghost default" }, "Find");
  const cancel = el("button", { class: "ghost" }, "Cancel");
  const close = dialog([
    el("h2", {}, "Find"),
    el("div", { class: "row" }, el("label", {}, "Find posts containing"), input),
    el("div", { style: "font-size:11px;color:#555" },
      "Every word must appear somewhere in the post. Replies count too."),
    el("div", { class: "btns" }, cancel, go)]);
  // Return presses Find and Escape presses Cancel wherever the focus is
  // (HIG), so the keys are taken at the document while the dialog is up
  const done = () => { document.removeEventListener("keydown", onKey, true); close(); };
  const submit = () => {
    const q = input.value.trim().split(/\s+/).filter(Boolean).join(" ");
    if (!q) return;
    done();
    openSearch(q);
  };
  const onKey = e => {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "Escape") { e.preventDefault(); done(); }
  };
  document.addEventListener("keydown", onKey, true);
  cancel.onclick = done;
  go.onclick = submit;
  setTimeout(() => { input.focus(); input.select(); }, 50);
}
$("#find").onclick = findDialog;
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "f") {
    e.preventDefault();
    findDialog();
  }
});

// ---- live updates ----
// The hub streams post activity over SSE; events carry ids only, the
// content comes from the tested /v1/post render path. Everything in the
// list is keyed by data-id, so inserts dedupe against reloads racing the
// stream, and a reconnect just refetches the view (drops absorbed).
//
// A dropped connection the browser retries by itself, but an answer that
// is not the stream ends an EventSource for good — and that is what a
// proxy in front of the hub (Tailscale Serve, exe's relay) says while
// the hub restarts: 502. So a closed stream is opened again from here,
// 2 s, 4 s … 30 s apart.
let es = null, esDown = false, esWait = 0, esTimer = 0;
function connectEvents() {
  clearTimeout(esTimer);
  if (es) es.close();
  const me = es = new EventSource(hurl("/v1/events"));
  es.onopen = () => {
    esWait = 0;
    if (!esDown) return;
    esDown = false;
    view.kind === "thread" ? syncThread() : refreshView();
  };
  es.onerror = () => {
    esDown = true;
    if (me !== es || me.readyState !== EventSource.CLOSED) return;
    esWait = Math.min(esWait ? esWait * 2 : 2000, 30000);
    esTimer = setTimeout(connectEvents, esWait);
  };
  es.onmessage = async ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    const seen = id => feedEl.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (m.type === "profile.set") { // live name/avatar refresh on visible posts
      let prof;
      try { prof = await hget("/v1/profile/" + m.author); } catch (e) { return; }
      for (const post of feedEl.querySelectorAll(".post")) {
        const head = post.querySelector(".p-head");
        if (!head || head.querySelector(".p-id")?.textContent !== m.author) continue;
        head.querySelector(".p-ava")?.replaceWith(avatarEl(m.author, prof.avatar));
        head.querySelector(".p-name").textContent = prof.name || "—";
      }
      if (who && m.author === who.id) myProfile = prof; // Profile… reopens fresh
      return;
    }
    if (m.type === "post.summary") { // the open thread's summary landed, or a newer step: the catch-up brings it
      if (view.kind === "thread" && view.id === (m.root || m.id)) syncThread();
      return;
    }
    if (m.type === "post.mark") { // a box of a shown post changed: flip it in place, the pressed one too
      const li = m.mark && seen(m.id)?.querySelector(`.p-text li.box[data-box="${m.mark.box}"]`);
      if (li) { li.classList.toggle("done", !!m.mark.done); li.classList.remove("pending"); }
      return;
    }
    if (m.type === "post.delete") {
      gone.add(m.id);
      const cur = seen(m.id);
      if (cur) holdPlace(() => cur.remove());
      // every post card quoting it comes off: the link stays a link,
      // as the hub now serves it
      for (const c of feedEl.querySelectorAll(".p-quote")) if (c.dataset.quote === m.id) holdPlace(() => c.remove());
      return;
    }
    if (m.type === "post.card") { // the post's link card landed: redraw it in place
      const cur = seen(m.id);
      if (!cur || view.kind === "search") return;
      const out = await hget("/v1/post/" + m.id);
      const fresh = view.kind === "thread"
        ? threadNode(out.post, +cur.dataset.depth || 1) : renderPost(out.post);
      if (cur.classList.contains("focus")) fresh.classList.add("focus");
      if (cur.dataset.depth !== undefined) fresh.dataset.depth = cur.dataset.depth;
      cur.replaceWith(fresh);
      return;
    }
    if (m.type !== "post.create" || seen(m.id)) return;
    if (view.kind === "thread") {
      // any visible post can be the parent, the head or a reply; the
      // new reply lands at the end of its parent's subtree, so the
      // tree keeps reading order without a refetch
      let parent = m.reply_to && seen(m.reply_to);
      if (!parent) {
        // not this thread's — unless its parent is a reply still on its
        // way in (or the thread is): the catch-up settles which
        if (m.reply_to && (landing || syncing)) syncThread();
        return;
      }
      landing++;
      let out;
      try { out = await hget("/v1/post/" + m.id); }
      catch (e) { syncThread(); return; } // the catch-up asks again
      finally { landing--; }
      parent = seen(m.reply_to);
      if (seen(m.id) || !parent || gone.has(m.id)) return;
      if (view.kind !== "thread") return;
      const d = (+parent.dataset.depth || 0) + 1;
      let last = parent;
      while (last.nextElementSibling && +last.nextElementSibling.dataset.depth > +parent.dataset.depth)
        last = last.nextElementSibling;
      holdPlace(() => last.after(threadNode(out.post, d)));
      return;
    }
    if (view.kind === "search") return; // a snapshot; Refresh re-runs it
    if (m.reply_to) { // a reply bumps its thread: walk up to the root,
      // then redraw it at the top with the fresh count and last reply
      try {
        let cur = m.reply_to, root = null;
        for (let i = 0; i < 20; i++) {
          const out = await hget("/v1/post/" + cur);
          if (!out.post.reply_to) { root = out.post; break; }
          cur = out.post.reply_to;
        }
        if (!root || view.kind !== "feed") return;
        const old = seen(root.id);
        const fresh = renderPost(root);
        const stick = feedEl.scrollTop;
        if (old) old.remove();
        feedEl.prepend(fresh);
        if (stick > 0) feedEl.scrollTop = stick + (old ? 0 : fresh.offsetHeight);
      } catch (e) { /* the next Refresh reorders anyway */ }
      return;
    }
    const out = await hget("/v1/post/" + m.id);
    if (seen(m.id)) return;
    feedEl.querySelector(".muted")?.remove();
    const node = renderPost(out.post);
    const stick = feedEl.scrollTop;
    feedEl.prepend(node);
    // reading further down? hold the viewport still under the insert
    if (stick > 0) feedEl.scrollTop = stick + node.offsetHeight;
  };
}

// ---- composing ----
function renderChips() {
  const box = $("#chips");
  peekHide(); // its chip is going; the pointer over the new one shows it again
  box.replaceChildren();
  $("#draw").disabled = attachments.length >= 4; // a drawing is one more attachment
