<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Dict also stands alone: opened at /apps/dict/ and added to a phone's
     home screen it is an app of its own (manifest.json, the touch icon on
     the desk's lavender — iOS fills a transparent one black). In the
     desktop's window none of this applies: an iframe has no viewport or
     safe areas of its own. maximum-scale=1 keeps iOS from zooming in on
     the 12px field when it takes the caret. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dict</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dict">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eeeeee">
<script>
// Dict as the page itself (html.solo), and as its own home-screen app
// (html.standalone): only then does it keep its own room from the phone's
// edges (the :root.solo rules). Set before the first paint.
(() => {
  const h = document.documentElement;
  if (window.parent !== window) return; // a window in the desktop
  h.classList.add("solo");
  if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) h.classList.add("standalone");
})();
</script>
<link rel="stylesheet" href="/platinum/popup.css">
<style>
/* Platinum values match the exe desktop (same block as Blue Pencil and Notes) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --red: #cc3333; --green: #1f9e33;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* on its own on a phone, --vvh is the visual viewport's height (fitViewport,
   below): a document no taller than what shows above the keyboard leaves
   iOS nothing to pan to (the desktop's own rule, index.html) */
html, body { height: var(--vvh, 100%); }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column;
  /* on its own on a phone: clear of the notch and the rounded corners in
     landscape, and of the blur under the status bar (--top-blur, below) */
  padding: calc(var(--sat) + var(--top-blur)) var(--sar) 0 var(--sal); }
/* The room a phone needs is Dict's own only when Dict is the page itself
   (html.solo: a home-screen app of its own, or the bare page in Safari).
   As a window in the desktop — the desktop's own home-screen app among
   them — the desktop keeps its windows clear of the notch, the status bar
   and the home indicator, and the signs of a home-screen app
   (display-mode, navigator.standalone) are true in its windows too: none
   of this applies there. As its own home-screen app on an iPhone
   (html.standalone), iOS 27 blurs a band under the status bar that reaches
   past the top safe-area inset, so the toolbar starts that much lower, on
   a plain band of its own grey that the blur leaves unharmed; not in
   landscape, where the status bar is gone. The classes are set in <head>,
   before the first paint. */
:root { --sat: 0px; --sar: 0px; --sab: 0px; --sal: 0px; --top-blur: 0px; }
:root.solo { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
@media (orientation: portrait) { :root.solo.standalone { --top-blur: 20px; } }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost:disabled { color: #777; border-color: #888; background: var(--g300); box-shadow: none; }
/* the one button Return presses wears the ring */
button.ghost.default { outline: 2px solid var(--black); outline-offset: 1px; border-radius: 4px; }
button:focus:not(.default) { outline: none; }

/* the sunken text field (Weather's) */
input[type=text] { background: #fff; color: var(--black);
  border: 1px solid var(--black); border-radius: 0; padding: 2px 5px; font: inherit; font-size: 12px;
  height: 20px; line-height: 14px; min-width: 0;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff;
  user-select: text; cursor: text; }
input[type=text]:focus { outline: 2px solid #9999fe; outline-offset: 0; }
/* The pop-up menu button is the shared block the daemon serves
   (/platinum/popup.css, exe-stats popup.css): linked above, never copied. */

/* the toolbar, like Notes' and Todo's: the two languages, the word, Look
   Up, 8px apart with 10px of room round them; the arrow between the
   languages is a glyph, not a control. A narrow window (a phone) puts the
   languages on a row of their own above the word. */
#bar { flex: none; display: grid; align-items: center; column-gap: 8px; row-gap: 8px;
  grid-template-columns: 104px 9px 104px minmax(80px, 1fr) auto;
  grid-template-areas: "from arrow to q go"; padding: 10px 10px 8px; }
#from-pop { grid-area: from; } #to-pop { grid-area: to; }
#arrow { grid-area: arrow; display: block; width: 9px; height: 7px; }
#arrow svg { display: block; }
#arrow .fine { display: none; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) {
  #arrow .crisp { display: none; } #arrow .fine { display: block; }
}
/* the word field and, at its right end while it holds text, a circled x
   that empties it (shown by :placeholder-shown, so it follows text the
   page puts there too); the field keeps room for it either way, so the
   text never shifts as it comes and goes. The x is a 12px crisp glyph,
   a smooth copy between 1x and 2x; its cell is the field's height, a
   fair target for a finger. */
#qwrap { grid-area: q; position: relative; min-width: 0; }
#q { display: block; width: 100%; padding-right: 22px; }
#qx { position: absolute; top: 0; right: 0; width: 20px; height: 20px; display: grid; place-items: center; }
#q:placeholder-shown + #qx { display: none; }
#qx svg { display: block; }
#qx .fine { display: none; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) {
  #qx .crisp { display: none; } #qx .fine { display: block; }
}
#qx .disc { fill: #999; }
#qx:active .disc { fill: #555; }
#go { grid-area: go; width: 72px; padding-left: 0; padding-right: 0; }
/* The shared Platinum menu block (Analytics): candidates float beneath
   the field, leaving the tabs and entry in place. */
.dropdown { position: fixed; z-index: 30; min-width: 170px; background: var(--g300);
  border: 1px solid var(--black); padding: 2px 1px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--g500), 2px 2px 0 rgba(38,38,38,.85); }
.dd-item { padding: 3px 22px 3px 18px; line-height: 18px; white-space: nowrap; }
.dd-item.on { background: var(--hl); color: #fff; }
#suggestions { min-width: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
#suggestions .dd-item { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 459px) {
  #bar { grid-template-columns: 1fr 9px 1fr auto;
    grid-template-areas: "from arrow to to" "q q q go"; }
}

/* the tabs, one a lookup: the desktop's Platinum tab control (index.html
   .tabbar and .tab, copied) standing on the toolbar's grey with their
   foot on the pages' top line. The open tab is filled with the page's
   white, not the panel grey, as the page is what it opens onto. A tab
   holds a mark slot (the green dot while it writes unwatched, the black
   dot when it finished unwatched — the session column's marks), the word
   and a close box, at fixed widths so nothing moves as marks come and go;
   the word gives way to an ellipsis as tabs crowd. The bar is there from
   the first paint, a lone tab too, so the page never drops when a second
   tab opens. */
/* past what fits, the bar scrolls sideways (a wheel, a trackpad, a
   finger), its scroll bar hidden; the 3px it reaches below its line keep
   the open tab's foot inside the scrolled box, so it is not clipped */
#tabs { flex: none; display: flex; align-items: flex-start; padding: 0 6px 3px; margin-bottom: -3px;
  position: relative; z-index: 2; min-width: 0; min-height: 25px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab {
  height: 22px; color: #000; font-size: 11px; font-weight: bold; line-height: 14px;
  text-align: center; padding: 0 2px; position: relative; white-space: nowrap;
  border-style: solid; border-width: 8px 14px 0 14px;
  border-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='22'><path d='M4.5 23 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L39.5 23' fill='%23ccc' stroke='%23000'/><path d='M6.2 23 L12 5.8 Q12.6 2.5 14 2.5 L29.5 2.5' fill='none' stroke='%23ddd'/><path d='M30 2.5 Q31.6 2.5 32.2 5.8 L37.8 23' fill='none' stroke='%23aaa'/></svg>") 8 14 0 14 fill stretch;
  display: flex; align-items: flex-start; gap: 4px; flex: 0 1 auto; min-width: 100px; max-width: 180px;
}
.tab + .tab { margin-left: -7px; }
.tab.active {
  height: 25px; margin-bottom: -3px; z-index: 3;
  border-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='25'><path d='M3.8 25 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L40.2 25 Z' fill='%23fff'/><path d='M4.9 22 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L39.1 22' fill='none' stroke='%23000'/><path d='M6.6 22 L12 5.8 Q12.6 2.5 14 2.5 L29.5 2.5' fill='none' stroke='%23fff'/><path d='M30 2.5 Q31.6 2.5 32.2 5.8 L37.4 22' fill='none' stroke='%23bbb'/></svg>") 8 14 0 14 fill stretch;
}
/* the open tab keeps its whole word (up to the widest a tab gets); the
   others narrow, then the bar scrolls */
.tab.active { flex-shrink: 0; }
/* the desktop's block sets the label on the tab's lowest 14px, which leaves
   capitals 9px clear under the top line and 3px over the pages' line; here
   the word, its mark and its close box stand 3px higher, 6px clear each
   way. Lifted as they are rather than by moving the 8px top border: that
   is the shape's own slice, and stays whole device pixels at 150 percent. */
.tab > span { position: relative; top: -3px; }
.tab .mk { flex: none; width: 7px; height: 7px; margin-top: 4px; }
.tab .mk svg { display: block; }
.tab .mk.live { border-radius: 50%; background: var(--green); width: 6px; height: 6px; margin: 4px 0 0 1px;
  animation: pulse 1.2s ease-in-out infinite; }
.tab .lb { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tab .lb.untitled { color: #666; }
/* A circular close target; its quiet hover wash fades without moving the X. */
.tab .tx { flex: none; width: 15px; height: 15px; display: grid; place-items: center;
  border-radius: 50%; background-color: transparent; transition: background-color 120ms ease-out; }
.tab .tx svg { display: block; }
.tab .tx .fine { display: none; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) {
  .tab .tx .crisp { display: none; } .tab .tx .fine { display: block; }
}
@media (hover: hover) {
  .tab .tx:hover { background-color: rgba(38, 38, 38, .10); }
}
.tab .tx:active { background-color: #666; transition-duration: 0s; }
.tab .tx:active svg { filter: invert(1); }
@media (prefers-reduced-motion: reduce) { .tab .tx { transition: none; } }

/* the pages: one a tab, white, under the tabs' line, flush with the window
   frame at the sides and with the status bar below (its top line is the
   one seam there). Stacked in one box, the hidden ones visibility: hidden
   so each keeps its scroll place (Chrome drops a display: none box's).
   The scroll bar's right edge is the frame's line, and the bar is always
   on so nothing reflows when an entry outgrows the window. */
#pages { flex: 1; min-height: 0; position: relative; background: #fff; border-top: 1px solid var(--black); }
.page { position: absolute; inset: 0; overflow-y: scroll; overflow-x: hidden; background: #fff; }
.page.off { visibility: hidden; }
.entry { padding: 12px 14px 16px; user-select: text; cursor: text; overflow-wrap: break-word; }
.entry .hw { font-size: 18px; line-height: 24px; font-weight: bold; }
.entry .hw.muted { color: #888; }
.entry .head { display: flex; align-items: center; gap: 12px; min-height: 24px; }
.entry .head .hw { min-width: 0; overflow-wrap: anywhere; }
.entry .speak { flex: none; width: 30px; padding: 2px 7px; }
.entry .speak svg { display: block; }
.entry .prons { margin-top: 2px; }
.entry .prons span + span { margin-left: 14px; }
.entry .pl { color: #777; margin-right: 5px; }
.entry .note { margin-top: 4px; color: #555; }
/* a typo read as the word it stands for: said above the entry, with the
   way back to the text as typed */
.entry .fix { margin-bottom: 6px; font-size: 11px; color: #555; }
.entry .forms { margin-top: 4px; font-size: 11px; color: #555; }
.entry h3 { font-size: 12px; margin: 16px 0 6px; padding-bottom: 2px; border-bottom: 1px solid var(--g400); }
.entry ol { margin: 0; padding: 0 0 0 20px; }
.entry ol li + li { margin-top: 6px; }
.entry .pos { color: var(--hl); font-style: italic; margin-right: 6px; }
.entry .gloss { font-weight: bold; }
.entry .def { color: #444; }
.entry .ex + .ex { margin-top: 8px; }
.entry .tr { color: #555; }
.entry p { margin: 0; }
.entry table.rel { border-collapse: collapse; }
.entry table.rel td { padding: 1px 12px 1px 0; vertical-align: top; }
.entry table.rel td.rl { color: #777; white-space: nowrap; }
.entry .quote { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--g400); }
/* verse keeps its lines */
.entry .quote .verse { white-space: pre-line; }
.entry .quote .src { font-size: 11px; color: #777; }
/* a word that looks itself up: the status bar link's look (no pointing
   hand, no hover), pressed it goes black */
.entry .link { color: var(--hl); text-decoration: underline; cursor: default; }
.entry .link:active { color: #000; }
/* what the page says when it holds no entry: centred, grey, in the page's
   own type */
.entry .empty { padding: 40px 12px; text-align: center; color: #888; user-select: none; cursor: default; }
/* The welcome page rests directly on the window's grey: no pane edge,
   section rules or scrollbar. Small windows can still scroll by touch,
   wheel or keyboard. The daily word is deliberately large serif display
   type (Livid's welcome-page exception to the regular Platinum type). */
body.welcoming #tabs { display: none; }
body.welcoming #pages { border-top-color: transparent; background: var(--g200); }
#welcome { background: var(--g200); overflow-y: auto; scrollbar-width: none; }
#welcome::-webkit-scrollbar { display: none; }
#welcome .entry { cursor: default; max-width: 540px; margin: 0 auto; padding: 24px 30px 28px; }
#welcome .daily-feature { text-align: center; }
#daily-shuffle { position: relative; display: block; width: 59px; height: 43px;
  margin: -12px auto 0; padding: 12px; border: 0; background: none; color: #8888aa; }
#daily-shuffle:focus-visible { outline: 1px dotted var(--black); outline-offset: -4px; }
#daily-shuffle:active { color: var(--hl); }
#welcome .ornament { display: block; }
#daily-shuffle .sparkles { position: absolute; inset: 0; pointer-events: none; color: #8888aa; }
#daily-shuffle .sparkles path { opacity: 0; }
#welcome h1 { font-size: 11px; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
#welcome .daily-date { color: #777; font-size: 10px; margin-top: 5px; min-height: 15px; }
#welcome h2 { font-size: 12px; font-weight: normal; color: #666; margin: 0 0 16px; }
#welcome .quiet { color: #777; }
/* Keep room for the word and two lines of meaning before either arrives. */
#daily { height: 184px; padding: 20px 0 12px; overflow: hidden; }
#daily .daily-word { min-height: 60px; display: grid; place-items: center; }
#welcome button.link { background: none; border: 0; padding: 0; text-align: left; font: inherit; text-decoration: none; }
#daily .daily-word button { max-width: 100%; text-align: center; overflow-wrap: anywhere;
  font: italic var(--word-size, 46px)/1.1 "Iowan Old Style", "Palatino Linotype", "Baskerville", "Georgia", serif;
  letter-spacing: -1px; color: var(--hl); }
#daily .daily-gloss { margin: 12px auto 0; max-width: 360px; color: #555;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#daily .daily-gloss .pos { color: #777; }
#welcome #daily .daily-open { display: inline-block; margin-top: 12px; color: #777; font-size: 10px; }
#welcome button.link:focus-visible { outline: 1px dotted var(--black); outline-offset: 2px; }
#welcome .recent-section { max-width: 400px; margin: 0 auto; }
#recent { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
#recent li { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin: 0; }
#recent .number { flex: none; color: #999; font-size: 10px; font-variant-numeric: tabular-nums; }
#recent .recent-word { min-width: 0; }
#recent .link { max-width: 100%; overflow-wrap: anywhere; }
#recent .pair { display: block; margin-top: 2px; color: #888; font-size: 10px; }
@media (max-width: 399px) {
  #welcome .entry { padding: 20px 20px 24px; }
  #daily .daily-word button { font-size: min(var(--word-size, 46px), 38px); }
  #recent { column-gap: 16px; }
}
@media (max-height: 460px) {
  #welcome .entry { padding-top: 12px; }
  #daily-shuffle { margin-bottom: -4px; }
  #daily { height: 160px; padding-top: 12px; }
}
/* a session writing, watched: the word in grey, the model under it, then
   the session's steps as they come — the time each began in a column of
   its own, what it is, how long a reasoning pass took in grey at its end.
   The step under way wears the Chat list's pulsing green dot (green means
   live); a pass still without its summary reads grey. */
.entry .wmeta { margin-top: 2px; font-size: 11px; color: #777; }
.entry ol.log { list-style: none; margin: 12px 0 0; padding: 0; }
.entry ol.log li { display: grid; grid-template-columns: 34px 12px 1fr; align-items: baseline; }
.entry ol.log li + li { margin-top: 3px; }
.entry ol.log .t { color: #888; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
.entry ol.log .m { align-self: center; justify-self: center; width: 6px; height: 6px; }
.entry ol.log .x.dim { color: #888; }
.entry ol.log .d { color: #888; font-size: 11px; margin-left: 6px; white-space: nowrap; }
.entry ol.log li.now .m { border-radius: 50%; background: var(--green); }
.entry .live, .entry ol.log li.now .m {
  animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .entry ol.log li.now .m, .tab .mk.live { animation: none; } }
/* a lookup that went wrong: the alert's layout — the caution sign, a bold
   label beside it, the plain narrative under it */
.entry .caution { display: flex; gap: 20px; align-items: flex-start; padding: 28px 12px 0; cursor: default; }
.entry .caution .sign { flex: none; display: block; width: 32px; height: 32px; }
.entry .caution .sign svg { display: block; }
.entry .caution .body { flex: 1; min-width: 0; }
.entry .caution .msg { font-weight: bold; line-height: 1.35; }
.entry .caution .detail { font-size: 11px; line-height: 1.45; margin-top: 7px; }
.entry .caution .btns { margin-top: 12px; }

/* overflow: clip — the 11px text's line box is taller than the 14px face and
   hangs a pixel past the bar; clipped, that pixel is no scrollable overflow of
   the page (docs/platinum.md, status bar) */
/* on its own on a phone the bar runs on under the home indicator: its face
   grows by the inset below, the line of text stays where it always was —
   top-aligned a pixel up is exactly where centring put the 16px line box
   on the 14px face, and the line height is left alone */
#status { flex: none; display: flex; align-items: flex-start; gap: 10px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px var(--sab) 8px;
  height: calc(15px + var(--sab));
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; overflow: clip; }
#st { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -1px; }
#st.err { color: var(--red); }
body.welcoming #status { border-top-color: transparent; background: var(--g200); box-shadow: none; color: #777; }
#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px;
  touch-action: none; z-index: 6; }
body.mobile #grow { display: none; }
body.mobile #status { padding-right: 8px; }
/* the keyboard is up: it covers the home indicator, so the bar sits on the
   keys at its plain 15px */
body.kb #status { --sab: 0px; }

/* Mac OS 9 scrollbars — the desktop's pixel-sampled spec (same as Notes) */
::-webkit-scrollbar { width: 15px; height: 15px; }
::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black);
  background: linear-gradient(to right, #777 0, #777 1px, #888 1px, #888 2px, #aaa 2px, #aaa 12px, #bbb 12px, #bbb 13px, #ccc 13px, #ccc 14px); }
::-webkit-scrollbar-thumb:vertical { border: 1px solid var(--black); border-right: 0;

<script>
"use strict";

const IS_MOBILE = new URLSearchParams(location.search).has("mobile")
  ? new URLSearchParams(location.search).get("mobile") !== "0"

// holds the same two lists).
const FROM = [["en", "English"], ["de", "German"], ["fr", "French"], ["es", "Spanish"], ["it", "Italian"], ["la", "Latin"]];

async function api(url, opts = {}) {

}

  n.append(...kids.filter(k => k !== null && k !== undefined && k !== false));
  return n;
}

const from = $("#from"), to = $("#to"), field = $("#q"), st = $("#st");
const tabsEl = $("#tabs"), pagesEl = $("#pages");
for (const [c, n] of FROM) from.append(el("option", { value: c }, n));
for (const [c, n] of TO) to.append(el("option", { value: c }, n));

const tidy = s => s.normalize("NFC").replace(/\s+/g, " ").trim();

const day = ms => new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

// ---- welcome: this browser's recent lookups and a saved daily word ----
let recent = [];

    { color: "#8888aa" }, { color: "#bbbbdd", offset: .35 }, { color: "#8888aa" }
  ], { duration: 650, easing: "ease-out" });
  dailyStar.querySelectorAll(".sparkles path").forEach((p, i) => p.animate([
    { opacity: 0 }, { opacity: .8, offset: .35 }, { opacity: 0 }

}

  const item = { q, from: src, to: dst, exact };
  recent = [item, ...recent.filter(r => recentKey(r) !== recentKey(item))].slice(0, 10);

  const stamp = [src, dst, date].join(":");
  if (stamp !== dailyStamp) { dailyWord = null; dailyStamp = stamp; }
  dailyNotice = "";
  paintStatus();
  $("#daily-date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  if (!another && dailyWord) return; // keep a chosen word when returning to the welcome page

  dailyStar.setAttribute("aria-disabled", "true");

    paintStatus();

    const r = await api("/v1/dict/daily?" + params, { signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const m = await r.json();

    if (!m.word) {
      if (dailyWord) dailyNotice = "No other saved words in " + pairOf(src, dst) + " yet.";
      else daily.replaceChildren(el("p", { class: "quiet" }, "Look up a word in " + pairOf(src, dst) + " to start this dictionary."));
      return;
    }
    const w = dailyWord = m.word;
    dailyNotice = "";
    const wordButton = welcomeLink(w.word, src, dst, true, w.q);
    wordButton.style.setProperty("--word-size", w.word.length > 45 ? "22px" : w.word.length > 28 ? "28px" : w.word.length > 16 ? "36px" : "46px");

    open.classList.add("daily-open");

      el("div", { class: "daily-word" }, wordButton),
      el("p", { class: "daily-gloss", lang: LANG_TAG[dst] || dst },

    daily.replaceChildren(el("p", { class: "quiet" }, "Word of the Day could not be loaded."), retry);

    if (ctrl === dailyCtrl) {

const suggestions = $("#suggestions");

// partialJSON reads as much of a JSON text as has arrived: an object or a
// list cut short ends where the text does, a string cut short keeps what
// it has, and a key or a value not yet begun is left out.
function partialJSON(s) {

  const ESC = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f" };

    i++;

      const c = s[i];
      if (c === '"') { i++; return { v, done: true }; }
      if (c === "\\") {
        if (i + 1 >= n) break;
        const e = s[i + 1];
        if (e === "u") {

          i += 6;

        continue;

      v += c; i++;

    i = n;
    return { v, done: false };
  }

    ws();
    if (i >= n) return END;
    const c = s[i];

      i++;

        if (s[i] === (obj ? "}" : "]")) { i++; return out; }
        if (s[i] === ",") { i++; continue; }
        let key;
        if (obj) {

          const k = str();
          if (!k.done) return out;
          ws();
          if (s[i] !== ":") return out;
          i++;

        }

        if (v === END) return out;
        if (obj) out[key] = v; else out.push(v);

      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 1);
        if (!line.trim() || stream !== me) continue;
        heard(JSON.parse(line));
      }
    }
  } catch (e) {
    if (me.ctrl.signal.aborted) return;
  }
  if (stream !== me) return;
  stream = null;
  if (following()) setTimeout(() => { if (!stream && following()) openStream(); }, 1500);
}
function heard(m) {
  if (m.ready) {
    for (const t of tabs) if (t.fid && !flights.has(t.fid)) run(t, t.typed, t.src, t.dst, t.exact);
    return;
  }
  const fid = m.flight;
  if (!fid) return; // a ping
  if (m.began) {
    flights.set(fid, { lines: [], final: null });
    for (const t of tabs) if (t.fid === fid) { t.base = m.began.wait || 0; t.at = Date.now(); begin(t); }
    return;
  }
  const fl = flights.get(fid);
  if (!fl) return;
  if (m.entry || m.notfound || m.error) fl.final = m;
  else fl.lines.push(m);
  for (const t of tabs) if (t.fid === fid) take(t, m);
}

// begin starts a tab's page over on its flight: the log, the clock
function begin(tab) {
  if (tab.watcher) tab.watcher.stop();
  // A missing pronunciation keeps the saved definition on screen.
  tab.watcher = tab.audioOnly
    ? { q: tab.q, audio: true, drawn: true, step() {}, more() {}, stop() {} }
    : watch(tab, tab.typed, tab.model, tab.effort, tab.word);
  clearInterval(tab.ticker);
  tab.ticker = setInterval(() => tick(tab), 1000);
  tick(tab);
}
function tick(tab) {
  const w = tab.watcher;
  if (!w) return;
  const s = tab.base + Math.floor((Date.now() - tab.at) / 1000);
  setStatus(tab, w.audio ? "Preparing pronunciation for “" + w.q + "”… " + clock(s) : w.answering
    ? "Codex is writing “" + w.q + "”… " + num([...w.text].length) + " characters · " + clock(s)
    : w.spell && !w.spell.done ? "Codex is checking the spelling of “" + w.q + "”… " + clock(s)
    : "Codex is thinking about “" + w.q + "”… " + clock(s));
}

// take is one line of a tab's flight
function take(tab, m) {
  const w = tab.watcher;
  if (m.step) { if (w) { w.step(m.step); tick(tab); } return; }
  if (m.text !== undefined) { if (w) w.more(m.text); return; }
  const q = tab.typed, src = tab.src, dst = tab.dst;
  const elapsed = tab.base + Math.floor((Date.now() - tab.at) / 1000);
  if (m.entry) {
    // corrected: the daemon read what was typed as a typo — a known one
    // (it says so), or the flight's word is not the tab's own text
    const typo = m.entry.corrected || (tab.key && m.entry.q !== tab.key);
    const k = Object.assign({}, m.entry, { corrected: typo ? q : "" });
    const drawn = !!(w && w.drawn);
    const audioOnly = tab.audioOnly;
    // a typo: the tab takes its word, as the session showed it
    tab.q = !k.corrected ? q : w && w.q.toLowerCase() === k.q ? w.q : k.q;
    if (tab === active && !audioOnly) { closeSuggestions(); field.value = tab.q; }
    settle(tab);
    if (k.audio_flight) Object.assign(tab, { fid: k.audio_flight, key: k.corrected || k.q, audioOnly: true,
      busy: true, base: 0, at: Date.now() });
    renderEntry(tab, k, drawn); // a page watched being written keeps its place
    const tok = k.tokens;
    setStatus(tab, k.written
      ? "Written by " + k.model + " (" + k.effort + ") in " + clock(elapsed) +
        (tok ? " · " + num(tok.totalTokens) + " tokens, " + num(tok.reasoningOutputTokens) + " of them reasoning" : "") + " · kept"
      : pairOf(src, dst) + " · in the dictionary since " + day(k.created));
    if (audioOnly && !k.audio) setStatus(tab, "Pronunciation unavailable. Look up this word again to retry.");
    if (k.audio_flight) { drawTab(tab); remember(); followFlight(tab); }
  } else if (m.notfound) {
    settle(tab);
    const sugg = m.suggestions || [];
    show(tab, caution("“" + q + "” is not " + article(nameOf(FROM, src)) + " word Dict knows.",
      sugg.length ? el("span", {}, "Did you mean ", ...sugg.flatMap((s, j) =>
        [j ? (j === sugg.length - 1 ? " or " : ", ") : "", link(s, src)]), "?") : "Check the spelling, or the language it is looked up from."));
    setStatus(tab, "Not " + article(nameOf(FROM, src)) + " word: nothing was kept");
  } else if (m.error) {
    failed(tab, q, tab.exact, m.error);
  }
}

// lookup looks up what the field holds, in the pop-ups' languages, in the
// tab tabFor picks: an entry the dictionary keeps comes back at once; one
// it lacks is written by a Codex session, which takes a minute or two and
// goes on if the tab or the window closes — the next lookup finds it kept,
// and one made while it is still writing joins it. Which of the two it is
// only the start's answer says, so a tab showing an entry is spared until
// then (run's spare).
//
// Unless exact, the daemon checks the spelling first: an obvious typo is
// read as the word it stands for (the tab and the field take that word),
// and a lookup that is no word ends there, with suggestions.
function lookup(exact = false) {
  closeSuggestions();
  const q = tidy(field.value);
  if (!q) { field.focus(); return; }
  field.value = q;
  recordLookup(q, from.value, to.value, exact);
  const pick = tabFor(q, from.value, to.value, exact);
  if (pick.open) { // (the open tab itself, asked twice, keeps the field as typed)
    if (pick.tab !== active) activate(pick.tab);
    return;
  }
  const tab = pick.tab;
  if (tab !== active) activate(tab);
  run(tab, q, from.value, to.value, exact, true);
}

// run is one lookup on one tab: its start answers with the entry, or with
// the flight the tab then follows on the shared stream.
//
// spare is a lookup the reader made from the tab, which may show an entry:
// that page gives way only to another entry. The tab keeps its word and
// its page until the start answers (busy meanwhile, what was asked in
// tab.ask); a kept entry then takes the tab, and anything else — a session
// writing the word, a failure — opens in a tab of its own beside it, the
// entry left as it was.
async function run(tab, q, src, dst, exact, spare = false) {
  stopTab(tab);
  const was = spare && tab.filled ? { st: tab.st, stErr: tab.stErr } : null;
  if (was) Object.assign(tab, { ask: { q, src, dst, exact }, busy: true, unseen: false });
  else Object.assign(tab, { q, typed: q, src, dst, exact, busy: true, unseen: false });
  drawTab(tab);
  remember();
  const my = tab.ctrl = new AbortController();
  setStatus(tab, "Looking up “" + q + "”…");
  let r = null, m = {}, down = "";
  try {
    r = await api("/v1/dict/start", { method: "POST", signal: my.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from: src, to: dst, q, exact }) });
    m = await r.json().catch(() => ({}));
  } catch (e) {
    if (my.signal.aborted) return;
    down = e.message;
  }
  if (my !== tab.ctrl) return;
  tab.ctrl = null;
  if (was) {
    tab.ask = null;
    if (r && r.ok && m.entry) {
      Object.assign(tab, { q, typed: q, src, dst, exact });
      if (tab === active) { from.value = src; to.value = dst; }
    } else {
      tab.busy = false;
      setStatus(tab, was.st, was.stErr);
      const own = newTab({ src, dst, q, exact, after: tab });
      Object.assign(own, { typed: q, busy: true });
      if (tab === active) activate(own);
      else { drawTab(own); remember(); }
      tab = own;
    }
  }
  if (!r) return failed(tab, q, exact, "The daemon did not answer.", down);
  if (!r.ok) {
    settle(tab);
    if (r.status === 503) {
      setStatus(tab, "No Usable LLM Backend", true);
      return show(tab, caution("No Usable LLM Backend",
        "Dict writes the entries it does not have yet with Codex, and this host has no Codex CLI. Words already in the dictionary still open."));
    }
    return failed(tab, q, exact, m.error || "HTTP " + r.status);
  }
  if (m.entry) {
    tab.key = "";
    return take(tab, { entry: m.entry });
  }
  Object.assign(tab, { fid: m.flight, key: m.key, word: m.q || "", model: m.model, effort: m.effort,
    base: m.wait || 0, at: Date.now() });
  followFlight(tab);
}
function followFlight(tab) {
  begin(tab);
  const fl = flights.get(tab.fid);
  if (fl) { // what the stream already brought
    for (const line of fl.lines) take(tab, line);
    if (fl.final) take(tab, fl.final);
  }
  if (tab.fid && !stream) openStream();
}
function failed(tab, q, exact, msg, detail) {
  settle(tab);
  const again = el("button", { class: "ghost" }, "Try Again");
  again.addEventListener("click", () => {
    if (tab === active) field.value = q;
    run(tab, q, tab.src, tab.dst, exact);
  });
  show(tab, caution("“" + q + "” could not be looked up.", detail ? msg + " " + detail : msg, again));
  setStatus(tab, msg, true);
}

// peek shows on a tab what the dictionary holds for its word, and never
// starts a session: a tab coming back after a reload, or the languages
// changed under it
async function peek(tab) {
  stopTab(tab);
  const q = tidy(tab.q), pair = pairOf(tab.src, tab.dst);
  if (!q) {
    showEmpty(tab, "Type a word or phrase and press Return.");
    return setStatus(tab, pair);
  }
  const my = tab.ctrl = new AbortController();
  try {
    const r = await api("/v1/dict?" + new URLSearchParams({ from: tab.src, to: tab.dst, q }), { signal: my.signal });
    if (my !== tab.ctrl) return;
    if (r.ok) {
      const k = await r.json();
      if (my !== tab.ctrl) return;
      if (k.corrected) {
        tab.q = k.q;
        if (tab === active) { closeSuggestions(); field.value = k.q; }
        drawTab(tab);
        remember();
      }
      renderEntry(tab, k);
      return setStatus(tab, pair + " · in the dictionary since " + day(k.created));
    }
  } catch (e) {
    if (my.signal.aborted) return;
  }
  showEmpty(tab, "“" + q + "” is not in the " + pair + " dictionary yet. Look Up writes it.");
  setStatus(tab, pair);
}

field.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229 || completion.composing) return;
  if (e.key === "Escape") {
    closeSuggestions();
    e.preventDefault();
  } else if (!suggestions.hidden && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const n = completion.items.length, i = completion.index;
    selectSuggestion(i < 0 ? (e.key === "ArrowDown" ? 0 : n - 1)
      : (i + (e.key === "ArrowDown" ? 1 : -1) + n) % n);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (!suggestions.hidden && completion.index >= 0) acceptSuggestion(completion.index);
    else lookup();
  } else if (e.key === "Tab") {
    closeSuggestions();
  }
});
field.addEventListener("input", () => { remember(); suggestWords(); });
// the circled x empties the field; pressed, it keeps the caret where it was
// (a phone's keyboard stays up)
$("#qx").addEventListener("pointerdown", e => e.preventDefault());
$("#qx").addEventListener("click", () => {
  closeSuggestions();
  field.value = "";
  field.focus();
  remember();
});
$("#go").addEventListener("click", () => lookup());
// a change of languages shows the word in the new pair, on the open tab —
// or, while that tab writes, on a new one beside it
for (const s of [from, to]) s.addEventListener("change", () => {
  closeSuggestions();
  const q = tidy(field.value);
  let tab = active;
  if (!tab) {
    remember();
    paintStatus();
    loadDaily();
    return;
  }
  if (tab.busy) {
    if (!q) return;
    tab = newTab({ src: from.value, dst: to.value, q, after: active });
    activate(tab);
  }
  Object.assign(tab, { src: from.value, dst: to.value, q, exact: false });
  drawTab(tab);
  remember();
  peek(tab);
  field.focus();
});

// ---- the tabs this browser had open: each comes back as it was ----
// a tab that was writing goes back to its session (the daemon joins it, or
// finds what it kept); the others show what the dictionary holds and ask
// for nothing. The single-word state of the first version comes back as
// one tab.
(function restore() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  const pair = Array.isArray(saved.tabs) ? saved.tabs[saved.active | 0] || saved : saved;
  from.value = okFrom(pair.from) ? pair.from : "en";
  to.value = okTo(pair.to) ? pair.to : "zh";
  const seen = new Set();
  recent = (Array.isArray(saved.recent) ? saved.recent : []).filter(item => {
    if (!item || !okFrom(item.from) || !okTo(item.to) || typeof item.q !== "string" || !tidy(item.q)) return false;
    const key = recentKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, 10).map(item => ({ from: item.from, to: item.to, q: tidy(item.q), exact: !!item.exact }));
  let list = Array.isArray(saved.tabs) ? saved.tabs : [saved];
  // Old empty "New Tab" placeholders become the welcome page. A saved
  // empty array stays empty; restoring tabs never changes lookup history.
  list = list.filter(t => t && typeof t.q === "string" && tidy(t.q)).slice(0, 12);
  for (const t of list) Object.assign(newTab({ src: okFrom(t.from) ? t.from : "en", dst: okTo(t.to) ? t.to : "zh",
    q: typeof t.q === "string" ? tidy(t.q) : "", exact: !!t.exact }), { pending: !!t.pending, unseen: !!t.unseen });
  activate(tabs[Math.min(Math.max(0, saved.active | 0), tabs.length - 1)] || null);
  if (typeof saved.field === "string") field.value = saved.field;
  for (const t of tabs) {
    if (t.pending && t.q) run(t, t.q, t.src, t.dst, t.exact);
    else peek(t);
    delete t.pending;
  }
})();
if (!IS_MOBILE) field.focus();

// ---- on its own on a phone: the keyboard ----
// iOS keeps the layout viewport at full height under the keyboard and pans
// it to show the focused field, which took the toolbar — the field itself —
// off the top of the screen. The visual viewport knows what shows: the page
// takes its height (--vvh), the pan is undone, and the status line drops
// the home indicator's room while the keys cover it. The desktop's
// fitViewport, for a Dict opened as a home-screen app or a bare page; in the
// desktop's window, the desktop does this for the whole window.
if (IS_MOBILE && window.parent === window && window.visualViewport) {
  const vv = window.visualViewport;
  let lastH = 0;
  const fitViewport = () => {
    if (vv.offsetTop > 0 || window.scrollY > 0) window.scrollTo(0, 0);
    const h = Math.round(vv.height);
    if (h === lastH) return;
    lastH = h;
    document.documentElement.style.setProperty("--vvh", h + "px");
    document.body.classList.toggle("kb", h < window.innerHeight - 120);
  };
  vv.addEventListener("resize", fitViewport);
  vv.addEventListener("scroll", fitViewport);
  window.addEventListener("scroll", fitViewport);
  fitViewport();
}

// ---- desktop window plumbing (same bridge as Notes and Hub) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  t.classList.toggle("scrolled-y", t.scrollTop >= 1);
  t.classList.toggle("at-y-end", t.scrollTop >= 1 && t.scrollTop >= t.scrollHeight - t.clientHeight - 1);
}, { capture: true, passive: true });
</script>
